<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wokker · Админ</title>
<style>
  :root {
    --bg: #F5F5F7; --card-bg: #FFFFFF; --text-main: #1C1C1E;
    --text-muted: #8E8E93; --accent: #FF3B30; --accent-soft: #FFEBEA;
    --green: #34C759; --green-soft: #E8F8EB;
    --amber: #FF9500; --amber-soft: #FFF4E0;
    --blue: #007AFF; --blue-soft: #E5F0FF;
    --purple: #AF52DE; --purple-soft: #F4E5FB;
    --border: rgba(0,0,0,0.08); --sidebar: #1C1C1E; --sidebar-hover: #2C2C2E;
    --shadow: 0 4px 16px rgba(0,0,0,0.06); --shadow-lg: 0 24px 64px rgba(0,0,0,0.14);
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text-main); font-size: 14px;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  button, input, select, textarea { font-family: inherit; font-size: inherit; }
  button { cursor: pointer; }

  #login-screen {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #1C1C1E 0%, #2C2C2E 100%); z-index: 2000;
    padding: 20px;
  }
  .login-card {
    background: #fff; border-radius: 24px; padding: 40px; width: 100%; max-width: 420px;
    box-shadow: 0 32px 80px rgba(0,0,0,0.4);
  }
  .login-card h1 { font-size: 26px; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.5px; }
  .login-card .sub { color: var(--text-muted); margin-bottom: 24px; font-size: 14px; }
  .login-logo { width: 60px; height: 60px; background: #F8F9FA; border-radius: 18px;
    display: flex; align-items: center; justify-content: center; font-size: 32px; margin-bottom: 20px; }
  .login-input {
    width: 100%; border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; font-size: 15px; background: #F8F9FA; outline: none;
    margin-bottom: 12px; font-weight: 600; color: var(--text-main);
  }
  .login-input:focus { border-color: var(--accent); background: #fff; }
  .login-btn {
    width: 100%; background: var(--accent); color: #fff; border: 0; border-radius: 12px;
    padding: 14px; font-size: 15px; font-weight: 700; margin-top: 8px;
  }
  .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .login-error { color: var(--accent); font-size: 13px; min-height: 18px;
    margin-top: 10px; font-weight: 600; line-height: 1.4; }

  #app { display: none; min-height: 100vh; }
  .layout { display: flex; min-height: 100vh; }
  .sidebar {
    width: 240px; background: var(--sidebar); color: #fff; padding: 20px 12px;
    display: flex; flex-direction: column; flex-shrink: 0;
    position: sticky; top: 0; height: 100vh;
  }
  .sidebar-logo {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px 24px;
    font-weight: 800; font-size: 17px; letter-spacing: -0.3px;
  }
  .sidebar-logo .badge { background: var(--accent); color: #fff; font-size: 10px;
    padding: 3px 7px; border-radius: 6px; font-weight: 800; text-transform: uppercase; }
  .sidebar nav { display: flex; flex-direction: column; gap: 2px; flex: 1; overflow-y: auto; }
  .nav-item {
    background: none; border: 0; color: rgba(255,255,255,0.7); text-align: left;
    padding: 10px 14px; border-radius: 10px; font-size: 14px; font-weight: 500;
    display: flex; align-items: center; gap: 10px; white-space: nowrap;
  }
  .nav-item:hover { background: var(--sidebar-hover); color: #fff; }
  .nav-item.active { background: var(--accent); color: #fff; font-weight: 600; }
  .nav-item .ico { width: 18px; display: inline-block; text-align: center; }
  .nav-item .count { margin-left: auto; background: rgba(255,255,255,0.15);
    padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .sidebar-footer {
    padding: 14px; border-top: 1px solid rgba(255,255,255,0.1);
    margin-top: 12px; font-size: 12px; color: rgba(255,255,255,0.6);
  }
  .sidebar-footer .who { color: #fff; font-weight: 600; font-size: 13px; margin-bottom: 2px; }
  .sidebar-footer .login-line { font-family: monospace; color: rgba(255,255,255,0.8); margin-bottom: 4px; }
  .sidebar-footer .badge-role { display: inline-block; font-size: 10px; font-weight: 800;
    padding: 2px 6px; border-radius: 4px; margin-bottom: 8px; text-transform: uppercase; }
  .sidebar-footer .badge-role.super { background: var(--purple); color: #fff; }
  .sidebar-footer .badge-role.hr { background: var(--blue); color: #fff; }
  .sidebar-footer .badge-role.regular { background: rgba(255,255,255,0.2); color: #fff; }
  .sidebar-footer button {
    background: rgba(255,255,255,0.1); border: 0; color: #fff;
    padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 600;
    width: 100%; margin-top: 6px;
  }
  .sidebar-footer button:hover { background: rgba(255,255,255,0.2); }
  .sidebar-footer button.danger:hover { background: rgba(255,59,48,0.7); }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    padding: 20px 32px; background: var(--card-bg); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    position: sticky; top: 0; z-index: 50;
  }
  .topbar h2 { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }
  .topbar .actions { display: flex; gap: 8px; align-items: center; }
  .content { padding: 24px 32px; flex: 1; }

  .btn { border: 0; border-radius: 10px; padding: 10px 18px; font-size: 13px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 6px; background: #F2F2F7; color: var(--text-main); }
  .btn:hover { background: #E5E5EA; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.primary:hover { background: #E6342A; }
  .btn.ghost { background: transparent; border: 1px solid var(--border); }
  .btn.small { padding: 6px 12px; font-size: 12px; }
  .btn.danger { background: var(--accent-soft); color: var(--accent); }
  .btn.green { background: var(--green); color: #fff; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .table-card { background: var(--card-bg); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 14px 18px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { background: #F8F9FA; font-weight: 700; font-size: 11px;
    text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #FAFAFA; }
  .row-clickable { cursor: pointer; }
  tr.fired-row td { opacity: 0.65; }

  .tag { display: inline-block; padding: 3px 8px; border-radius: 6px;
    font-size: 11px; font-weight: 700; white-space: nowrap; }
  .tag.green { background: var(--green-soft); color: #1B7A36; }
  .tag.red { background: var(--accent-soft); color: var(--accent); }
  .tag.gray { background: #F2F2F7; color: var(--text-muted); }
  .tag.amber { background: var(--amber-soft); color: #C77700; }
  .tag.blue { background: var(--blue-soft); color: #0055CC; }
  .tag.purple { background: var(--purple-soft); color: #7C3FA8; }
  .tag-stack { display: flex; gap: 4px; flex-wrap: wrap; }
  .login-cell { font-family: monospace; font-weight: 700; font-size: 12px;
    background: #F2F2F7; padding: 2px 6px; border-radius: 4px; }

  .actions-cell { display: flex; gap: 6px; justify-content: flex-end; }
  .icon-btn {
    background: #F2F2F7; border: 0; border-radius: 8px; width: 30px; height: 30px;
    display: inline-flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .icon-btn:hover { background: #E5E5EA; }
  .icon-btn.danger { background: var(--accent-soft); color: var(--accent); }
  .icon-btn.fire { background: var(--accent-soft); color: var(--accent); }
  .icon-btn.restore { background: var(--green-soft); color: #1B7A36; }

  .search-bar { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; }
  .search-bar input {
    flex: 1; max-width: 360px; border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; font-size: 14px; outline: none; background: #fff;
  }
  .search-bar input:focus { border-color: var(--accent); }

  .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat-card { background: var(--card-bg); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); }
  .stat-card .label { font-size: 12px; color: var(--text-muted); font-weight: 600;
    margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-card .value { font-size: 28px; font-weight: 800; letter-spacing: -1px; }
  .stat-card .hint { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
  .stat-card.accent .value { color: var(--accent); }
  .stat-card.green .value { color: var(--green); }
  .stat-card.amber .value { color: var(--amber); }

  .chart-card { background: var(--card-bg); border-radius: 14px; padding: 24px;
    box-shadow: var(--shadow); margin-bottom: 16px; }
  .chart-card h3 { font-size: 14px; font-weight: 700; margin-bottom: 20px;
    text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }

  .empty { text-align: center; padding: 60px 20px; color: var(--text-muted);
    background: var(--card-bg); border-radius: 14px; box-shadow: var(--shadow); }
  .empty .emoji { font-size: 48px; margin-bottom: 12px; display: block; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: none; align-items: center; justify-content: center; z-index: 1000;
    padding: 20px; backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 16px; width: 100%; max-width: 640px;
    max-height: 92vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
  .modal.wide { max-width: 820px; }
  .modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; background: #fff; z-index: 1; }
  .modal-header h3 { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
  .modal-close { background: #F2F2F7; border: 0; width: 32px; height: 32px; border-radius: 8px;
    font-size: 18px; display: flex; align-items: center; justify-content: center; }
  .modal-body { padding: 24px; }
  .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; gap: 8px; position: sticky; bottom: 0; background: #fff; }
  .modal-footer .right-side { display: flex; gap: 8px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted);
    margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .form-input, .form-select, .form-textarea {
    width: 100%; border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 14px; font-size: 14px; outline: none; background: #fff; color: var(--text-main);
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
  .form-input[readonly] { background: #F2F2F7; color: var(--text-muted); cursor: not-allowed;
    font-family: monospace; font-weight: 700; }
  .form-textarea { resize: vertical; min-height: 80px; font-family: inherit; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .form-hint.error { color: var(--accent); font-weight: 600; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; }
  .checkbox-row input { width: 18px; height: 18px; accent-color: var(--accent); }
  .checkbox-row label { font-size: 14px; font-weight: 500; cursor: pointer;
    text-transform: none; letter-spacing: 0; color: var(--text-main); margin: 0; }

  .perm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .perm-item {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    background: #F8F9FA; border-radius: 10px; font-size: 13px;
    border: 1px solid transparent; cursor: pointer;
  }
  .perm-item.checked { background: var(--green-soft); border-color: rgba(52,199,89,0.3); }
  .perm-item input { width: 16px; height: 16px; accent-color: var(--green); flex-shrink: 0; }
  .perm-item .perm-icon { font-size: 15px; }
  .perm-item .perm-label { flex: 1; font-weight: 500; color: var(--text-main); }

  .login-preview {
    background: var(--green-soft); border: 1px solid rgba(52,199,89,0.3);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .login-preview .lp-icon { font-size: 24px; }
  .login-preview .lp-label { font-size: 11px; font-weight: 700; color: #1B7A36;
    text-transform: uppercase; letter-spacing: 0.5px; }
  .login-preview .lp-value { font-family: monospace; font-size: 20px; font-weight: 800;
    color: #1B7A36; letter-spacing: 1px; }
  .login-preview .lp-hint { font-size: 11px; color: #1B7A36; opacity: 0.8; margin-top: 2px; }

  .pending-card {
    background: linear-gradient(135deg, #FFF9E6 0%, #FFF4D6 100%);
    border-radius: 14px; padding: 16px 20px; margin-bottom: 12px;
    border: 1px solid rgba(255,149,0,0.25);
  }
  .pending-card .pc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .pending-card .pc-author { font-size: 12px; color: #C77700; font-weight: 700; }
  .pending-card .pc-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .pending-card .pc-body { font-size: 13px; color: #6B5A2E; margin-bottom: 12px; line-height: 1.4; }
  .pending-card .pc-actions { display: flex; gap: 8px; }

  .subtabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
  .subtab { background: none; border: 0; padding: 10px 16px; font-size: 13px; font-weight: 600;
    color: var(--text-muted); border-bottom: 2px solid transparent; cursor: pointer; }
  .subtab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .subtab:hover { color: var(--text-main); }
  .subtab .tab-count { display: inline-block; background: #F2F2F7; color: var(--text-muted);
    padding: 1px 6px; border-radius: 8px; font-size: 11px; margin-left: 6px; }
  .subtab.active .tab-count { background: var(--accent-soft); color: var(--accent); }

  .medbook-section { margin-bottom: 24px; }
  .medbook-section h4 { font-size: 13px; font-weight: 800; text-transform: uppercase;
    color: var(--text-muted); letter-spacing: 0.5px; margin-bottom: 12px; padding-bottom: 8px;
    border-bottom: 1px solid var(--border); }
  .medbook-row {
    display: grid; grid-template-columns: 1fr 140px 90px; gap: 12px; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .medbook-row:last-child { border-bottom: none; }
  .medbook-row .name { font-weight: 600; }
  .medbook-row input {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 13px; font-family: monospace; text-align: center;
    outline: none; font-weight: 600;
  }
  .medbook-row input:focus { border-color: var(--accent); }
  .medbook-row input.err { border-color: var(--accent); background: var(--accent-soft); }
  .medbook-row .status { font-size: 11px; font-weight: 700; text-align: center; }
  .medbook-row .status.ok { color: #1B7A36; }
  .medbook-row .status.expiring { color: #C77700; }
  .medbook-row .status.expired, .medbook-row .status.missing { color: var(--accent); }

  .ref-row {
    display: grid; grid-template-columns: 1fr 100px 80px 60px; gap: 10px;
    align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .ref-row:last-child { border-bottom: none; }
  .ref-row .ref-name { font-weight: 600; }
  .ref-row .ref-badge { font-size: 11px; font-weight: 700; padding: 2px 8px;
    border-radius: 6px; text-align: center; }
  .ref-row .ref-badge.req { background: var(--accent-soft); color: var(--accent); }
  .ref-row .ref-badge.opt { background: #F2F2F7; color: var(--text-muted); }
  .ref-row .ref-months { font-size: 12px; color: var(--text-muted); text-align: center; }

  .medbook-status-banner {
    padding: 14px 18px; border-radius: 12px; margin-bottom: 20px;
    display: flex; align-items: center; gap: 12px; font-size: 13px; line-height: 1.5;
  }
  .medbook-status-banner.ok { background: var(--green-soft); color: #1B7A36; border: 1px solid rgba(52,199,89,0.3); }
  .medbook-status-banner.expiring { background: var(--amber-soft); color: #C77700; border: 1px solid rgba(255,149,0,0.3); }
  .medbook-status-banner.invalid { background: var(--accent-soft); color: var(--accent); border: 1px solid rgba(255,59,48,0.3); }

  .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 3000;
    display: flex; flex-direction: column; gap: 10px; }
  .toast { background: rgba(28, 28, 30, 0.96); color: #fff; padding: 14px 20px;
    border-radius: 12px; font-size: 13px; font-weight: 600; max-width: 380px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2); animation: slideIn 0.25s ease; }
  .toast.error { background: rgba(255, 59, 48, 0.96); }
  .toast.success { background: rgba(52, 199, 89, 0.96); }
  @keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  .loading { text-align: center; padding: 60px; color: var(--text-muted); }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">🛠</div>
    <h1>Wokker Admin</h1>
    <div class="sub">Вход в панель управления</div>
    <input class="login-input" id="login-login" type="text" placeholder="Логин" maxlength="5"
           style="text-transform: lowercase;" autocomplete="username">
    <input class="login-input" id="login-password" type="password" placeholder="Пароль"
           autocomplete="current-password">
    <button class="login-btn" id="login-btn">Войти</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div id="app">
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-logo">🍜 Wokker <span class="badge">Admin</span></div>
      <nav id="nav">
        <button class="nav-item" data-sec="dashboard"><span class="ico">📊</span> Дашборд</button>
        <button class="nav-item" data-sec="users"><span class="ico">👥</span> Сотрудники</button>
        <button class="nav-item" data-sec="medbooks"><span class="ico">🩺</span> Медкнижки</button>
        <button class="nav-item" data-sec="restaurants"><span class="ico">🏪</span> Рестораны</button>
        <button class="nav-item" data-sec="news"><span class="ico">📰</span> Новости <span class="count" id="news-pending-count" style="display:none;">0</span></button>
        <button class="nav-item" data-sec="standards"><span class="ico">📚</span> Стандарты</button>
        <button class="nav-item" data-sec="faq"><span class="ico">❓</span> FAQ</button>
        <button class="nav-item" data-sec="positions"><span class="ico">💼</span> Должности</button>
        <button class="nav-item" data-sec="questions"><span class="ico">💬</span> Вопросы <span class="count" id="q-count" style="display:none;">0</span></button>
        <button class="nav-item" data-sec="admins" id="nav-admins" style="display:none;"><span class="ico">👑</span> Администраторы</button>
        <button class="nav-item" data-sec="reports"><span class="ico">📈</span> Отчёты</button>
        <button class="nav-item" data-sec="audit"><span class="ico">📜</span> История</button>
      </nav>
      <div class="sidebar-footer">
        <div class="who" id="admin-name">—</div>
        <div class="login-line" id="admin-login">—</div>
        <div class="badge-role regular" id="admin-role">—</div>
        <button id="change-password-btn">🔐 Сменить пароль</button>
        <button id="logout-btn" class="danger">🚪 Выйти</button>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <h2 id="page-title">Дашборд</h2>
        <div class="actions" id="page-actions"></div>
      </div>
      <div class="content" id="page-content"></div>
    </div>
  </div>
</div>

<div class="toast-container" id="toasts"></div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-box">
    <div class="modal-header">
      <h3 id="modal-title">—</h3>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<script>
/* ================== CONSTANTS ================== */
const TOKEN_KEY = 'wokker_admin_token';
const LOGIN_RE = /^[a-z]{3}\d{2}$/;

  { key: 'users_create', label: 'Добавлять сотрудников', icon: '➕' },

/* ================== UTILS ================== */
const $ = id => document.getElementById(id);
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }
function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
function clearToken() { localStorage.removeItem(TOKEN_KEY); }

function toast(text, type) {
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = text;
  $('toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; }, 2600);
  setTimeout(() => el.remove(), 3000);
}

function fmtDate(iso, withTime) {
  if (!iso) return '—';
  try {
    const d = new Date(iso);
    const pad = n => String(n).padStart(2, '0');
    const date = `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`;
    if (!withTime) return date;
    return `${date} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  } catch (e) { return iso; }
}

async function api(path, body) {
  const payload = { webToken: getToken() };
  if (body && typeof body === 'object') Object.assign(payload, body);
  const res = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  if (res.status === 401 || res.status === 403) {
    clearToken();
    showLogin();
    throw new Error('unauthorized');
  }
  if (!res.ok) {
    let msg = 'error';
    try { const j = await res.json(); msg = j.error || msg; } catch (e) {}
    throw new Error(msg);
  }
  return res.json();
}

/* ================== PERMISSIONS ================== */
function isSuperAdmin() { return !!(ME && ME.is_super_admin); }
function isHR() { return !!(ME && ME.is_hr); }
function canPublishNews() { return isSuperAdmin() || isHR(); }
function hasPerm(perm) {
  if (!ME) return false;
  if (ME.is_super_admin) return true;
  if (ME.is_hr) return true;
  return !!(ME.permissions && ME.permissions[perm]);
}

/* ================== LOGIN ================== */
function showLogin() {
  $('app').style.display = 'none';
  $('login-screen').style.display = 'flex';
  $('login-error').textContent = '';
  $('login-login').value = '';
  $('login-password').value = '';
}
function showApp() {
  $('login-screen').style.display = 'none';
  $('app').style.display = 'block';
}

$('login-login').addEventListener('input', e => {
  e.target.value = e.target.value.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 5);
});

async function doLogin() {
  const login = $('login-login').value.trim().toLowerCase();
  const password = $('login-password').value;
  const errEl = $('login-error');
  errEl.textContent = '';
  if (!LOGIN_RE.test(login)) { errEl.textContent = 'Логин: 3 латинские буквы + 2 цифры'; return; }
  if (!password) { errEl.textContent = 'Введите пароль'; return; }
  const btn = $('login-btn');
  btn.disabled = true; btn.textContent = 'Проверяем…';
  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ login, password }),
    });
    if (res.status === 401) { errEl.textContent = '❌ Неверный логин или пароль'; return; }
    if (res.status === 403) { errEl.textContent = '❌ Аккаунт уволен или нет прав администратора'; return; }
    if (!res.ok) { errEl.textContent = 'Ошибка сервера'; return; }
    const data = await res.json();
    if (!data.token) { errEl.textContent = 'Ошибка'; return; }
    setToken(data.token);
    await checkAdminAndLoad();
  } catch (e) {
    errEl.textContent = 'Сеть недоступна';
  } finally {
    btn.disabled = false; btn.textContent = 'Войти';
  }
}

$('login-btn').addEventListener('click', doLogin);
$('login-password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
$('login-login').addEventListener('keydown', e => { if (e.key === 'Enter') $('login-password').focus(); });

async function checkAdminAndLoad() {
  try {
    const res = await api('/api/admin/me', {});
    ME = res.profile;
    $('admin-name').textContent = ME.full_name;
    $('admin-login').textContent = '@' + ME.login;
    const roleEl = $('admin-role');
    if (ME.is_super_admin) { roleEl.textContent = '👑 Супер-админ'; roleEl.className = 'badge-role super'; }
    else if (ME.is_hr) { roleEl.textContent = '💼 HR'; roleEl.className = 'badge-role hr'; }
    else { roleEl.textContent = '🛡 Админ'; roleEl.className = 'badge-role regular'; }
    $('nav-admins').style.display = ME.is_super_admin ? 'flex' : 'none';
    showApp();
    navigate('dashboard');
    refreshCounters();
  } catch (e) {
    showLogin();
    $('login-error').textContent = 'Ошибка: ' + e.message;
  }
}

$('logout-btn').addEventListener('click', async () => {
  if (!confirm('Выйти?')) return;
  try { await api('/api/auth/logout', {}); } catch (e) {}
  clearToken();
  ME = null;
  showLogin();
});

/* ================== CHANGE PASSWORD ================== */
function openChangePassword() {
  openModal('🔐 Сменить пароль', `
    <div class="form-group"><label>Текущий пароль</label><input class="form-input" id="cp-old" type="password"></div>
    <div class="form-group"><label>Новый пароль</label><input class="form-input" id="cp-new" type="password"><div class="form-hint">Минимум 6 символов</div></div>
    <div class="form-group"><label>Повторите</label><input class="form-input" id="cp-new2" type="password"></div>
    <div class="form-hint error" id="cp-error"></div>
  `, `<button class="btn ghost" onclick="closeModal()">Отмена</button><button class="btn primary" id="cp-save">Сохранить</button>`);
  $('cp-save').addEventListener('click', async () => {
    const errEl = $('cp-error');
    errEl.textContent = '';
    if (!$('cp-old').value) { errEl.textContent = 'Введите текущий пароль'; return; }
    if (!$('cp-new').value || $('cp-new').value.length < 6) { errEl.textContent = 'Новый минимум 6'; return; }
    if ($('cp-new').value !== $('cp-new2').value) { errEl.textContent = 'Пароли не совпадают'; return; }
    try {
      await api('/api/admin/change-password', { old_password: $('cp-old').value, new_password: $('cp-new').value });
      toast('Пароль изменён', 'success'); closeModal();
    } catch (e) {
      if (e.message === 'wrong_password') errEl.textContent = 'Текущий пароль неверный';
      else errEl.textContent = 'Ошибка';
    }
  });
}

/* ================== MODAL ================== */
function openModal(title, bodyHtml, footerHtml, opts) {
  opts = opts || {};
  $('modal-title').textContent = title;
  $('modal-body').innerHTML = bodyHtml;
  $('modal-footer').innerHTML = footerHtml || '';
  $('modal-box').className = 'modal' + (opts.wide ? ' wide' : '');
  $('modal-overlay').classList.add('show');
}
function closeModal() { $('modal-overlay').classList.remove('show'); }
$('modal-close').addEventListener('click', closeModal);
$('modal-overlay').addEventListener('click', e => { if (e.target === $('modal-overlay')) closeModal(); });

function navigate(sec) {
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.sec === sec));
  $('page-title').textContent = SECTION_TITLES[sec];
  $('page-actions').innerHTML = '';
  $('page-content').innerHTML = '<div class="loading">Загрузка…</div>';
  try { SECTION_LOADERS[sec](); }
  catch (e) { console.error('load:', e); $('page-content').innerHTML = '<div class="empty">Ошибка: ' + esc(e.message) + '</div>'; }
}
async function refreshCounters() {
  try {
    const q = await api('/api/admin/questions', {});
    const open = (q.questions || []).filter(x => !x.replied).length;
    const qEl = $('q-count');
    if (open > 0) { qEl.textContent = open; qEl.style.display = 'inline-block'; }
    else qEl.style.display = 'none';
  } catch (e) {}
  try {
    const n = await api('/api/admin/news', {});
    const pending = (n.news || []).filter(x => x.status === 'pending').length;
    const nEl = $('news-pending-count');
    if (pending > 0 && canPublishNews()) { nEl.textContent = pending; nEl.style.display = 'inline-block'; }
    else nEl.style.display = 'none';
  } catch (e) {}
}

async function loadDashboard() {
  const { stats } = await api('/api/admin/dashboard', {});
  const attention = [];
  if (stats.questions_open > 0) attention.push(`❓ ${stats.questions_open} вопросов без ответа`);
  if (canPublishNews() && stats.news_pending > 0) attention.push(`💭 ${stats.news_pending} новостей на модерации`);
  $('page-content').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card accent"><div class="label">Сегодня</div><div class="value">+${stats.new_today}</div><div class="hint">новых</div></div>
      <div class="stat-card green"><div class="label">Активных</div><div class="value">${stats.active}</div><div class="hint">из ${stats.total}</div></div>
      <div class="stat-card"><div class="label">За 7 дней</div><div class="value">${stats.new7}</div></div>
      <div class="stat-card amber"><div class="label">Уволено</div><div class="value">${stats.fired}</div></div>
    </div>
    ${attention.length ? `
      <div class="chart-card"><h3>Требует внимания</h3>
        ${attention.map(a => `<div style="padding:12px;background:#FFF4E0;border-radius:10px;color:#C77700;font-weight:600;margin-bottom:8px;">${a}</div>`).join('')}
      </div>` : ''}`;
}

/* ================== USERS ================== */
let _usersCurrentSearch = '';
let _usersTab = 'active';

async function loadUsers(search) {
  _usersCurrentSearch = search || '';
  const canCreate = hasPerm('users_create');
  $('page-actions').innerHTML = `
    ${canCreate ? '<button class="btn primary small" id="users-create">+ Создать сотрудника</button>' : ''}`;
  if (canCreate) $('users-create').addEventListener('click', openUserCreate);

  $('page-content').innerHTML = `
    <div class="subtabs">
      <button class="subtab ${_usersTab==='active'?'active':''}" data-users-tab="active">Активные</button>
      <button class="subtab ${_usersTab==='fired'?'active':''}" data-users-tab="fired">Уволенные</button>
    </div>
    <div class="search-bar"><input id="users-search" placeholder="Поиск по логину, ФИО, телефону, ID…" value="${esc(_usersCurrentSearch)}" autocomplete="off"></div>
    <div class="table-card"><div class="table-wrap"><table id="users-table">
      <thead id="users-thead"></thead>
      <tbody id="users-tbody"></tbody>
    </table></div></div>`;

  document.querySelectorAll('[data-users-tab]').forEach(t => t.addEventListener('click', () => {
    _usersTab = t.dataset.usersTab;
    loadUsers(_usersCurrentSearch);
  }));

  const thead = $('users-thead');
  if (_usersTab === 'fired') {
    thead.innerHTML = '<tr><th>Логин</th><th>ФИО</th><th>Должность</th><th>Ресторан</th><th>Уволен</th><th>Кем</th><th></th></tr>';
  } else {
    thead.innerHTML = '<tr><th>Логин</th><th>ФИО</th><th>Телефон</th><th>Должность</th><th>Ресторан</th><th>Статусы</th><th>Медкнижка</th><th>Был(а)</th><th></th></tr>';
  }

  const inp = $('users-search');
  let timer = null;
  inp.addEventListener('input', () => {
    _usersCurrentSearch = inp.value;
    clearTimeout(timer);
    timer = setTimeout(() => refreshUsersTable(_usersCurrentSearch.trim()), 200);
  });

  $('users-tbody').addEventListener('click', (e) => {
    const e1 = e.target.closest('[data-edit]'); if (e1) { e.stopPropagation(); openUserEditor(parseInt(e1.dataset.edit)); return; }
    const e2 = e.target.closest('[data-medbook]'); if (e2) { e.stopPropagation(); openMedbookEditor(parseInt(e2.dataset.medbook)); return; }
    const e3 = e.target.closest('[data-fire]'); if (e3) { e.stopPropagation(); fireUser(parseInt(e3.dataset.fire)); return; }
    const e4 = e.target.closest('[data-restore]'); if (e4) { e.stopPropagation(); restoreUser(parseInt(e4.dataset.restore)); return; }
    const tr = e.target.closest('tr[data-uid]'); if (tr) openUserEditor(parseInt(tr.dataset.uid));
  });

  const data = await api('/api/admin/users', { search: _usersCurrentSearch.trim(), fired: _usersTab === 'fired' });
  renderUsersTbody(data.users);
  if (_usersCurrentSearch) { inp.focus(); const l = inp.value.length; inp.setSelectionRange(l, l); }
}
async function refreshUsersTable(search) {
  _usersCurrentSearch = search || '';
  const data = await api('/api/admin/users', { search: _usersCurrentSearch, fired: _usersTab === 'fired' });
  renderUsersTbody(data.users);
}
function renderUsersTbody(users) {
  const tbody = $('users-tbody');
  if (!tbody) return;
  if (!users.length) {
    tbody.innerHTML = `<tr><td colspan="${_usersTab === 'fired' ? 7 : 9}"><div class="empty">${_usersTab === 'fired' ? 'Уволенных нет' : 'Нет сотрудников'}</div></td></tr>`;
    return;
  }
  const canEdit = hasPerm('users_edit');
  const canMedbook = hasPerm('medbook_edit');
  const canFire = hasPerm('users_fire');

  tbody.innerHTML = users.map(u => {
    if (_usersTab === 'fired') {
      return `
        <tr class="row-clickable fired-row" data-uid="${u.user_id}">
          <td>${u.login ? `<span class="login-cell">${esc(u.login)}</span>` : '<span class="tag gray">нет</span>'}</td>
          <td><b>${esc(u.full_name || '—')}</b></td>
          <td>${esc(u.position || '—')}</td>
          <td>${esc(u.restaurant_name || '—')}</td>
          <td style="font-size:12px;color:var(--text-muted);">${fmtDate(u.fired_at, false)}</td>
          <td style="font-size:12px;color:var(--text-muted);">${esc(u.fired_by || '—')}</td>
          <td class="actions-cell">
            ${canFire ? `<button class="icon-btn restore" data-restore="${u.user_id}" title="Восстановить">↩️</button>` : ''}
          </td>
        </tr>`;
    }
    const tags = [];
    if (u.is_super_admin) tags.push('<span class="tag purple">👑</span>');
    else if (u.is_admin) tags.push('<span class="tag blue">🛡</span>');
    if (u.is_certified) tags.push('<span class="tag green">📜</span>');
    else tags.push('<span class="tag gray">📜</span>');
    const mbStatus = u.medbook_status || 'invalid';
    let mbTag = '';
    if (u.is_admin) mbTag = '<span class="tag gray">—</span>';
    else if (mbStatus === 'ok') mbTag = '<span class="tag green">✅ Действительна</span>';
    else if (mbStatus === 'expiring') mbTag = '<span class="tag amber">⚠️ Скоро истекает</span>';
    else mbTag = '<span class="tag red">❌ Недействительна</span>';
    const showFireBtn = canFire && !u.is_super_admin && u.user_id !== ME.user_id;
    return `
      <tr class="row-clickable" data-uid="${u.user_id}">
        <td>${u.login ? `<span class="login-cell">${esc(u.login)}</span>` : '<span class="tag gray">нет</span>'}</td>
        <td><b>${esc(u.full_name || '—')}</b></td>
        <td>${esc(u.phone || '—')}</td>
        <td>${esc(u.position || '—')}</td>
        <td>${esc(u.restaurant_name || '—')}</td>
        <td><div class="tag-stack">${tags.join('')}</div></td>
        <td>${mbTag}</td>
        <td style="font-size:12px;color:var(--text-muted);">${fmtDate(u.last_seen_at, false)}</td>
        <td class="actions-cell">
          ${!u.is_admin && canMedbook ? `<button class="icon-btn" data-medbook="${u.user_id}" title="Медкнижка">🩺</button>` : ''}
          ${canEdit ? `<button class="icon-btn" data-edit="${u.user_id}">✏️</button>` : ''}
          ${showFireBtn ? `<button class="icon-btn fire" data-fire="${u.user_id}" title="Уволить">🚪</button>` : ''}
        </td>
      </tr>`;
  }).join('');
}

async function fireUser(uid) {
  if (!confirm('Уволить сотрудника? Он потеряет доступ и переместится во вкладку «Уволенные».')) return;
  try {
    await api('/api/admin/user/fire', { user_id: uid });
    toast('Сотрудник уволен', 'success');
    loadUsers(_usersCurrentSearch);
  } catch (e) {
    const map = { forbidden: 'Нет права увольнять', cannot_fire_super: 'Нельзя уволить супер-админа',
      cannot_fire_self: 'Нельзя уволить себя', already_fired: 'Уже уволен' };
    toast(map[e.message] || 'Ошибка: ' + e.message, 'error');
  }
}
async function restoreUser(uid) {
  if (!confirm('Восстановить сотрудника?')) return;
  try {
    await api('/api/admin/user/restore', { user_id: uid });
    toast('Восстановлен', 'success');
    loadUsers(_usersCurrentSearch);
  } catch (e) { toast('Ошибка: ' + e.message, 'error'); }
}

function openUserCreate() {
  if (!hasPerm('users_create')) { toast('Нет права', 'error'); return; }
  Promise.all([
    api('/api/admin/restaurants', {}),
    api('/api/admin/positions', {}),
  ]).then(([restData, posData]) => {
    const restOpts = restData.restaurants.map(r => `<option value="${esc(r.key)}">${esc(r.name)}</option>`).join('');
    const posOpts = posData.positions.filter(p => !p.is_archived).map(p => `<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('');
    openModal('Создать сотрудника', `
      <div class="form-group">
        <label>ФИО</label>
        <input class="form-input" id="nc-name" placeholder="Иванов Иван Иванович" autocomplete="off">
        <div class="form-hint">Логин будет сгенерирован из фамилии автоматически</div>
      </div>
      <div class="form-group"><label>Пароль</label><input class="form-input" id="nc-password" placeholder="Минимум 6 символов"></div>
      <div class="form-row">
        <div class="form-group"><label>Телефон</label><input class="form-input" id="nc-phone"></div>
        <div class="form-group"><label>Дата рождения</label><input class="form-input" id="nc-birth" placeholder="ДД.ММ.ГГГГ"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Должность</label><select class="form-select" id="nc-position">${posOpts}</select></div>
        <div class="form-group"><label>Ресторан</label><select class="form-select" id="nc-restaurant"><option value="">—</option>${restOpts}</select></div>
      </div>
      <div class="form-group"><div class="checkbox-row"><input type="checkbox" id="nc-cert"><label for="nc-cert">Сертификация пройдена</label></div></div>
      <div class="form-hint error" id="nc-error"></div>
    `, `<button class="btn ghost" onclick="closeModal()">Отмена</button><button class="btn primary" id="nc-save">Создать</button>`);
    $('nc-save').addEventListener('click', async () => {
      const errEl = $('nc-error');

      try {
        const res = await api('/api/admin/user/create', {
          password, full_name: name,
          phone: $('nc-phone').value.trim(), birth_date: $('nc-birth').value.trim(),
          position: $('nc-position').value, restaurant: $('nc-restaurant').value,
          is_certified: $('nc-cert').checked,
        });
        closeModal();
        openModal('✅ Сотрудник создан', `
          <div style="text-align:center; padding: 10px 0;">
            <div style="font-size:48px; margin-bottom:12px;">🎉</div>
            <div style="font-size:18px; font-weight:800; margin-bottom:6px;">${esc(res.user.full_name)}</div>
            <div class="login-preview" style="display:inline-flex; text-align:left; margin:16px auto 0;">
              <div class="lp-icon">🔑</div>
              <div><div class="lp-label">Логин</div>
              <div class="lp-value" style="font-size:24px;">${esc(res.user.login)}</div>
              <div class="lp-hint">Сообщите сотруднику вместе с паролем</div></div>

// Клиентские хелперы для статуса (для real-time в модалке)
function parseDdMmYyyy(s) {
  if (!s) return null;
  const m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(s.trim());
  if (!m) return null;
  const d = new Date(+m[3], +m[2] - 1, +m[1]);
  if (isNaN(d.getTime())) return null;
  if (d.getDate() !== +m[1] || d.getMonth() !== +m[2] - 1) return null;
  return d;
}
function addMonthsClient(d, months) {
  const r = new Date(d);
  r.setMonth(r.getMonth() + months);
  return r;
}
function entryStatusClient(dateStr, validityMonths) {
  if (!dateStr) return 'missing';
  const d = parseDdMmYyyy(dateStr);
  if (!d) return 'invalid_date';
  const exp = addMonthsClient(d, validityMonths);
  const now = new Date();
  if (exp < now) return 'expired';
  if ((exp - now) / 86400000 <= 30) return 'expiring';
  return 'ok';
}

async function openMedbookEditor(userId) {
  if (!hasPerm('medbook_edit')) { toast('Нет права редактировать медкнижки', 'error'); return; }
  const data = await api('/api/admin/medbook/get', { user_id: userId });
  const { user, medbook, doctors, tests, vaccines } = data;
  const mb = medbook || { doctors: {}, tests: {}, vaccines: {} };

  const renderRows = (list, source) => list.map(item => {
    const dateStr = (mb[source] && mb[source][item.id]) || '';
    const st = entryStatusClient(dateStr, item.validity_months);
    let statusText = '', statusCls = '';
    if (st === 'missing') { statusText = 'Обязательно'; statusCls = 'missing'; }
    else if (st === 'invalid_date') { statusText = 'Дата неверна'; statusCls = 'missing'; }
    else if (st === 'expired') { statusText = 'Просрочено'; statusCls = 'expired'; }
    else if (st === 'expiring') { statusText = 'Скоро истечёт'; statusCls = 'expiring'; }
    else { statusText = 'OK'; statusCls = 'ok'; }
    return `
      <div class="medbook-row">
        <div class="name">${esc(item.name)}${item.required ? ' <span style="color:var(--accent);font-weight:800;">*</span>' : ''}</div>
        <input type="text" placeholder="ДД.ММ.ГГГГ" value="${esc(dateStr)}" data-mb-input="${source}:${item.id}">
        <div class="status ${statusCls}">${statusText}</div>
      </div>`;
  }).join('');

  openModal(`🩺 Медкнижка: ${esc(user.full_name)}`, `
    <div style="background:#F8F9FA; padding:12px 16px; border-radius:10px; margin-bottom:16px; font-size:13px;">
      <b>${esc(user.full_name)}</b> · ${esc(user.position || '—')}${user.restaurant_name ? ' · ' + esc(user.restaurant_name) : ''}
    </div>
    <div class="medbook-status-banner invalid" id="mb-banner">Статус будет рассчитан после сохранения</div>
    <div class="form-hint" style="margin-bottom:16px;">
      ⚠️ Медкнижка действительна только когда заполнены ВСЕ пункты и не просрочены. Формат даты: ДД.ММ.ГГГГ.
    </div>
    <div class="medbook-section"><h4>👨‍⚕️ Врачи</h4>${renderRows(doctors, 'doctors')}</div>
    <div class="medbook-section"><h4>🧪 Анализы</h4>${renderRows(tests, 'tests')}</div>
    <div class="medbook-section"><h4>💉 Прививки</h4>${renderRows(vaccines, 'vaccines')}</div>
    <div class="form-hint error" id="mb-error"></div>
  `, `<button class="btn ghost" onclick="closeModal()">Отмена</button><button class="btn primary" id="mb-save">Сохранить</button>`, { wide: true });

  const refreshBanner = () => {
    const newMb = { doctors: {}, tests: {}, vaccines: {} };
    document.querySelectorAll('[data-mb-input]').forEach(inp => {
      const [src, idStr] = inp.dataset.mbInput.split(':');
      const val = inp.value.trim();
      if (val) newMb[src][+idStr] = val;
    });
    const items = [
      ...doctors.map(x => ({ date: newMb.doctors[x.id], validity: x.validity_months })),
      ...tests.map(x => ({ date: newMb.tests[x.id], validity: x.validity_months })),
      ...vaccines.map(x => ({ date: newMb.vaccines[x.id], validity: x.validity_months })),
    ];
    let emptyCount = 0, expiredCount = 0, expiringCount = 0;
    for (const it of items) {
      const s = entryStatusClient(it.date, it.validity);
      if (s === 'missing' || s === 'invalid_date') emptyCount++;
      else if (s === 'expired') expiredCount++;
      else if (s === 'expiring') expiringCount++;
    }
    const banner = $('mb-banner');
    const total = items.length;
    if (emptyCount > 0 || expiredCount > 0) {
      banner.className = 'medbook-status-banner invalid';
      const parts = [];
      if (emptyCount > 0) parts.push(`не заполнено: ${emptyCount}`);
      if (expiredCount > 0) parts.push(`просрочено: ${expiredCount}`);
      banner.textContent = `❌ Медкнижка НЕДЕЙСТВИТЕЛЬНА — ${parts.join(', ')} из ${total} пунктов`;
    } else if (expiringCount > 0) {
      banner.className = 'medbook-status-banner expiring';
      banner.textContent = `⚠️ Все заполнено, но ${expiringCount} пунктов истекают в ближайшие 30 дней`;
    } else {
      banner.className = 'medbook-status-banner ok';
      banner.textContent = '✅ Медкнижка действительна — все пункты заполнены и в сроке';
    }
    document.querySelectorAll('[data-mb-input]').forEach(inp => {
      const [src, idStr] = inp.dataset.mbInput.split(':');
      const list = src === 'doctors' ? doctors : src === 'tests' ? tests : vaccines;
      const item = list.find(x => x.id === +idStr);
      if (!item) return;
      const st = entryStatusClient(inp.value.trim(), item.validity_months);
      inp.classList.toggle('err', st === 'missing' || st === 'invalid_date' || st === 'expired');
    });
  };
  document.querySelectorAll('[data-mb-input]').forEach(inp => inp.addEventListener('input', refreshBanner));
  refreshBanner();

  $('mb-save').addEventListener('click', async () => {
    const errEl = $('mb-error'); errEl.textContent = '';
    const newMb = { doctors: {}, tests: {}, vaccines: {} };
    document.querySelectorAll('[data-mb-input]').forEach(inp => {
      const [src, idStr] = inp.dataset.mbInput.split(':');
      const val = inp.value.trim();
      if (val) newMb[src][+idStr] = val;
    });
    try {
      await api('/api/admin/medbook/save', { user_id: userId, medbook: newMb });
      toast('Медкнижка сохранена', 'success');
      closeModal();
      if (document.querySelector('#page-content [data-mb-tab]')) loadMedbooks();
      if (_usersCurrentSearch !== null) refreshUsersTable(_usersCurrentSearch);
    } catch (e) { errEl.textContent = 'Ошибка: ' + e.message; }
  });
}

function openPermEditor(uid, admins) {
  const a = admins.find(x => x.user_id === uid);
  if (!a) return;
  const perms = a.permissions || {};
  const rows = PERMISSIONS_LIST.map(p => `
    <label class="perm-item ${perms[p.key] ? 'checked' : ''}" data-perm="${p.key}">
      <input type="checkbox" ${perms[p.key] ? 'checked' : ''} data-perm-check="${p.key}">
      <span class="perm-icon">${p.icon}</span>
      <span class="perm-label">${p.label}</span>
    </label>`).join('');
  openModal(`🔐 Права: ${esc(a.full_name)}`, `
    <div class="form-hint" style="margin-bottom:12px;">
      Права публикации новостей — только супер-админ и HR. Остальные могут только предлагать.
    </div>
    <div class="perm-grid">${rows}</div>
  `, `<button class="btn ghost" onclick="closeModal()">Отмена</button><button class="btn primary" id="save-perms-btn">Сохранить</button>`);
  document.querySelectorAll('.perm-item').forEach(item => {
    item.addEventListener('click', (e) => {
      if (e.target.tagName !== 'INPUT') {
        const cb = item.querySelector('input');
        cb.checked = !cb.checked;
      }
      item.classList.toggle('checked', item.querySelector('input').checked);
    });
  });
  $('save-perms-btn').addEventListener('click', async () => {
    const newPerms = {};
    document.querySelectorAll('[data-perm-check]').forEach(cb => { if (cb.checked) newPerms[cb.dataset.permCheck] = true; });
    try {
      await api('/api/admin/set-permissions', { user_id: uid, permissions: newPerms });
      toast('Права обновлены', 'success');
      closeModal();
      loadAdmins();
    } catch (e) { toast('Ошибка: ' + e.message, 'error'); }
  });
}

/* ================== NEWS ================== */
async function loadNews() {
  const data = await api('/api/admin/news', {});
  const all = data.news || [];
  const pending = all.filter(n => n.status === 'pending');
  const others = all.filter(n => n.status !== 'pending');
  const canPublish = canPublishNews();
  const canWrite = hasPerm('news_write') || hasPerm('news_suggest') || canPublish;
  const canEdit = hasPerm('news_edit');
  $('page-actions').innerHTML = canWrite ? `<button class="btn primary small" id="news-add-btn">+ ${canPublish ? 'Новость' : 'Предложить'}</button>` : '';
  if (canWrite) $('news-add-btn').addEventListener('click', openNewsAdd);
  let pendingHtml = '';
  if (canPublish && pending.length) {
    pendingHtml = `
      <div style="margin-bottom:24px;">
        <h3 style="font-size:14px;text-transform:uppercase;color:var(--text-muted);letter-spacing:0.5px;margin-bottom:12px;">
          💭 На модерации (${pending.length})
        </h3>
        ${pending.map(n => `
          <div class="pending-card">
            <div class="pc-header">
              <div class="pc-author">✍️ ${esc(n.proposed_by || '—')} · ${fmtDate(n.created_at, true)}</div>
              <span class="tag amber">Предложено</span>
            </div>
            <div class="pc-title">${esc(n.title)}</div>
            <div class="pc-body">${esc(n.body)}</div>
            <div class="pc-actions">
              <button class="btn green small" data-approve="${n.id}">✅ Опубликовать</button>
              <button class="btn danger small" data-reject="${n.id}">❌ Отклонить</button>
            </div>
          </div>
        `).join('')}
      </div>`;
  }
  const rows = others.map(n => {
    const lvl = n.level === 'urgent' ? '<span class="tag red">Срочно</span>'
      : n.level === 'important' ? '<span class="tag amber">Важно</span>' : '<span class="tag gray">Обычная</span>';
    const status = n.status === 'published' ? '<span class="tag green">Опубликована</span>'
      : n.status === 'scheduled' ? `<span class="tag blue">⏰ ${fmtDate(n.publish_at, true)}</span>` : '<span class="tag amber">На модерации</span>';
    return `
      <tr>
        <td>${lvl}</td>
        <td><b>${esc(n.title)}</b><br><span style="font-size:11px;color:var(--text-muted);">${esc((n.body||'').substring(0, 60))}</span></td>
        <td>${status}</td>
        <td style="font-size:12px;color:var(--text-muted);">${fmtDate(n.created_at, true)}</td>
        <td class="actions-cell">
          ${canEdit ? `<button class="icon-btn" data-title="${n.id}">✏️</button>` : ''}
          ${canEdit && n.status !== 'pending' ? `<button class="icon-btn danger" data-del="${n.id}">🗑</button>` : ''}
        </td>
      </tr>`;
  }).join('');
  $('page-content').innerHTML = `
    ${pendingHtml}
    <div class="table-card"><div class="table-wrap"><table>
      <thead><tr><th>Тип</th><th>Заголовок</th><th>Статус</th><th>Создано</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5"><div class="empty">Новостей нет</div></td></tr>'}</tbody>
    </table></div></div>`;
  document.querySelectorAll('[data-approve]').forEach(b => b.addEventListener('click', async () => {
    try {
      await api('/api/admin/news/approve', { id: parseInt(b.dataset.approve) });
      toast('Опубликовано', 'success');
      loadNews();
      refreshCounters();
    } catch (e) { toast('Ошибка: ' + e.message, 'error'); }
  }));
  document.querySelectorAll('[data-reject]').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('Отклонить?')) return;
    try {
      await api('/api/admin/news/reject', { id: parseInt(b.dataset.reject) });
      toast('Отклонено', 'success');
      loadNews();
      refreshCounters();
    } catch (e) { toast('Ошибка: ' + e.message, 'error'); }
  }));
  document.querySelectorAll('[data-title]').forEach(b => b.addEventListener('click', () => openNewsEdit(parseInt(b.dataset.title), others)));
  document.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('Удалить?')) return;
    try {
      await api('/api/admin/news/delete', { id: parseInt(b.dataset.del) });
      toast('Удалена', 'success');
      loadNews();
    } catch (e) { toast('Ошибка: ' + e.message, 'error'); }
  }));
}
function openNewsAdd() {
  const canPublish = canPublishNews();
  const intentOpts = canPublish
    ? `<option value="publish">📤 Опубликовать сейчас</option><option value="schedule">⏰ Отложить</option><option value="suggest">💭 Предложить</option>`
    : `<option value="suggest">💭 Предложить (на модерацию)</option>`;
  openModal(canPublish ? 'Новая новость' : 'Предложить новость', `
    ${canPublish ? '' : '<div class="login-preview" style="background:var(--purple-soft);border-color:rgba(175,82,222,0.3);"><div class="lp-icon">💭</div><div><div class="lp-label" style="color:#7C3FA8;">Ваша новость</div><div class="lp-hint" style="color:#7C3FA8;">будет отправлена на модерацию супер-админу или HR</div></div></div>'}
    <div class="form-group"><label>Заголовок</label><input class="form-input" id="n-title" maxlength="100"></div>
    <div class="form-group"><label>Текст</label><textarea class="form-textarea" id="n-body"></textarea></div>
    <div class="form-group"><label>Уровень</label>
      <select class="form-select" id="n-level">
        <option value="normal">🔵 Обычная</option><option value="important">🟡 Важная</option><option value="urgent">🔴 Срочная</option>
      </select>
    </div>
    <div class="form-group"><label>Действие</label><select class="form-select" id="n-intent">${intentOpts}</select></div>
    <div class="form-group" id="n-sched-time" style="display:none;"><label>Дата и время</label><input class="form-input" type="datetime-local" id="n-publish-at"></div>
  `, `<button class="btn ghost" onclick="closeModal()">Отмена</button><button class="btn primary" id="create-news-btn">${canPublish ? 'Создать' : 'Предложить'}</button>`);
  $('n-intent').addEventListener('change', e => {
    $('n-sched-time').style.display = e.target.value === 'schedule' ? 'block' : 'none';
  });
  $('create-news-btn').addEventListener('click', async () => {
    const body = {
      title: $('n-title').value.trim(), body: $('n-body').value.trim(),
      level: $('n-level').value, intent: $('n-intent').value,
    };
    if (!body.title || !body.body) { toast('Заполните поля', 'error'); return; }
    if (body.intent === 'schedule') {
      const dt = $('n-publish-at').value;
      if (!dt) { toast('Укажите дату', 'error'); return; }
      body.publish_at = new Date(dt).toISOString();
    }
    try {
      const res = await api('/api/admin/news/add', body);
      const msgs = { published: 'Опубликовано', scheduled: 'Отложено', pending: 'Отправлено на модерацию' };
      toast(msgs[res.status] || 'Готово', 'success');
      closeModal();
      loadNews();
      refreshCounters();
    } catch (e) { toast('Ошибка: ' + e.message, 'error'); }
  });
}
function openNewsEdit(id, news) {
  if (!hasPerm('news_edit')) { toast('Нет права', 'error'); return; }

  if (!f) return;
  openModal('Редактирование', `
    <div class="form-group"><label>Вопрос</label><textarea class="form-textarea" id="fe-q" rows="2">${esc(f.question)}</textarea></div>
    <div class="form-group"><label>Ответ</label><textarea class="form-textarea" id="fe-a" rows="4">${esc(f.answer)}</textarea></div>
  `, `<button class="btn ghost" onclick="closeModal()">Отмена</button><button class="btn primary" id="save-faq-btn">Сохранить</button>`);
  $('save-faq-btn').addEventListener('click', async () => {
    try {
      await api('/api/admin/faq/update', { id, field: 'question', value: $('fe-q').value.trim() });
      await api('/api/admin/faq/update', { id, field: 'answer', value: $('fe-a').value.trim() });
      toast('Сохранено', 'success');
      closeModal();
      loadFaq();
    } catch (e) { toast('Ошибка: ' + e.message, 'error'); }
  });
}

/* ================== POSITIONS ================== */
async function loadPositions() {
  $('page-actions').innerHTML = '<button class="btn primary small" id="pos-add-btn">+ Добавить</button>';
  $('pos-add-btn').addEventListener('click', openPosAdd);
  const data = await api('/api/admin/positions', {});
  const active = data.positions.filter(p => !p.is_archived);
  const arch = data.positions.filter(p => p.is_archived);
  const rows = active.map(p => `
    <tr><td><b>${esc(p.name)}</b></td><td>${p.sort}</td>
    <td class="actions-cell"><button class="icon-btn danger" data-arch="${p.id}">📦</button></td></tr>`).join('');
  $('page-content').innerHTML = `
    <div class="table-card"><div class="table-wrap"><table>
      <thead><tr><th>Активные (${active.length})</th><th>Sort</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div></div>
    ${arch.length ? `<div class="table-card" style="margin-top:20px;"><div class="table-wrap"><table>
      <thead><tr><th>📦 Архив (${arch.length})</th></tr></thead>
      <tbody>${arch.map(p => `<tr><td style="color:var(--text-muted);text-decoration:line-through;">${esc(p.name)}</td></tr>`).join('')}</tbody>
    </table></div></div>` : ''}`;
  document.querySelectorAll('[data-arch]').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('В архив?')) return;
    try {
      await api('/api/admin/position/archive', { id: parseInt(b.dataset.arch) });
      toast('В архиве', 'success');
      loadPositions();
    } catch (e) { toast('Ошибка: ' + e.message, 'error'); }
  }));
}
function openPosAdd() {
  openModal('Новая должность', `
    <div class="form-group"><label>Название</label><input class="form-input" id="p-name" placeholder="Например: Стажёр"></div>
  `, `<button class="btn ghost" onclick="closeModal()">Отмена</button><button class="btn primary" id="create-pos-btn">Создать</button>`);
  $('create-pos-btn').addEventListener('click', async () => {
    const res = await api('/api/admin/position/add', { name: $('p-name').value.trim() }).catch(() => null);
    if (res && res.ok) {
      toast('Создана', 'success');
      closeModal();
      loadPositions();
    } else {
      toast('Уже существует', 'error');
    }
  });
}

/* ================== QUESTIONS ================== */
async function loadQuestions() {
  const data = await api('/api/admin/questions', {});
  const rows = data.questions.map(q => `
    <tr>
      <td><code style="font-size:11px;">${q.user_id}</code></td>
      <td><b>${esc(q.full_name || '—')}</b></td>
      <td style="max-width:400px;">${esc(q.text)}</td>
      <td>${q.replied ? '<span class="tag green">✅</span>' : '<span class="tag amber">❓</span>'}</td>
      <td style="font-size:12px;color:var(--text-muted);">${fmtDate(q.created_at, true)}</td>
      <td class="actions-cell">${!q.replied ? `<button class="icon-btn" data-reply="${q.id}">✍️</button>` : ''}</td>
    </tr>`).join('');
  $('page-content').innerHTML = `<div class="table-card"><div class="table-wrap"><table>
    <thead><tr><th>ID</th><th>Кто</th><th>Вопрос</th><th>Статус</th><th>Когда</th><th></th></tr></thead>
    <tbody>${rows || '<tr><td colspan="6"><div class="empty">Вопросов нет</div></td></tr>'}</tbody></table></div></div>`;
  document.querySelectorAll('[data-reply]').forEach(b => b.addEventListener('click', () => openReply(parseInt(b.dataset.reply), data.questions)));
  refreshCounters();
}
function openReply(id, list) {
  const q = list.find(x => x.id === id);
  if (!q) return;
  openModal('Ответ на вопрос', `
    <div class="form-group"><label>Вопрос</label><div style="background:#F8F9FA;padding:12px;border-radius:10px;">${esc(q.text)}</div></div>
    <div class="form-group"><label>Ответ</label><textarea class="form-textarea" id="reply-text" rows="4"></textarea></div>
  `, `<button class="btn ghost" onclick="closeModal()">Отмена</button><button class="btn primary" id="send-reply-btn">Сохранить</button>`);
  $('send-reply-btn').addEventListener('click', async () => {
    const text = $('reply-text').value.trim();
    if (!text) { toast('Введите текст', 'error'); return; }
    try {
      await api('/api/admin/question/reply', { id, text });
      toast('Сохранено', 'success');
      closeModal();
      loadQuestions();
    } catch (e) { toast('Ошибка: ' + e.message, 'error'); }
  });
}

/* ================== REPORTS ================== */
async function loadReports() {
  const { report } = await api('/api/admin/reports', {});
  $('page-content').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="label">Всего</div><div class="value">${report.total}</div></div>
      <div class="stat-card green"><div class="label">Активных</div><div class="value">${report.active}</div></div>
      <div class="stat-card accent"><div class="label">Уволено</div><div class="value">${report.fired}</div></div>
      <div class="stat-card"><div class="label">Новых за 7д</div><div class="value">${report.new7}</div></div>
      <div class="stat-card amber"><div class="label">Неактивных 7+</div><div class="value">${report.inactive7}</div></div>
    </div>`;
}

/* ================== AUDIT ================== */
async function loadAudit() {
  const data = await api('/api/admin/audit', {});
  const rows = data.audit.map(a => `
    <tr>
      <td style="font-size:12px;color:var(--text-muted);white-space:nowrap;">${fmtDate(a.created_at, true)}</td>
      <td><code style="font-size:11px;">${esc(a.action)}</code></td>
      <td>${esc(a.target_type || '')}:${esc(a.target_id || '')}</td>
      <td style="font-size:12px;">${esc((a.details || '').substring(0, 80))}</td>
    </tr>`).join('');
  $('page-content').innerHTML = `<div class="table-card"><div class="table-wrap"><table>
    <thead><tr><th>Когда</th><th>Действие</th><th>Цель</th><th>Детали</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="4"><div class="empty">История пуста</div></td></tr>'}</tbody></table></div></div>`;
}

/* ================== INIT ================== */
(function init() {
  if (!getToken()) { showLogin(); return; }
  checkAdminAndLoad();
})();
</script>
</body>
</html>
