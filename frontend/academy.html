<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wokker · Академия</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23131324'/%3E%3Ccircle cx='50' cy='50' r='42' fill='none' stroke='%23FF007F' stroke-width='8'/%3E%3Cpath d='M25 50 A 25 25 0 0 0 75 50' fill='none' stroke='%23FF007F' stroke-width='12' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#131324">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #131324;
    --card: rgba(255,255,255,0.05);
    --text: #ffffff;
    --muted: #9E9EA7;
    --border: rgba(255,255,255,0.1);
    
    --grad-pink: linear-gradient(135deg, #FF007F 0%, #FF7A00 100%);
    --grad-blue: linear-gradient(135deg, #00B0FF 0%, #00E676 100%);
    --grad-purple: linear-gradient(135deg, #B538FF 0%, #FF007F 100%);
    --grad-yellow: linear-gradient(135deg, #FFD700 0%, #FF8C00 100%);
  }
  
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  
  body {
    font-family: 'Rubik', -apple-system, sans-serif;
    background: var(--bg); 
    background-image: 
      radial-gradient(circle at 15% 50%, rgba(255, 0, 127, 0.15) 0%, transparent 50%),
      radial-gradient(circle at 85% 30%, rgba(0, 176, 255, 0.15) 0%, transparent 50%);
    background-attachment: fixed;
    color: var(--text); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; overflow-x: hidden; min-height: 100vh;
    padding-bottom: 40px;
  }
  button { cursor: pointer; border: none; background: none; color: inherit; font-family: inherit; }

  /* HEADER */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 24px 24px 0; max-width: 1200px; margin: 0 auto;
  }
  .logo { font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 12px; }
  .logo span { background: var(--grad-pink); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .btn-close { background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 10px 20px; border-radius: 100px; font-weight: 600; color: var(--text); text-decoration: none; font-size: 13px; transition: all 0.2s; }
  .btn-close:hover { background: rgba(255,255,255,0.1); }
  
  /* CONTENT */
  .container { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }
  
  .greeting { font-size: 32px; font-weight: 800; letter-spacing: -1px; margin-bottom: 8px; }
  .greeting span { background: var(--grad-blue); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .sub-greeting { color: var(--muted); font-size: 16px; margin-bottom: 40px; font-weight: 500; }

  /* COURSES GRID */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
  
  .course-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 24px; padding: 24px; position: relative; overflow: hidden;
    cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex; flex-direction: column;
  }
  .course-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,0,0,0.4); border-color: rgba(255,255,255,0.2); }
  
  .course-icon {
    width: 64px; height: 64px; border-radius: 20px; display: flex; align-items: center; justify-content: center;
    font-size: 32px; margin-bottom: 20px; position: relative; z-index: 1;
  }
  .course-card.pink .course-icon { background: var(--grad-pink); }
  .course-card.blue .course-icon { background: var(--grad-blue); }
  .course-card.purple .course-icon { background: var(--grad-purple); }
  .course-card.yellow .course-icon { background: var(--grad-yellow); }
  
  .course-title { font-size: 20px; font-weight: 800; margin-bottom: 8px; position: relative; z-index: 1; }
  .course-desc { color: var(--muted); font-size: 14px; margin-bottom: 24px; flex: 1; position: relative; z-index: 1; }
  
  .course-progress-bar { height: 8px; background: rgba(255,255,255,0.1); border-radius: 100px; overflow: hidden; margin-bottom: 12px; }
  .course-progress-fill { height: 100%; border-radius: 100px; transition: width 0.5s; }
  .course-card.pink .course-progress-fill { background: var(--grad-pink); }
  .course-card.blue .course-progress-fill { background: var(--grad-blue); }
  
  .course-status { font-size: 12px; font-weight: 700; display: flex; justify-content: space-between; }
  .course-status.completed { color: #00E676; }
  .course-status.new { color: var(--muted); }
  
  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
    z-index: 1000; display: none; align-items: flex-end; justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #1E1E2E; width: 100%; max-width: 800px; max-height: 90vh;
    border-radius: 32px 32px 0 0; overflow-y: auto; padding: 32px;
    animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-close { position: absolute; top: 24px; right: 24px; background: rgba(255,255,255,0.05); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--muted); }
  .modal-close:hover { background: rgba(255,255,255,0.1); color: #fff; }
  
  /* LESSONS */
  .lesson-item {
    background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px; margin-bottom: 16px; cursor: pointer; transition: all 0.2s;
  }
  .lesson-item:hover { background: rgba(255,255,255,0.05); }
  .lesson-title { font-size: 16px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
  .lesson-content { display: none; margin-top: 16px; color: var(--muted); line-height: 1.6; font-size: 15px; border-top: 1px solid var(--border); padding-top: 16px; }
  .lesson-item.open .lesson-content { display: block; animation: fadeIn 0.3s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  
  /* TEST */
  .test-section { margin-top: 32px; border-top: 1px solid var(--border); padding-top: 32px; }
  .question-block { margin-bottom: 24px; }
  .question-text { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
  .option-btn {
    display: block; width: 100%; text-align: left; padding: 16px 20px; background: rgba(255,255,255,0.03);
    border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; font-size: 15px; transition: all 0.2s;
  }
  .option-btn:hover { background: rgba(255,255,255,0.08); }
  .option-btn.selected { background: rgba(0, 176, 255, 0.15); border-color: #00B0FF; color: #00B0FF; }
  
  .btn-submit {
    width: 100%; padding: 18px; border-radius: 100px; background: var(--grad-blue);
    color: #fff; font-size: 16px; font-weight: 700; margin-top: 24px;
    box-shadow: 0 8px 24px rgba(0, 176, 255, 0.3); transition: all 0.2s;
  }
  .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(0, 176, 255, 0.4); }
  
  /* RESULT */
  .result-screen { text-align: center; padding: 40px 0; display: none; }
  .result-icon { font-size: 80px; margin-bottom: 24px; animation: bounce 0.6s; }
  @keyframes bounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
  .result-title { font-size: 28px; font-weight: 800; margin-bottom: 12px; }
  .result-score { font-size: 48px; font-weight: 800; background: var(--grad-pink); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 24px; }
  .btn-back { display: inline-block; padding: 14px 32px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 100px; font-weight: 600; font-size: 15px; }
  .btn-back:hover { background: rgba(255,255,255,0.1); }

  /* LOADER */
  .loader { text-align: center; padding: 80px; color: var(--muted); font-weight: 600; letter-spacing: 2px; animation: pulse 1.5s infinite; text-transform: uppercase; font-size: 14px; }
  @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

  /* TOAST */
  .toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(100px); background: #fff; color: #000; padding: 16px 32px; border-radius: 100px; font-weight: 700; font-size: 15px; z-index: 2000; opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  @media (max-width: 600px) {
    .header { padding: 20px 16px 0; }
    .container { padding: 24px 16px; }
    .greeting { font-size: 26px; }
    .modal { padding: 24px; border-radius: 24px 24px 0 0; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">🎓 <span>Wokker Academy</span></div>
  <div class="header-right">
    <a href="/" class="btn-close">← На портал</a>
  </div>
</div>

<div class="container" id="main-container">
  <div class="loader">Загрузка курсов...</div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-box">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modal-content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const TOKEN_KEY = 'wokker_staff_token';
let COURSES = [];
let CURRENT_COURSE = null;
let TEST_ANSWERS = {};

const $ = id => document.getElementById(id);
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }

function showToast(text) {
  const el = $('toast');
  el.textContent = text;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

async function api(path, body) {
  const payload = { webToken: getToken() };
  if (body && typeof body === 'object') Object.assign(payload, body);
  const res = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  if (res.status === 401) { window.location.href = '/'; throw new Error('unauthorized'); }
  if (!res.ok) {
    let msg = 'error';
    try { const j = await res.json(); msg = j.error || msg; } catch (e) {}
    throw new Error(msg);
  }
  return res.json();
}

async function loadCourses() {
  try {
    const res = await api('/api/academy/courses', {});
    COURSES = res.courses || [];
    renderCourses();
  } catch (e) {
    $('main-container').innerHTML = '<div class="loader">Ошибка загрузки</div>';
  }
}

function renderCourses() {
  const box = $('main-container');
  const colors = ['pink', 'blue', 'purple', 'yellow'];
  
  let html = `
    <div class="greeting">Привет, <span>${esc(localStorage.getItem('wokker_staff_name') || 'Сотрудник')}</span>! 👋</div>
    <div class="sub-greeting">Прокачай свои навыки и стань лучшим в команде</div>
    <div class="grid">
  `;

  if (COURSES.length === 0) {
    html += '<div style="grid-column: 1/-1; text-align: center; color: var(--muted); padding: 40px;">Курсов пока нет</div>';
  } else {
    COURSES.forEach((c, i) => {
      const colorClass = c.color || colors[i % colors.length];
      const isCompleted = c.status === 'completed';
      const progress = isCompleted ? 100 : 0;
      
      html += `
        <div class="course-card ${colorClass}" onclick="openCourse(${c.id})">
          <div class="course-icon">${c.icon || '🚀'}</div>
          <div class="course-title">${esc(c.title)}</div>
          <div class="course-desc">${esc(c.description)}</div>
          
          <div class="course-progress-bar">
            <div class="course-progress-fill" style="width: ${progress}%;"></div>
          </div>
          <div class="course-status ${isCompleted ? 'completed' : 'new'}">
            <span>${isCompleted ? '✅ Пройден' : '⏳ В процессе'}</span>
            ${isCompleted ? `<span>${c.score}%</span>` : ''}
          </div>
        </div>
      `;
    });
  }

  html += `</div>`;
  box.innerHTML = html;
}

async function openCourse(id) {
  try {
    $('modal-content').innerHTML = '<div class="loader">Загрузка...</div>';
    $('modal-overlay').classList.add('show');
    
    const res = await api('/api/academy/course', { course_id: id });
    CURRENT_COURSE = res.course;
    const lessons = res.lessons || [];
    const tests = res.tests || [];
    
    let html = `
      <div style="font-size: 14px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px;">Курс</div>
      <div style="font-size: 28px; font-weight: 800; margin-bottom: 32px;">${esc(CURRENT_COURSE.title)}</div>
    `;

    // Render lessons
    if (lessons.length) {
      html += `<h3 style="font-size: 18px; font-weight: 700; margin-bottom: 16px;">📖 Уроки</h3>`;
      lessons.forEach(l => {
        html += `
          <div class="lesson-item" onclick="this.classList.toggle('open')">
            <div class="lesson-title">${esc(l.title)} <span style="font-size: 20px; color: var(--muted);">+</span></div>
            <div class="lesson-content">${esc(l.content)}</div>
          </div>
        `;
      });
    }

    // Render test
    if (tests.length) {
      html += `<div class="test-section" id="test-section">`;
      html += `<h3 style="font-size: 18px; font-weight: 700; margin-bottom: 16px;">📝 Финальный тест</h3>`;
      
      html += `<div id="test-questions">`;
      tests.forEach((t, idx) => {
        html += `
          <div class="question-block" data-qid="${t.id}">
            <div class="question-text">${idx+1}. ${esc(t.question)}</div>
        `;
        t.options.forEach((opt, optIdx) => {
          html += `<button class="option-btn" onclick="selectOption(${t.id}, ${optIdx}, this)">${esc(opt)}</button>`;
        });
        html += `</div>`;
      });
      html += `</div>`;
      
      html += `<button class="btn-submit" id="btn-submit-test" onclick="submitTest()" style="display: none;">Завершить тест</button>`;
      html += `</div>`;
    }

    // Result screen (hidden by default)
    html += `
      <div class="result-screen" id="result-screen">
        <div class="result-icon" id="result-icon">🎉</div>
        <div class="result-title" id="result-title">Отлично!</div>
        <div class="result-score" id="result-score">100%</div>
        <button class="btn-back" onclick="closeModal()">Вернуться к курсам</button>
      </div>
    `;

    $('modal-content').innerHTML = html;

    // Show submit button if there are tests
    if (tests.length > 0) {
      $('btn-submit-test').style.display = 'block';
    }

  } catch (e) {
    $('modal-content').innerHTML = `<div class="loader">Ошибка загрузки курса</div>`;
  }
}

function selectOption(qid, optIdx, btn) {
  TEST_ANSWERS[qid] = optIdx;
  const parent = btn.closest('.question-block');
  parent.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

async function submitTest() {
  if (!CURRENT_COURSE) return;
  
  const questions = document.querySelectorAll('.question-block');
  const answers = { ...TEST_ANSWERS };
  
  if (Object.keys(answers).length < questions.length) {
    showToast('Ответьте на все вопросы!');
    return;
  }

  const btn = $('btn-submit-test');
  btn.textContent = 'Проверяем...';
  btn.disabled = true;

  try {
    const res = await api('/api/academy/submit-test', { course_id: CURRENT_COURSE.id, answers });
    
    $('test-section').style.display = 'none';
    $('result-screen').style.display = 'block';
    
    if (res.passed) {
      $('result-icon').textContent = '🏆';
      $('result-title').textContent = 'Курс пройден!';
      $('result-score').textContent = res.score + '%';
      $('result-score').style.color = '#00E676';
      // Reload courses in background
      setTimeout(loadCourses, 1000);
    } else {
      $('result-icon').textContent = '😢';
      $('result-title').textContent = 'Нужно повторить';
      $('result-score').textContent = res.score + '%';
      $('result-score').style.color = '#FF007F';
    }

  } catch (e) {
    showToast('Ошибка отправки');
    btn.textContent = 'Завершить тест';
    btn.disabled = false;
  }
}

function closeModal() {
  $('modal-overlay').classList.remove('show');
  setTimeout(() => {
    $('modal-content').innerHTML = '';
    CURRENT_COURSE = null;
    TEST_ANSWERS = {};
  }, 300);
}

// Инициализация
(async function init() {
  if (!getToken()) { window.location.href = '/'; return; }
  await loadCourses();
})();
</script>
</body>
</html>
