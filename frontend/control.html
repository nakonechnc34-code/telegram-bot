<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WOKKER CONTROL</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:#f3f4f6;color:#171717}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:12px;background:#d71920;color:white}input{padding:12px;border:1px solid #aaa;border-radius:8px;width:100%}label{display:block;margin:14px 0 6px}h1{font-size:25px}b{color:#d71920}.login{max-width:420px;margin:12vh auto;padding:28px;background:white;border-radius:18px}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#171717;color:white;padding:24px}aside button{display:block;width:100%;text-align:left;margin:8px 0}main{padding:28px;min-width:0}.card{background:white;border-radius:14px;padding:22px;margin:14px 0}.muted{color:#666} [hidden]{display:none!important} @media(max-width:650px){.layout{grid-template-columns:1fr}aside{padding:16px}main{padding:16px}.login{margin:8vh 16px}} 
</style></head><body><section id="login" class="login"><h1>WOKKER <b>CONTROL</b></h1><p>Операционное управление</p><form id="form"><label for="username">Логин</label><input id="username" autocomplete="username" required><label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password" required><p><button type="submit">Войти</button></p></form><p id="error" role="alert"></p></section><div id="app" class="layout" hidden><aside><h2>WOKKER <b>CONTROL</b></h2><button id="home">Главная</button><button id="rests">Рестораны</button><button id="templates">Конструктор чек-листов</button><p>В разработке: чек-листы, аудиты, задачи, ХАССП, Academy, отчёты</p><button id="logout">Выйти</button></aside><main><p id="who"></p><h1 id="title">Главная</h1><section class="card"><h2 id="heading">Доступные рестораны</h2><p id="status" role="status"></p><ul id="list"></ul></section><section class="card"><h2>Операционные показатели</h2><p class="muted">Модули проверок ещё не подключены. Нет данных для расчёта.</p></section><section id="builder" class="card" hidden><h2>Конструктор чек-листов</h2><label>Существующие шаблоны</label><select id="templateList"></select><button id="newTemplate">Новый</button><label for="templateTitle">Название</label><input id="templateTitle"><div id="sections"></div><p><button id="addSection">Добавить раздел</button> <button id="saveTemplate">Сохранить версию</button></p><p id="builderStatus" role="status"></p></section></main></div><script>
const $=id=>document.getElementById(id);let token=sessionStorage.getItem('wokker_control_token')||'';
async function api(path,body={}){const r=await fetch('/api/control/'+path,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(body)});const data=await r.json();if(!r.ok){const e=new Error(data.error||'Ошибка запроса');e.status=r.status;throw e}return data}
function clear(){$('builder').hidden=true;token='';sessionStorage.removeItem('wokker_control_token');$('app').hidden=true;$('login').hidden=false;$('list').replaceChildren();$('who').textContent=''}
async function load(){try{const me=await api('me');const data=await api('restaurants');$('who').textContent=me.full_name||'';$('list').replaceChildren();for(const r of data.restaurants){const li=document.createElement('li');li.textContent=r.name;$('list').append(li)}$('status').textContent='Доступно: '+data.restaurants.length;$('login').hidden=true;$('app').hidden=false}catch(e){clear();$('error').textContent=e.message}}
$('form').addEventListener('submit',async e=>{e.preventDefault();$('error').textContent='';const btn=e.target.querySelector('button');btn.disabled=true;try{const d=await api('login',{login:$('username').value,password:$('password').value});token=d.token;sessionStorage.setItem('wokker_control_token',token);await load()}catch(e){$('error').textContent=e.message}finally{$('password').value='';btn.disabled=false}});
$('logout').onclick=async()=>{try{await api('logout')}catch(e){$('error').textContent='Не удалось завершить серверную сессию'}finally{clear()}};
$('home').onclick=()=>{$('builder').hidden=true;$('title').textContent='Главная';load()};$('rests').onclick=()=>{$('builder').hidden=true;$('title').textContent='Рестораны';load()};if(token)load();

let draft={title:'',sections:[]}, savedTemplates=[];
function field(parent,label,value,change,type='text'){const wrap=document.createElement('label');wrap.textContent=label;const input=document.createElement('input');input.type=type;if(type==='checkbox'){input.checked=!!value;input.style.width='auto'}else input.value=value;input.oninput=()=>change(type==='checkbox'?input.checked:type==='number'?Number(input.value):input.value);wrap.append(input);parent.append(wrap);return input}
function action(parent,label,fn){const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=fn;parent.append(b)}
function renderBuilder(){$('templateTitle').value=draft.title;$('sections').replaceChildren();draft.sections.forEach((section,i)=>{const box=document.createElement('fieldset');field(box,'Раздел',section.title,v=>section.title=v);action(box,'Удалить раздел',()=>{draft.sections.splice(i,1);renderBuilder()});section.questions.forEach((q,j)=>{const block=document.createElement('fieldset');field(block,'Вопрос',q.text,v=>q.text=v);const sel=document.createElement('select');for(const [key,label] of [['yes_no_na','Да / Нет / НП'],['number','Число'],['temperature','Температура'],['text','Текст'],['photo','Фото']]){const opt=document.createElement('option');opt.value=key;opt.textContent=label;sel.append(opt)}sel.value=q.type;sel.onchange=()=>q.type=sel.value;block.append(sel);const w=field(block,'Вес',q.weight,v=>q.weight=v,'number');w.min=0;w.max=100;for(const [key,label] of [['required','Обязательный'],['critical','Критический'],['photo_required','Требовать фото'],['comment_required','Требовать комментарий'],['create_task','Создавать задачу']])field(block,label,q[key],v=>q[key]=v,'checkbox');action(block,'Удалить вопрос',()=>{section.questions.splice(j,1);renderBuilder()});box.append(block)});action(box,'Добавить вопрос',()=>{section.questions.push({text:'',type:'yes_no_na',weight:1,required:true});renderBuilder()});$('sections').append(box)})}
async function refreshTemplates(){const data=await api('templates');savedTemplates=data.templates;$('templateList').replaceChildren();const empty=document.createElement('option');empty.value='';empty.textContent='Выберите шаблон';$('templateList').append(empty);for(const t of savedTemplates){const o=document.createElement('option');o.value=t.id;o.textContent=t.title+' · v'+t.version;$('templateList').append(o)}}
$('templates').onclick=async()=>{try{await refreshTemplates();$('builder').hidden=false;$('title').textContent='Чек-листы';renderBuilder()}catch(e){$('status').textContent=e.message}};
$('templateList').onchange=()=>{const t=savedTemplates.find(t=>String(t.id)===$('templateList').value);if(t){draft={...structuredClone(t.definition),id:t.id,version:t.version};renderBuilder()}};
$('newTemplate').onclick=()=>{draft={title:'',sections:[]};renderBuilder()};
$('templateTitle').oninput=e=>draft.title=e.target.value;
$('addSection').onclick=()=>{draft.sections.push({title:'',questions:[]});renderBuilder()};
$('saveTemplate').onclick=async()=>{const b=$('saveTemplate');b.disabled=true;try{const result=await api('templates/save',draft);draft.id=result.id;draft.version=result.version;$('builderStatus').textContent='Сохранена версия '+result.version;await refreshTemplates()}catch(e){$('builderStatus').textContent=e.message}finally{b.disabled=false}};
</script></body></html>
