<style>
  :root {
    --bg: #F8F9FA; --card-bg: #FFFFFF; --text-main: #1C1C1E;
    --text-muted: #8E8E93; --accent: #FF3B30; --accent-soft: #FFEBEA;
    --green: #34C759; --green-soft: #E8F8EB;
    --amber: #FF9500; --amber-soft: #FFF4E0;
    --beige: #D4B68C; --beige-dark: #8A7B66; --beige-soft: #FDFBF7;

  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  body {

  }
  button, input { font-family: inherit; }
  button { cursor: pointer; }

  #login-screen {
    position: fixed; inset: 0; background: linear-gradient(160deg, #FFF9F5 0%, #FDF2EB 100%);
    display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 1000;
  }
  .login-card { background: #fff; border-radius: 32px; padding: 36px 24px; box-shadow: 0 24px 64px rgba(0,0,0,0.08); width: 100%; max-width: 400px; text-align: center; }
  .login-logo { width: 80px; height: 80px; border-radius: 24px; background: var(--beige-soft); margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 40px; }
  .login-title { font-size: 26px; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.5px; }
  .login-sub { font-size: 15px; color: var(--text-muted); margin-bottom: 28px; }
  .login-input { width: 100%; border: 1px solid rgba(0,0,0,0.06); border-radius: 16px; padding: 16px 18px; font-size: 16px; background: #F8F9FA; color: var(--text-main); outline: none; font-weight: 600; margin-bottom: 12px; text-align: center; transition: border-color 0.2s, background 0.2s; }
  .login-input:focus { border-color: var(--accent); background: #fff; }
  .login-hint { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
  .login-btn { width: 100%; background: var(--accent); color: #fff; border: 0; border-radius: 16px; padding: 16px; font-size: 16px; font-weight: 700; margin-top: 8px; }
  .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .login-error { color: var(--accent); font-size: 13px; font-weight: 600; min-height: 18px; margin-top: 10px; }

  .tabs { position: fixed; bottom: calc(12px + env(safe-area-inset-bottom)); left: 12px; right: 12px; display: flex; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8); border: 1px solid rgba(0, 0, 0, 0.05); border-radius: 26px; padding: 6px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08); z-index: 100; justify-content: space-between; }
  .tabs button { flex: 1; border: 0; background: none; padding: 4px 1px; font-size: 9px; font-weight: 600; color: var(--text-muted); border-radius: 18px; transition: all 0.25s ease; position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .tabs button:active { transform: scale(0.92); }
  .tabs button.active { color: var(--accent); }
  .tabs button.active svg { stroke: var(--accent); }
  .tabs svg { width: 20px; height: 20px; stroke: var(--text-muted); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: stroke 0.2s; }
  .badge-dot { position: absolute; top: 2px; right: 20%; width: 7px; height: 7px; background: var(--accent); border-radius: 50%; border: 1.5px solid #fff; display: none; }
  .badge-dot.show { display: block; }

  .section { display: none; animation: fadeIn 0.3s ease; }
  .section.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  .card { background: var(--card-bg); border-radius: var(--radius); margin: 0 16px 16px; padding: 20px; box-shadow: var(--shadow); }

  .profile-wrapper { margin: 24px 16px 16px; }
  .profile-card { background: var(--card-bg); border-radius: 28px; box-shadow: var(--shadow); overflow: hidden; position: relative; }
  .profile-header { padding: 32px 20px 24px; text-align: center; background: linear-gradient(135deg, #FFF9F5 0%, #FDF2EB 100%); border-bottom: 1px solid rgba(0,0,0,0.02); }
  .avatar-ring { width: 104px; height: 104px; border-radius: 50%; margin: 0 auto 16px; padding: 4px; background: #FFF; box-shadow: 0 8px 24px rgba(0,0,0,0.06); }
  .avatar-inner { width: 100%; height: 100%; border-radius: 50%; background: var(--beige-soft); display: flex; align-items: center; justify-content: center; font-size: 38px; font-weight: 800; color: var(--beige); }
  .p-name { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 4px; color: #2C2216; }
  .p-pos { font-size: 15px; color: #8A7B66; font-weight: 500; margin-bottom: 12px; }
  .status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; background: rgba(52, 199, 89, 0.12); color: #1B7A36; border-radius: 20px; font-size: 13px; font-weight: 700; border: 1px solid rgba(52, 199, 89, 0.2); }
  .status-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: #1B7A36; }
  .info-section { padding: 20px; }
  .info-group { background: #F8F9FA; border-radius: 20px; overflow: hidden; }
  .info-item { display: flex; align-items: center; padding: 16px; border-bottom: 1px solid rgba(0,0,0,0.04); }
  .info-item:last-child { border-bottom: none; }
  .info-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-right: 14px; flex-shrink: 0; }
  .icon-rest { background: #E5F0FF; color: #007AFF; }
  .icon-phone { background: #F2F2F7; color: #1C1C1E; }
  .icon-birth { background: #FFE5EC; color: #FF2D55; }
  .icon-cert { background: #FFF3E0; color: #FF9800; }
  .info-text { flex: 1; text-align: left; }
  .info-lbl { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
  .info-val { font-size: 16px; font-weight: 600; color: var(--text-main); }
  .info-val a { color: var(--text-main); text-decoration: none; }
  .badge-rest { display: inline-block; padding: 4px 10px; border-radius: 8px; font-size: 14px; font-weight: 700; color: #fff; }

  .badge-rest.normal { background: var(--green); }
  .actions-block { margin-top: 16px; }
  .action-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 16px; border-radius: 20px; font-size: 16px; font-weight: 600; border: none; cursor: pointer; background: var(--card-bg); color: var(--text-main); box-shadow: var(--shadow); margin-bottom: 12px; transition: transform 0.15s ease; }
  .action-btn:active { transform: scale(0.98); }

  .medbook-card { background: var(--card-bg); border-radius: 24px; padding: 20px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .medbook-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; gap: 8px; flex-wrap: wrap; }
  .medbook-header h3 { font-size: 16px; font-weight: 800; letter-spacing: -0.3px; display: flex; align-items: center; gap: 8px; }
  .medbook-status { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 100px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .medbook-status.ok { background: var(--green-soft); color: #1B7A36; }
  .medbook-status.expiring { background: var(--amber-soft); color: #C77700; }
  .medbook-status.invalid { background: var(--accent-soft); color: var(--accent); }
  .medbook-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; }

  .medbook-card details { background: #F8F9FA; border-radius: 14px; padding: 0; margin: 12px 0 0; box-shadow: none; }
  .medbook-card summary { padding: 12px 16px; font-size: 14px; font-weight: 700; color: var(--text-main); cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
  .medbook-card summary::-webkit-details-marker { display: none; }
  .medbook-card summary::after { content: '+'; font-size: 18px; color: var(--text-muted); font-weight: 400; }
  .medbook-card details[open] summary::after { content: '−'; }
  .medbook-card details[open] summary { border-bottom: 1px solid rgba(0,0,0,0.06); }

  .medbook-block { padding: 12px 16px; }
  .medbook-block h4 { font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; margin-bottom: 8px; }
  .medbook-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,0.04); font-size: 13px; gap: 8px; }
  .medbook-item:last-child { border-bottom: none; }
  .medbook-item .mbi-name { font-weight: 600; color: var(--text-main); flex: 1; min-width: 0; }
  .medbook-item .mbi-name .req { color: var(--accent); font-weight: 800; margin-left: 2px; }
  .medbook-item .mbi-date { font-family: monospace; font-size: 12px; font-weight: 600; color: var(--text-muted); white-space: nowrap; }
  .medbook-item .mbi-status { font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.3px; white-space: nowrap; }
  .mbi-status.ok { background: var(--green-soft); color: #1B7A36; }
  .mbi-status.expiring { background: var(--amber-soft); color: #C77700; }
  .mbi-status.expired, .mbi-status.missing, .mbi-status.invalid_date { background: var(--accent-soft); color: var(--accent); }

  .team-territory-title { margin: 24px 16px 12px; padding: 12px 16px; background: linear-gradient(135deg, #F4E5FB 0%, #E8D5F0 100%); border-radius: 16px; font-size: 15px; font-weight: 800; color: #7C3FA8; display: flex; align-items: center; gap: 8px; }
  .team-territory-title .mgr-emoji { font-size: 18px; }
  .team-restaurant-title { margin: 20px 16px 8px; padding: 8px 16px; font-size: 13px; font-weight: 800; color: var(--beige-dark); text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; border-left: 3px solid var(--beige); }
  .team-card { background: var(--card-bg); border-radius: 18px; margin: 0 16px 10px; padding: 14px 16px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 14px; }
  .team-avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--beige-soft); color: var(--beige); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; flex-shrink: 0; }
  .team-info { flex: 1; min-width: 0; }
  .team-name { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
  .team-pos { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .team-status { display: flex; gap: 4px; flex-wrap: wrap; }
  .team-badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 6px; }
  .team-badge.green { background: var(--green-soft); color: #1B7A36; }
  .team-badge.red { background: var(--accent-soft); color: var(--accent); }
  .team-badge.gray { background: #F2F2F7; color: var(--text-muted); }
  .team-badge.amber { background: var(--amber-soft); color: #C77700; }
  .team-actions a { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--green-soft); color: #1B7A36; text-decoration: none; font-size: 16px; }

  .q { width: calc(100% - 32px); margin: 0 16px 16px; border: none; border-radius: 16px; padding: 16px; font-size: 16px; background: #F2F2F7; color: var(--text-main); outline: none; transition: box-shadow 0.2s; }
  .q:focus { box-shadow: 0 0 0 3px var(--accent-soft); background: #fff; }
  .btn { display: inline-block; background: var(--accent); color: #fff; border: 0; border-radius: 16px; padding: 16px; font-size: 16px; font-weight: 600; width: 100%; text-align: center; }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .rest-tab-header { margin: 24px 16px 16px; }
  .rest-tab-header .title { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
  .rest-tab-header .sub { font-size: 15px; color: var(--text-muted); margin-top: 4px; }
  .chips-container { display: flex; gap: 10px; overflow-x: auto; padding: 0 16px 16px; scrollbar-width: none; }
  .chips-container::-webkit-scrollbar { display: none; }
  .chip { padding: 10px 18px; background: var(--card-bg); border: 1px solid rgba(0,0,0,0.05); border-radius: 100px; font-size: 14px; font-weight: 600; color: var(--text-main); white-space: nowrap; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
  .chip.active { background: var(--text-main); color: #fff; border-color: var(--text-main); }
  .view-toggle-container { display: flex; margin: 0 16px 16px; background: #EAEAEE; border-radius: 16px; padding: 4px; }
  .view-toggle-btn { flex: 1; border: 0; background: transparent; padding: 10px 0; font-size: 14px; font-weight: 600; color: var(--text-muted); border-radius: 12px; transition: all 0.2s ease; }
  .view-toggle-btn.active { background: var(--card-bg); color: var(--text-main); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  #restaurants-map { height: 60vh; margin: 0 16px 16px; border-radius: 24px; overflow: hidden; box-shadow: var(--shadow); display: none; z-index: 1; }
  .rest-card { background: var(--card-bg); border-radius: 20px; margin: 0 16px 16px; padding: 20px; box-shadow: var(--shadow); cursor: pointer; transition: transform 0.15s ease; position: relative; }
  .rest-card:active { transform: scale(0.98); }
  .rest-card-header { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
  .rest-logo { width: 56px; height: 56px; border-radius: 16px; background: var(--beige-soft); display: flex; align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0; }
  .rest-info { flex: 1; min-width: 0; }
  .rest-name { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
  .rest-badge { display: inline-block; padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; }
  .rest-badge.open { background: var(--green-soft); color: #1B7A36; }
  .rest-badge.closed { background: #FFF0F0; color: #FF3B30; }
  .rest-address-row { display: flex; align-items: flex-start; gap: 8px; font-size: 14px; color: var(--text-muted); margin-bottom: 12px; line-height: 1.4; }
  .rest-actions { display: flex; gap: 10px; }
  .rest-actions a { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 12px; border-radius: 14px; font-size: 14px; font-weight: 700; text-decoration: none; transition: background 0.2s; }
  .btn-call { background: var(--green-soft); color: #1B7A36; }
  .btn-route { background: #F2F2F7; color: var(--text-main); }
  .my-rest-tag { position: absolute; top: 16px; right: 20px; font-size: 12px; background: var(--text-main); color: #fff; padding: 4px 10px; border-radius: 8px; font-weight: 700; }

  /* ================== СТИЛИ НОВОСТЕЙ ================== */
  /* Компактная карточка в ленте */
  .news-item {
    background: var(--card-bg);
    border-radius: 20px;
    margin: 0 16px 12px;
    padding: 16px;
    box-shadow: var(--shadow);
    cursor: pointer;
    display: flex;
    gap: 16px;
    align-items: center;
    transition: transform 0.15s ease;
  }
  .news-item:active { transform: scale(0.98); }
  .news-item-img {
    width: 90px; height: 90px; border-radius: 12px; object-fit: cover; flex-shrink: 0;
  }
  .news-item-content { flex: 1; min-width: 0; }
  .news-item-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .news-date { font-size: 12px; color: var(--text-muted); font-weight: 600; }
  .news-badge { font-size: 10px; font-weight: 800; padding: 3px 6px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .news-badge.urgent { background: #FFEBEA; color: var(--accent); }
  .news-badge.important { background: #FFF8E5; color: #D48806; }
  .news-item-title { font-size: 16px; font-weight: 700; line-height: 1.3; color: var(--text-main); }

  /* Полноэкранный просмотр новости */
  .news-detail-header { padding: 24px 16px; }
  .news-detail-title { font-size: 26px; font-weight: 800; margin-bottom: 16px; line-height: 1.3; letter-spacing: -0.5px; }
  .news-detail-img { width: 100%; max-height: 350px; object-fit: cover; border-radius: 16px; margin-bottom: 20px; box-shadow: var(--shadow); }
  .news-detail-text { font-size: 17px; color: #333; line-height: 1.6; white-space: pre-wrap; }

  details { background: var(--card-bg); border-radius: 16px; margin: 0 16px 12px; padding: 20px; box-shadow: var(--shadow); }
  summary { font-weight: 700; font-size: 16px; cursor: pointer; color: var(--text-main); list-style: none; display: flex; justify-content: space-between; align-items: center; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: '+'; font-size: 20px; color: var(--text-muted); font-weight: 400; }
  details[open] summary::after { content: '-'; }
  details p { margin-top: 12px; color: var(--text-muted); font-size: 15px; line-height: 1.5; }

  .checklist-card { background: var(--card-bg); border-radius: 20px; margin: 0 16px 16px; padding: 20px; box-shadow: var(--shadow); }
  .check-item { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid rgba(0,0,0,0.05); cursor: pointer; }
  .check-item:last-child { border-bottom: 0; padding-bottom: 0; }
  .check-box { width: 24px; height: 24px; border-radius: 8px; border: 2px solid #C7C7CC; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
  .check-item.checked .check-box { background: var(--green); border-color: var(--green); color: #fff; }
  .check-item.checked .check-text { text-decoration: line-through; color: var(--text-muted); }
  .check-text { font-size: 15px; font-weight: 600; color: var(--text-main); }

  .no-results { text-align: center; color: var(--text-muted); padding: 40px 16px; font-size: 15px; }
  .detail-hero { text-align: center; margin: 24px 16px; }
  .detail-hero .emoji { width: 80px; height: 80px; margin: 0 auto 16px; background: var(--beige-soft); border-radius: 24px; display: flex; align-items: center; justify-content: center; font-size: 40px; }
  .detail-hero .name { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
  .detail-status { display: inline-block; padding: 6px 16px; border-radius: 100px; font-size: 14px; font-weight: 700; }
  .detail-status.open { background: var(--green-soft); color: #1B7A36; }
  .detail-status.closed { background: #FFF0F0; color: var(--accent); }
  .detail-card { background: var(--card-bg); border-radius: 20px; margin: 0 16px 16px; padding: 20px; box-shadow: var(--shadow); }
  .detail-card .row { padding: 16px 0; border-bottom: 1px solid rgba(0,0,0,0.05); font-size: 16px; }
  .detail-card .row:last-child { border-bottom: 0; }
  .detail-card .row .lbl { color: var(--text-muted); font-size: 13px; margin-bottom: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .btn-back { display: block; margin: 0 16px 24px; padding: 16px; background: #F2F2F7; color: var(--text-main); border: none; border-radius: 16px; font-size: 16px; font-weight: 600; text-align: center; width: calc(100% - 32px); }

  .toast { position: fixed; bottom: calc(100px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%) translateY(20px); background: rgba(28, 28, 30, 0.95); color: #fff; padding: 12px 20px; border-radius: 16px; font-size: 14px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,0.2); z-index: 2000; opacity: 0; pointer-events: none; transition: all 0.3s ease; max-width: 88vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: rgba(255, 59, 48, 0.95); }

  .loading { text-align: center; padding: 40px 16px; color: var(--text-muted); }
</style>

<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">🍜</div>
    <div class="login-title">Wokker</div>
    <div class="login-sub">Вход в приложение</div>
    <input class="login-input" id="login-login" type="text" placeholder="Логин" maxlength="5" autocomplete="username" style="text-transform: lowercase;">
    <input class="login-input" id="login-password" type="password" placeholder="Пароль" autocomplete="current-password">

<script>
/* ================== CONFIG ================== */
const TOKEN_KEY = 'wokker_staff_token';
const SEEN_NEWS_KEY = 'wokker_seen_news';
const CHECKLIST_KEY = 'wokker_checklist';
const YANDEX_MAPS_API_KEY = 'f35e1fb6-2431-4c95-98c8-4b99f54d97c1';
const LOGIN_RE = /^[a-z]{3}\d{2}$/;

let BOOT = null;
let currentStandardCat = 'all';
let currentRestFilter = 'all';
let yandexMap = null;
let yandexClusterer = null;
let _yandexMapsPromise = null;

/* ================== UTILS ================== */
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);

function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }
function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
function clearToken() { localStorage.removeItem(TOKEN_KEY); }

let _toastTimer = null;
function showToast(text, type) {
  const el = $('toast');
  el.textContent = text;
  el.classList.remove('error');
  if (type === 'error') el.classList.add('error');
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

async function api(path, body) {
  const payload = { webToken: getToken() };
  if (body && typeof body === 'object') Object.assign(payload, body);
  const res = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  if (res.status === 401) { clearToken(); showLogin(); throw new Error('unauthorized'); }
  if (res.status === 403) {
    let j = {};
    try { j = await res.json(); } catch (e) {}
    if (j.error === 'fired') { clearToken(); showLogin(); throw new Error('fired'); }
    throw new Error(j.error || 'forbidden');
  }
  if (!res.ok) {
    let msg = 'error';
    try { 
        const j = await res.json(); 
        msg = j.detail || j.error || msg; 
    } catch (e) {}
    throw new Error(msg);
  }
  return res.json();
}

function fmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    const pad = n => String(n).padStart(2, '0');
    return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`;
  } catch (e) { return iso; }
}

/* ================== LOGIN ================== */
function showLogin() {
  $('main-app').style.display = 'none';
  $('login-screen').style.display = 'flex';
  $('login-error').textContent = '';
  $('login-login').value = '';
  $('login-password').value = '';
}
function showMainApp() {
  $('login-screen').style.display = 'none';
  $('main-app').style.display = 'block';
}

$('login-login').addEventListener('input', e => {
  e.target.value = e.target.value.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 5);
});

async function doLogin() {
  const login = $('login-login').value.trim().toLowerCase();
  const password = $('login-password').value;
  const errEl = $('login-error');
  errEl.textContent = '';
  if (!LOGIN_RE.test(login)) { errEl.textContent = 'Логин: 3 латинские буквы + 2 цифры'; return; }
  if (!password) { errEl.textContent = 'Введите пароль'; return; }
  const btn = $('login-btn');
  btn.disabled = true; btn.textContent = 'Проверяем…';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ login, password }),
    });
    if (res.status === 401) { errEl.textContent = '❌ Неверный логин или пароль'; return; }
    if (res.status === 403) { errEl.textContent = '❌ Аккаунт уволен'; return; }
    if (!res.ok) { errEl.textContent = 'Ошибка сервера'; return; }
    const data = await res.json();
    if (!data.token) { errEl.textContent = 'Ошибка'; return; }
    setToken(data.token);
    await loadAndRender();
  } catch (e) {
    errEl.textContent = 'Сеть недоступна';
  } finally {
    btn.disabled = false; btn.textContent = 'Войти';
  }
}

$('login-btn').addEventListener('click', doLogin);
$('login-password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
$('login-login').addEventListener('keydown', e => { if (e.key === 'Enter') $('login-password').focus(); });

/* ================== BOOTSTRAP ================== */
async function loadAndRender() {
  try {
    const data = await api('/api/bootstrap', {});
    BOOT = data;
    if (!BOOT.profile) { showToast('Профиль не найден', 'error'); showLogin(); return; }
    showMainApp();
    checkTeamTabVisibility();
    updateNewsBadge();
    renderProfileFromBoot();
    renderTeamFromBoot();
    renderNewsFromBoot();
    renderRestaurants();
    renderStandardsFromBoot();
    renderFaqFromBoot();
  } catch (e) {
    if (e.message !== 'unauthorized' && e.message !== 'fired') showToast('Ошибка загрузки', 'error');
  }
}

function checkTeamTabVisibility() {
  const tab = $('tab-team');
  const canSee = !!(BOOT && BOOT.can_see_team);
  tab.style.display = canSee ? 'flex' : 'none';
}

/* ================== TABS ================== */
const sectionLoaders = {
  'sec-profile': () => renderProfileFromBoot(),
  'sec-team': () => renderTeamFromBoot(),
  'sec-restaurants': () => {
    renderRestaurants();
    if ($('btn-view-map').classList.contains('active') && yandexMap) {
      setTimeout(() => { try { yandexMap.container.fitToViewport(); } catch (e) {} }, 100);
    }
  },
  'sec-news': () => { renderNewsFromBoot(); markNewsSeen(); },
  'sec-standards': () => renderStandardsFromBoot(),
  'sec-faq': () => renderFaqFromBoot(),
};

document.querySelectorAll('.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    exitDetailView();
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    btn.classList.add('active');
    $(btn.dataset.sec).classList.add('active');
    window.scrollTo(0, 0);
    const loader = sectionLoaders[btn.dataset.sec];
    if (loader) loader();
  });
});

/* ================== NEWS BADGE ================== */
function updateNewsBadge() {
  const news = (BOOT && BOOT.news) || [];
  let seen = [];
  try { seen = JSON.parse(localStorage.getItem(SEEN_NEWS_KEY) || '[]'); } catch (e) {}
  const hasUnread = news.some(n => !seen.includes(n.id));
  const badge = $('news-badge');
  if (badge) badge.classList.toggle('show', hasUnread);
}
function markNewsSeen() {
  const news = (BOOT && BOOT.news) || [];
  try { localStorage.setItem(SEEN_NEWS_KEY, JSON.stringify(news.map(n => n.id))); } catch (e) {}
  const badge = $('news-badge');
  if (badge) badge.classList.remove('show');
}

/* ================== PROFILE ================== */
function renderProfileFromBoot() {
  const box = $('profile-box');
  if (!BOOT || !BOOT.profile) { box.innerHTML = '<div class="no-results">Профиль недоступен</div>'; return; }
  const p = BOOT.profile;
  const mb = BOOT.medbook || null;
  const restBadge = p.restaurant_key === 'office' ? 'office' : 'normal';
  const avatarLetter = (p.full_name || p.first_name || '?').charAt(0).toUpperCase();
  const phoneClean = (p.phone || '').replace(/[^\d+]/g, '');

  let medbookHtml = '';
  if (mb && !p.is_admin) {
    let statusClass = 'invalid', statusText = '❌ Недействительна';
    if (mb.status === 'ok') { statusClass = 'ok'; statusText = '✅ Действительна'; }
    else if (mb.status === 'expiring') { statusClass = 'expiring'; statusText = '⚠️ Скоро истекает'; }

    const renderItems = (items) => items.map(it => {
      let stText = '', stClass = '';
      if (it.status === 'ok') { stText = 'OK'; stClass = 'ok'; }
      else if (it.status === 'expiring') { stText = 'Скоро'; stClass = 'expiring'; }
      else if (it.status === 'expired') { stText = 'Просроч.'; stClass = 'expired'; }
      else if (it.status === 'missing') { stText = 'Нет'; stClass = 'missing'; }
      else { stText = 'Ошибка'; stClass = 'invalid_date'; }
      const dateStr = it.date || '—';
      return `
        <div class="medbook-item">
          <div class="mbi-name">${esc(it.name)}${it.required ? '<span class="req">*</span>' : ''}</div>
          <div class="mbi-date">${esc(dateStr)}</div>
          <div class="mbi-status ${stClass}">${stText}</div>
        </div>`;
    }).join('');

    medbookHtml = `
      <div class="medbook-card">
        <div class="medbook-header">
          <h3>🩺 Медкнижка</h3>
          <span class="medbook-status ${statusClass}">${statusText}</span>
        </div>
        <div class="medbook-sub">${mb.missing > 0 ? `Не заполнено ${mb.missing} из ${mb.total}` : `Все пункты заполнены (${mb.total})`}</div>
        <details>
          <summary>Показать все пункты (${mb.total})</summary>
          <div class="medbook-block">
            <h4>👨‍⚕️ Врачи</h4>
            ${renderItems(mb.doctors || [])}
          </div>
          <div class="medbook-block">
            <h4>🧪 Анализы</h4>
            ${renderItems(mb.tests || [])}
          </div>
          <div class="medbook-block">
            <h4>💉 Прививки</h4>
            ${renderItems(mb.vaccines || [])}
          </div>
        </details>
      </div>
    `;
  }

  box.innerHTML = `
    <div class="profile-wrapper">
      <div class="profile-card">
        <div class="profile-header">
          <div class="avatar-ring"><div class="avatar-inner">${esc(avatarLetter)}</div></div>
          <div class="p-name">${esc(p.full_name || '—')}</div>
          <div class="p-pos">${esc(p.position || '—')}</div>
          <div class="status-pill"><span class="dot"></span> Активен</div>
        </div>
        <div class="info-section">
          <div class="info-group">
            <div class="info-item">
              <div class="info-icon icon-rest">📍</div>
              <div class="info-text">
                <div class="info-lbl">Ресторан</div>
                <div class="info-val"><span class="badge-rest ${restBadge}">${esc(p.restaurant || '—')}</span></div>
              </div>
            </div>
            <div class="info-item">
              <div class="info-icon icon-phone">📞</div>
              <div class="info-text">
                <div class="info-lbl">Телефон</div>
                <div class="info-val">${phoneClean ? `<a href="tel:${esc(phoneClean)}">${esc(p.phone)}</a>` : '—'}</div>
              </div>
            </div>
            <div class="info-item">
              <div class="info-icon icon-birth">🎂</div>
              <div class="info-text">
                <div class="info-lbl">Дата рождения</div>
                <div class="info-val">${esc(p.birth_date || '—')}</div>
              </div>
            </div>
            <div class="info-item">
              <div class="info-icon icon-cert">📜</div>
              <div class="info-text">
                <div class="info-lbl">Сертификация</div>
                <div class="info-val">${p.is_certified ? '<span style="color:var(--green);">✅ Пройдена</span>' : '<span style="color:var(--text-muted);">❌ Не пройдена</span>'}</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      ${medbookHtml}

      <div class="actions-block">
        ${p.is_admin ? `<button class="action-btn admin" id="open-admin-btn">🛠 Открыть админ-панель</button>` : ''}
        <button class="action-btn" id="report-bug-btn">⚠️ Сообщить об ошибке</button>
        <button class="action-btn danger" id="logout-btn">🚪 Выйти из аккаунта</button>
      </div>
    </div>
  `;

  $('logout-btn').addEventListener('click', logout);
  $('report-bug-btn').addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelector('.tabs button[data-sec="sec-faq"]').classList.add('active');
    $('sec-faq').classList.add('active');
    window.scrollTo(0, 0);
    setTimeout(() => { const inp = $('question-input'); if (inp) inp.focus(); }, 300);
  });
  const adminBtn = $('open-admin-btn');
  if (adminBtn) adminBtn.addEventListener('click', () => { window.location.href = '/admin'; });
}

async function logout() {
  if (!confirm('Выйти из аккаунта?')) return;
  try { await api('/api/auth/logout', {}); } catch (e) {}
  clearToken();
  BOOT = null;
  showLogin();
}

/* ================== TEAM ================== */
function positionPriority(pos) {
  const lp = (pos || "").toLowerCase();
  if (lp.includes("управляющий сменой")) return 1;
  if (lp.includes("горячего")) return 2;
  if (lp.includes("холодного")) return 3;
  return 99;
}

function sortByPosition(arr) {
  return arr.slice().sort((a, b) => {
    const pa = positionPriority(a.position), pb = positionPriority(b.position);
    if (pa !== pb) return pa - pb;
    return (a.full_name || "").localeCompare(b.full_name || "");
  });
}

function renderTeamCard(t) {
  const initial = (t.full_name || "?").charAt(0).toUpperCase();
  const badges = [];
  if (t.is_certified) badges.push('<span class="team-badge green">📜 Сертификат</span>');
  else badges.push('<span class="team-badge gray">📜 Нет сертификата</span>');

  if (t.medbook_status === 'ok') badges.push('<span class="team-badge green">🩺 Медкнижка</span>');
  else if (t.medbook_status === 'expiring') badges.push('<span class="team-badge amber">🩺 Скоро истекает</span>');
  else badges.push('<span class="team-badge red">🩺 Недействительна</span>');

  const phoneClean = (t.phone || "").replace(/[^\d+]/g, "");
  return `
    <div class="team-card">
      <div class="team-avatar">${esc(initial)}</div>
      <div class="team-info">
        <div class="team-name">${esc(t.full_name || "—")}</div>
        <div class="team-pos">${esc(t.position || "—")}</div>
        <div class="team-status">${badges.join("")}</div>
      </div>
      ${phoneClean ? `<div class="team-actions"><a href="tel:${esc(phoneClean)}" aria-label="Позвонить">📞</a></div>` : ""}
    </div>`;
}

function renderTeamFromBoot() {
  const box = $('team-list');
  const team = (BOOT && BOOT.team) || [];
  const pos = (BOOT && BOOT.profile && BOOT.profile.position || "").toLowerCase();
  const isHR = pos.trim() === "hr";
  const isTU = pos.includes("территориальный");
  const isUS = pos.includes("управляющий сменой");

  const subtitle = $('team-subtitle');
  if (subtitle) {
    if (isHR) subtitle.textContent = "Все сотрудники по территориям";
    else if (isTU) subtitle.textContent = "Сотрудники ваших ресторанов";
    else subtitle.textContent = "Сотрудники вашего ресторана";
  }

  if (!team.length) {
    box.innerHTML = '<div class="no-results">Список сотрудников пуст</div>';
    return;
  }

  if (isHR) {
    const byMgr = {};
    for (const t of team) {
      const mgr = t.manager_name || "Без территориального управляющего";
      const rest = t.restaurant_name || "Без ресторана";
      if (!byMgr[mgr]) byMgr[mgr] = {};
      if (!byMgr[mgr][rest]) byMgr[mgr][rest] = [];
      byMgr[mgr][rest].push(t);
    }
    let html = "";
    const mgrs = Object.keys(byMgr).sort();
    for (const mgr of mgrs) {
      html += `<div class="team-territory-title"><span class="mgr-emoji">🏢</span>${esc(mgr)}</div>`;
      const rests = Object.keys(byMgr[mgr]).sort();
      for (const rest of rests) {
        html += `<div class="team-restaurant-title">📍 ${esc(rest)}</div>`;
        html += sortByPosition(byMgr[mgr][rest]).map(renderTeamCard).join("");
      }
    }
    box.innerHTML = html;
    return;
  }

  if (isTU) {
    const byRest = {};
    for (const t of team) {
      const rest = t.restaurant_name || "Без ресторана";
      if (!byRest[rest]) byRest[rest] = [];
      byRest[rest].push(t);
    }
    let html = "";
    const rests = Object.keys(byRest).sort();
    for (const rest of rests) {
      html += `<div class="team-restaurant-title">📍 ${esc(rest)}</div>`;
      html += sortByPosition(byRest[rest]).map(renderTeamCard).join("");
    }
    box.innerHTML = html;
    return;
  }

  box.innerHTML = sortByPosition(team).map(renderTeamCard).join("");
}

/* ================== RESTAURANTS ================== */
function renderRestaurantsList(list, query) {
  const box = $('restaurants-list');
  const q = (query || '').trim().toLowerCase();
  const myKey = (BOOT && BOOT.profile && BOOT.profile.restaurant_key) || '';
  let filtered = list.filter(r => ((r.name || '') + ' ' + (r.address || '')).toLowerCase().indexOf(q) !== -1);
  if (currentRestFilter === 'open') filtered = filtered.filter(r => r.force_status !== 'closed');
  if (currentRestFilter === 'my') filtered = filtered.filter(r => r.key === myKey);
  filtered.sort((a, b) => {
    const aIsMy = a.key === myKey;
    const bIsMy = b.key === myKey;
    if (aIsMy && !bIsMy) return -1;
    if (!aIsMy && bIsMy) return 1;
    return (a.name || '').localeCompare(b.name || '');
  });
  if (!filtered.length) { box.innerHTML = '<div class="no-results">Ничего не нашлось</div>'; return; }
  box.innerHTML = filtered.map(r => {
    const isMy = r.key === myKey;
    const routeUrl = r.org
      ? 'https://yandex.ru/maps/org/' + encodeURI(r.org)
      : 'https://yandex.ru/maps/?text=' + encodeURIComponent(r.address || '');
    const phoneClean = (r.phone || '').replace(/[^\d+]/g, '');
    const isOpen = r.force_status !== 'closed';
    return `
      <div class="rest-card" data-key="${esc(r.key)}">
        ${isMy ? '<div class="my-rest-tag">Мой ресторан</div>' : ''}
        <div class="rest-card-header">
          <div class="rest-logo">🍜</div>
          <div class="rest-info">
            <div class="rest-name">${esc(r.name)}</div>
            <span class="rest-badge ${isOpen ? 'open' : 'closed'}">${isOpen ? 'Открыто' : 'Закрыто'}</span>
          </div>
        </div>
        <div class="rest-address-row"><span>📍</span> ${esc(r.address || '')}</div>
        <div class="rest-actions">
          ${phoneClean ? `<a href="tel:${esc(phoneClean)}" class="btn-call" onclick="event.stopPropagation()">Позвонить</a>` : ''}
          <a href="${routeUrl}" target="_blank" rel="noopener" class="btn-route" onclick="event.stopPropagation()">Маршрут</a>
        </div>
      </div>
    `;
  }).join('');
}

function renderRestaurants() {
  if (!BOOT) return;
  const query = $('rest-search').value;
  renderRestaurantsList(BOOT.restaurants || [], query);
  if ($('btn-view-map').classList.contains('active') && window.ymaps) {
    initInteractiveMap(BOOT.restaurants || []);
  }
}

document.querySelectorAll('#rest-filters .chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('#rest-filters .chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    currentRestFilter = chip.dataset.filter;
    renderRestaurants();
  });
});

$('btn-view-list').addEventListener('click', function() {
  $('btn-view-map').classList.remove('active');
  this.classList.add('active');
  $('restaurants-map').style.display = 'none';
  $('rest-list-wrapper').style.display = 'block';
});

function loadYandexMaps() {
  if (window.ymaps) return Promise.resolve();
  if (_yandexMapsPromise) return _yandexMapsPromise;
  _yandexMapsPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://api-maps.yandex.ru/2.1/?apikey=' + encodeURIComponent(YANDEX_MAPS_API_KEY) + '&lang=ru_RU';
    s.onload = () => ymaps.ready(resolve);
    s.onerror = reject;
    document.head.appendChild(s);
  }).finally(() => { _yandexMapsPromise = null; });
  return _yandexMapsPromise;
}

function initInteractiveMap(restaurants) {
  const mapContainer = $('restaurants-map');
  if (!window.ymaps) return;
  if (!yandexMap) {
    yandexMap = new ymaps.Map(mapContainer, { center: [55.7558, 37.6173], zoom: 10, controls: ['zoomControl'] });
    yandexClusterer = new ymaps.Clusterer({ preset: 'islands#invertedVioletClusterIcons' });
    yandexMap.geoObjects.add(yandexClusterer);
  }
  yandexClusterer.removeAll();
  const placemarks = restaurants.filter(r => r.lat && r.lon).map(r => new ymaps.Placemark(
    [r.lat, r.lon],
    { hintContent: r.name, balloonContent: r.name },
    { preset: r.force_status !== 'closed' ? 'islands#greenIcon' : 'islands#redIcon' }
  ));
  yandexClusterer.add(placemarks);
  if (placemarks.length > 0) {
    try { yandexMap.setBounds(yandexClusterer.getBounds(), { checkZoomRange: true, zoomMargin: 30 }); } catch (e) {}
  }
  setTimeout(() => { try { if (yandexMap) yandexMap.container.fitToViewport(); } catch (e) {} }, 200);
}

$('btn-view-map').addEventListener('click', async function() {
  $('btn-view-list').classList.remove('active');
  this.classList.add('active');
  $('rest-list-wrapper').style.display = 'none';
  const mapContainer = $('restaurants-map');
  mapContainer.style.display = 'block';
  mapContainer.innerHTML = '<div class="loading">Загрузка карты…</div>';
  try {
    await loadYandexMaps();
    mapContainer.innerHTML = '';
    initInteractiveMap((BOOT && BOOT.restaurants) || []);
  } catch (e) {
    mapContainer.innerHTML = '<div class="loading">Не удалось загрузить карту</div>';
  }
});

$('rest-search').addEventListener('input', () => renderRestaurants());

$('restaurants-list').addEventListener('click', function(e) {
  const card = e.target.closest('.rest-card');
  if (card && card.dataset.key) showDetail(card.dataset.key);
});

function showDetail(key) {
  const section = $('sec-detail');
  const box = $('detail-box');
  const r = (BOOT.restaurants || []).find(x => x.key === key);
  if (r) {
    const routeUrl = r.org
      ? 'https://yandex.ru/maps/org/' + encodeURI(r.org)
      : 'https://yandex.ru/maps/?text=' + encodeURIComponent(r.address || '');
    const phoneClean = (r.phone || '').replace(/[^\d+]/g, '');
    const isOpen = r.force_status !== 'closed';
    box.innerHTML = `
      <div class="detail-hero">
        <div class="emoji">🍜</div>
        <div class="name">${esc(r.name)}</div>
        <span class="detail-status ${isOpen ? 'open' : 'closed'}">${isOpen ? 'Открыто' : 'Закрыто'}</span>
      </div>
      <div class="detail-card">
        <div class="row"><div class="lbl">Адрес</div>${esc(r.address || '—')}</div>
        ${phoneClean ? `<div class="row"><div class="lbl">Телефон</div><a href="tel:${esc(phoneClean)}" style="color:var(--accent);font-weight:700;text-decoration:none;">${esc(r.phone)}</a></div>` : ''}
        <div class="row"><div class="lbl">Часы работы</div>${esc((r.hours || '—').replace(/\n/g, ' · '))}</div>
      </div>
      <a href="${routeUrl}" target="_blank" rel="noopener" class="btn" style="display:block; width:calc(100% - 32px); margin: 0 16px; text-decoration:none;">Открыть в Яндекс Картах</a>
    `;
  }
  document.querySelector('.tabs').style.display = 'none';
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  section.classList.add('active');
  window.scrollTo(0, 0);
}

function exitDetailView() {
  const tabs = document.querySelector('.tabs');
  if (tabs) tabs.style.display = 'flex';
}

$('detail-back').addEventListener('click', () => {
  exitDetailView();
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  document.querySelector('.tabs button[data-sec="sec-restaurants"]').classList.add('active');
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  $('sec-restaurants').classList.add('active');
  renderRestaurants();
});

/* ================== NEWS ================== */
function renderNewsFromBoot() {
  const box = $('news-list');
  const list = (BOOT && BOOT.news) || [];
  const published = list.filter(n => n.status === 'published');
  
  if (!published.length) { 
    box.innerHTML = '<div class="no-results">Пока новостей нет</div>'; 
    return; 
  }
  
  box.innerHTML = published.map(n => {
    const lvl = ['urgent', 'important'].includes(n.level) ? n.level : 'normal';
    let badgeHtml = '';
    if (lvl === 'urgent') badgeHtml = '<span class="news-badge urgent">Срочно</span>';
    else if (lvl === 'important') badgeHtml = '<span class="news-badge important">Важно</span>';
    const dateStr = fmtDate(n.created_at);
    
    // Маленькая квадратная картинка для ленты
    const imageHtml = n.image_url 
      ? `<img src="${esc(n.image_url)}" class="news-item-img">` 
      : '';

    return `
      <div class="news-item" onclick="showNewsDetail(${n.id})">
        ${imageHtml}
        <div class="news-item-content">
          <div class="news-item-meta">
            <div class="news-date">${esc(dateStr)}</div>
            ${badgeHtml}
          </div>
          <div class="news-item-title">${esc(n.title)}</div>
        </div>
      </div>
    `;
  }).join('');
}

function showNewsDetail(id) {
  const n = (BOOT && BOOT.news || []).find(x => x.id === id);
  if (!n) return;

  const lvl = ['urgent', 'important'].includes(n.level) ? n.level : 'normal';
  let badgeHtml = '';
  if (lvl === 'urgent') badgeHtml = '<span class="news-badge urgent">Срочно</span>';
  else if (lvl === 'important') badgeHtml = '<span class="news-badge important">Важно</span>';
  
  const dateStr = fmtDate(n.created_at);
  
  // Большая картинка для детального вида
  const imageHtml = n.image_url 
    ? `<img src="${esc(n.image_url)}" class="news-detail-img">` 
    : '';

  $('news-detail-box').innerHTML = `
    <div class="news-detail-header">
      <div class="news-item-meta" style="margin-bottom: 12px;">
        <div class="news-date">${esc(dateStr)}</div>
        ${badgeHtml}
      </div>
      <div class="news-detail-title">${esc(n.title)}</div>
      ${imageHtml}
      <div class="news-detail-text">${esc(n.body)}</div>
    </div>
  `;

  // Прячем табы и переключаем экран
  document.querySelector('.tabs').style.display = 'none';
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  $('sec-news-detail').classList.add('active');
  window.scrollTo(0, 0);
}

$('news-detail-back').addEventListener('click', () => {
  // Возвращаем табы и переключаем обратно на ленту
  document.querySelector('.tabs').style.display = 'flex';
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  $('sec-news').classList.add('active');
  
  // Возвращаем активный цвет вкладке "Новости"
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  document.querySelector('.tabs button[data-sec="sec-news"]').classList.add('active');
  window.scrollTo(0, 0);
});

/* ================== STANDARDS ================== */
function renderStandardsFromBoot() {
  const box = $('standards-list');
  const list = (BOOT && BOOT.standards) || [];
  const container = $('standards-chips');
  const cats = ['all', 'shift_checklist', ...new Set(list.map(s => s.category).filter(Boolean))];
  container.innerHTML = cats.map(cat => {
    const label = cat === 'all' ? 'Все' : cat === 'shift_checklist' ? '📋 Смена' : cat;
    return `<div class="chip ${currentStandardCat === cat ? 'active' : ''}" data-cat="${esc(cat)}">${esc(label)}</div>`;
  }).join('');
  container.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      currentStandardCat = chip.dataset.cat;
      $('standard-search').value = '';
      renderStandardsFromBoot();
    });
  });
  const query = ($('standard-search').value || '').trim().toLowerCase();
  let htmlContent = '';
  if ((currentStandardCat === 'shift_checklist' || currentStandardCat === 'all') && (!query || 'чек-лист'.includes(query))) {
    htmlContent += '<div class="checklist-card"><b style="margin-bottom:16px; font-size:18px; display:block;">📋 Чек-лист открытия</b><div id="shift-checklist"></div></div>';
  }
  const filtered = list.filter(s => {
    const matchCat = currentStandardCat === 'all' || s.category === currentStandardCat;
    const hay = ((s.title || '') + ' ' + (s.description || '')).toLowerCase();
    const matchQuery = !query || hay.indexOf(query) !== -1;
    return matchCat && matchQuery;
  });
  htmlContent += filtered.map(s => `
    <div class="card" style="padding: 20px;">
      <b style="font-size: 18px; margin-bottom: 4px; display: block;">${esc(s.title)}</b>
      <div style="font-size: 13px; color: var(--accent); font-weight: 700; text-transform: uppercase; margin-bottom: 8px;">${esc(s.category || '')}</div>
      <div style="color: var(--text-muted); font-size: 15px; line-height: 1.5;">${esc(s.description || '')}</div>
      ${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener" style="display:inline-block;margin-top:10px;color:var(--accent);font-weight:700;text-decoration:none;font-size:14px;">Открыть →</a>` : ''}
    </div>
  `).join('');
  box.innerHTML = htmlContent || '<div class="no-results">Ничего не найдено</div>';
  if ($('shift-checklist')) initShiftChecklist();
}

function initShiftChecklist() {
  const container = $('shift-checklist');
  const tasks = [
    { id: 't1', text: 'Проверить чистоту рабочей зоны' },
    { id: 't2', text: 'Убедиться в корректности цен и меню' },
    { id: 't3', text: 'Проверить наличие упаковок и сырья' },
    { id: 't4', text: 'Синхронизироваться с командой' },
  ];
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(CHECKLIST_KEY) || '{}'); } catch (e) {}
  container.innerHTML = tasks.map(t => {
    const isDone = !!saved[t.id];
    return `<div class="check-item ${isDone ? 'checked' : ''}" data-id="${t.id}"><div class="check-box">${isDone ? '✓' : ''}</div><div class="check-text">${esc(t.text)}</div></div>`;
  }).join('');
  container.querySelectorAll('.check-item').forEach(item => {
    item.addEventListener('click', () => {
      const id = item.dataset.id;
      saved[id] = !saved[id];
      try { localStorage.setItem(CHECKLIST_KEY, JSON.stringify(saved)); } catch (e) {}
      item.classList.toggle('checked', !!saved[id]);
      item.querySelector('.check-box').textContent = saved[id] ? '✓' : '';
    });
  });
}

$('standard-search').addEventListener('input', () => renderStandardsFromBoot());

/* ================== FAQ ================== */
function renderFaqFromBoot() {
  const box = $('faq-list');
  const list = (BOOT && BOOT.faq) || [];
  if (!list.length) { box.innerHTML = '<div class="no-results">Нет вопросов</div>'; return; }
  box.innerHTML = list.map(f => `<details><summary>${esc(f.question)}</summary><p>${esc(f.answer)}</p></details>`).join('');
}

$('send-question').addEventListener('click', async function() {
  const btn = this;
  const input = $('question-input');
  const text = (input.value || '').trim();
  if (!text) { showToast('Введите вопрос'); return; }
  btn.disabled = true;
  const oldLabel = btn.textContent;
  btn.textContent = 'Отправляем…';
  try {
    await api('/api/questions', { question: text });
    input.value = '';
    showToast('✅ Вопрос отправлен');
  } catch (e) {
    if (e.message !== 'unauthorized' && e.message !== 'fired') showToast('Не удалось отправить', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = oldLabel;
  }
});

/* ================== PWA ================== */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}

(async function init() {
  if (!getToken()) { showLogin(); return; }
  await loadAndRender();
})();
