<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wokker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --blue: #ff2d55;
    --bg: #f2f2f7;
    --gray: #9aa0a6;
    --green: #34c759;
    --beige: #c3a578;
    --beige-dark: #b2946a;
    --beige-soft: #f6efe3;
    --beige-border: #e6d8c2;
    --map-border: #d9534f;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, sans-serif; background: var(--bg); padding-bottom: 96px; }
  .card { background: #fff; border-radius: 14px; margin: 0 12px 12px; padding: 14px; }
  .card b { display: block; margin-bottom: 6px; }
  .muted { color: #8e8e93; font-size: 14px; }
  .btn { display: inline-block; background: var(--blue); color: #fff; border: 0;
         border-radius: 10px; padding: 10px 16px; font-size: 15px; margin-top: 8px; }

  /* ===== Плавающая док-панель ===== */
  .tabs {
    position: fixed;
    bottom: calc(10px + env(safe-area-inset-bottom));
    left: 10px;
    right: 10px;
    display: flex;
    background: rgba(255, 255, 255, .78);
    backdrop-filter: blur(18px) saturate(1.4);
    -webkit-backdrop-filter: blur(18px) saturate(1.4);
    border: 1px solid rgba(0, 0, 0, .05);
    border-radius: 24px;
    padding: 6px;
    box-shadow: 0 8px 24px rgba(30, 20, 10, .12);
    z-index: 100;
  }
  .tabs button {
    flex: 1;
    border: 0;
    background: none;
    padding: 7px 2px 6px;
    font-size: 10px;
    color: #9a938a;
    border-radius: 18px;
    transition: color .2s ease, background .25s ease, transform .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .tabs button:active { transform: scale(.94); }
  .tabs button.active {
    color: #b2946a;
    font-weight: 700;
    background: linear-gradient(135deg, var(--beige-soft), #fdf8ef);
    box-shadow: inset 0 0 0 1px rgba(195, 165, 120, .25);
  }
  .tabs button.active span { transform: translateY(-2px) scale(1.12); }
  .tabs span {
    display: block;
    font-size: 21px;
    margin-bottom: 2px;
    transition: transform .25s cubic-bezier(.34, 1.56, .64, 1);
  }

  .section { display: none; }
  .section.active { display: block; }
  .q { width: calc(100% - 24px); margin: 4px 12px 12px; border: 1px solid #e5e5ea;
       border-radius: 10px; padding: 10px; font-size: 15px; background: #fff; outline: none; }
  .q:focus { border-color: var(--beige); }
  details { background: #fff; border-radius: 14px; margin: 0 12px 10px; padding: 14px; }
  summary { font-weight: 600; cursor: pointer; }
  details p { margin-top: 8px; color: #3a3a3c; }

  /* ===== Скелетон: мгновенная заглушка вместо пустого экрана ===== */
  .skeleton-card {
    background: #fff; border-radius: 14px; margin: 12px 12px 12px; padding: 16px;
  }
  .skeleton-line {
    height: 14px; border-radius: 7px; margin-bottom: 10px;
    background: linear-gradient(90deg, #f0e9dd 25%, #f8f3ea 50%, #f0e9dd 75%);
    background-size: 200% 100%;
    animation: shimmer 1.2s infinite linear;
  }
  .skeleton-line.short { width: 45%; margin-bottom: 0; }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .greeting { margin: 14px 12px 4px; padding: 0 4px; }
  .greeting .g-title { font-size: 22px; font-weight: 700; color: #3a2f1f; line-height: 1.25; }
  .greeting .g-sub { font-size: 13px; color: #96876f; margin-top: 2px; }

  .greet-banner { margin: 12px 12px 0; padding: 16px; border-radius: 16px;
    border: 1px solid var(--beige-border);
    background: linear-gradient(135deg, var(--beige-soft), #fdf9f2); text-align: center; }
  .greet-banner .gb-title { font-size: 18px; font-weight: 700; color: #3a2f1f; }
  .greet-banner .gb-sub { font-size: 13px; color: #7c6b52; margin-top: 4px; line-height: 1.45; }
  .greet-banner.birthday { background: linear-gradient(135deg, #ffe9ec, #fff5f0); border-color: #f3c1c9; }
  .greet-banner.birthday .gb-title { color: #b0435f; }

  .profile-card { background: #fff; border-radius: 18px; margin: 8px 12px 12px;
    overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,.07); }
  .profile-header { background: linear-gradient(135deg, #ff2d55, #ff6a3d);
    color: #fff; padding: 24px 16px 18px; text-align: center; }
  .avatar-ring { width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 12px;
    padding: 3px; background: linear-gradient(135deg, var(--beige-soft), var(--beige));
    box-sizing: border-box; }
  .avatar-ring .avatar { width: 100%; height: 100%; margin: 0;
    border: 2px solid #fff; border-radius: 50%;
    background-color: rgba(255,255,255,.25);
    background-size: cover; background-position: center;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 700; color: #fff; }
  .p-name { font-size: 19px; font-weight: 700; line-height: 1.25; }
  .p-pos { font-size: 13px; opacity: .92; margin-top: 3px; }
  .badge { display: inline-block; margin-top: 10px; padding: 4px 14px;
    background: rgba(255,255,255,.28); border-radius: 20px; font-size: 12px; font-weight: 600; }
  .info-list { padding: 4px 14px 10px; }
  .info-row { display: flex; align-items: center; padding: 11px 2px;
    border-bottom: 1px solid #f0f0f4; font-size: 15px; }
  .info-row:last-child { border-bottom: 0; }
  .info-row .ico { width: 28px; font-size: 16px; }
  .info-row .lbl { color: #8e8e93; flex: 1; }
  .info-row .val { font-weight: 600; text-align: right; max-width: 62%; overflow-wrap: break-word; }
  .profile-footer { background: #f8f8fb; padding: 10px 14px; font-size: 12px; color: #8e8e93; }
  .profile-footer button { background: none; border: 0; color: var(--blue); font-size: 12px;
    font-weight: 600; padding: 0; text-decoration: underline; cursor: pointer; }
  .badge-rest { display: inline-block; padding: 2px 10px; border-radius: 12px;
    font-size: 12px; font-weight: 600; color: #fff; }
  .badge-rest.office { background: var(--gray); }
  .badge-rest.normal { background: var(--green); }
  @media (min-width: 600px) {
    .info-list { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 8px 14px 10px; }
    .info-row { border-bottom: none; padding: 8px 0; }
  }

  .rest-tab-header { margin: 12px 12px 4px; padding: 14px 16px;
    background: linear-gradient(135deg, var(--beige-soft), #fdf9f2);
    border: 1px solid var(--beige-border); border-radius: 16px; }
  .rest-tab-header .title { font-size: 17px; font-weight: 700; color: #5c4a33; }
  .rest-tab-header .sub { font-size: 13px; color: #96876f; margin-top: 2px; }
  .rest-count { display: inline-block; margin-top: 8px; padding: 3px 10px;
    background: #fff; border: 1px solid var(--beige-border);
    border-radius: 12px; font-size: 12px; color: #7c6b52; font-weight: 600; }

  .rest-card { background: #fff; border-radius: 16px; margin: 8px 12px 12px;
    padding: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.05); border: 1px solid #f0ebe2; }
  .rest-card.rest-card-closed { opacity: 0.92; box-shadow: 0 2px 6px rgba(0,0,0,.03); }
  .rest-head { display: flex; align-items: center; gap: 12px; }
  .rest-logo { width: 46px; height: 46px; border-radius: 14px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--beige-soft), #f1e6d2);
    border: 1px solid var(--beige-border);
    display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .rest-head-main { flex: 1; min-width: 0; }
  .rest-name { font-size: 16px; font-weight: 700; line-height: 1.25; color: #2c2620; }
  .rest-status { display: inline-block; margin-top: 4px; padding: 3px 10px;
    border-radius: 12px; font-size: 11px; font-weight: 700; }
  .rest-status.open { background: #e8f5ec; color: #2e7d43; }
  .rest-status.closed { background: #fbeae4; color: #b04a2e; }
  .rest-meta { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--beige-border);
    font-size: 13px; color: #8e8e93; line-height: 1.5; }
  .rest-hours { color: #a3988a; font-size: 12px; margin-top: 3px; }

  .rest-actions { display: flex; gap: 8px; margin-top: 12px; }
  .rest-actions a { flex: 1; display: block; text-decoration: none; }
  .btn-map { display: block; width: 100%; background: transparent; color: var(--beige-dark);
    border: 2px solid var(--map-border); border-radius: 12px; padding: 11px 8px;
    font-size: 14px; font-weight: 600; text-align: center; text-decoration: none; }
  .btn-map:active { background: var(--map-border); color: #fff; }

  .no-results { text-align: center; color: #8e8e93; padding: 30px 12px; }

  .detail-hero { background: linear-gradient(135deg, var(--beige-soft), #fdf9f2);
    border: 1px solid var(--beige-border); color: #4a3c28; border-radius: 18px;
    margin: 12px 12px 12px; padding: 24px 16px; text-align: center; }
  .detail-hero .emoji { width: 60px; height: 60px; margin: 0 auto 10px; background: #fff;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 28px; border: 1px solid var(--beige-border); }
  .detail-hero .name { font-size: 20px; font-weight: 700; line-height: 1.3; color: #3a2f1f; }
  .detail-status { display: inline-block; margin-top: 10px; padding: 5px 14px;
    border-radius: 20px; font-size: 13px; font-weight: 700; }
  .detail-status.open { background: #e8f5ec; color: #2e7d43; }
  .detail-status.closed { background: #fbeae4; color: #b04a2e; }
  .detail-card { background: #fff; border-radius: 16px; margin: 0 12px 12px;
    padding: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.05); border: 1px solid #f0ebe2; }
  .detail-card .row { padding: 9px 0; border-bottom: 1px solid #f5f0e7; font-size: 15px; }
  .detail-card .row:last-child { border-bottom: 0; }
  .detail-card .row .lbl { color: #a3988a; font-size: 13px; margin-bottom: 2px; }
  .detail-actions { display: flex; gap: 8px; margin-top: 12px; }
  .detail-actions a { flex: 1; display: block; }
  .btn-back { display: block; margin: 0 12px 12px; padding: 11px 16px;
    background: #fff; color: var(--beige-dark); border: 1.5px solid var(--beige);
    border-radius: 12px; font-size: 15px; font-weight: 600; text-align: center;
    text-decoration: none; cursor: pointer; }
  .btn-back:active { background: var(--beige-soft); }

  .blocked-screen { background: #fff; border-radius: 18px; margin: 40px 12px 12px;
    padding: 32px 20px; text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,.07); }
  .blocked-screen .big { font-size: 44px; margin-bottom: 12px; }
  .blocked-screen .title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .blocked-screen .text { color: #8e8e93; font-size: 14px; }

  .news-date { color: #8e8e93; font-size: 12px; margin-top: 4px; }
  .level-urgent b::before { content: "🔴 "; }
  .level-important b::before { content: "🟡 "; }
  .level-normal b::before { content: "🔵 "; }
</style>
</head>
<body>

<div class="section" id="sec-profile">
  <div id="profile-box"></div>
</div>

<div class="section" id="sec-restaurants">
  <div class="rest-tab-header">
    <div class="title">🍜 Рестораны Wokker</div>
    <div class="sub">Адреса, часы работы и маршруты всех точек</div>
    <div id="rest-count" style="display:none"></div>
  </div>
  <input class="q" id="rest-search" placeholder="🔍 Поиск ресторана или адреса…">
  <div id="restaurants-list"></div>
</div>

<div class="section active" id="sec-news">
  <div id="news-list"></div>
</div>

<div class="section" id="sec-standards">
  <div id="standards-list"></div>
</div>

<div class="section" id="sec-faq">
  <div id="faq-list"></div>
  <div class="card">
    <b>Задать свой вопрос</b>
    <input class="q" id="question-input" placeholder="Опиши вопрос — ответ придёт в бот">
    <button class="btn" id="send-question">Отправить</button>
  </div>
</div>

<div class="section" id="sec-detail">
  <div id="detail-box"></div>
  <button class="btn-back" id="detail-back">← Ко всем ресторанам</button>
</div>

<nav class="tabs">
  <button data-sec="sec-profile"><span>👤</span>Профиль</button>
  <button data-sec="sec-restaurants"><span>🏙️</span>Рестораны</button>
  <button data-sec="sec-news" class="active"><span>📰</span>Новости</button>
  <button data-sec="sec-standards"><span>📚</span>Стандарты</button>
  <button data-sec="sec-faq"><span>❓</span>Вопрос/ответ</button>
</nav>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) {
  tg.ready();
  tg.expand();
}

function getInitData() {
  return (tg && tg.initData) ? tg.initData : '';
}

const sectionLoaders = {
  'sec-profile': loadProfile,
  'sec-restaurants': loadRestaurants,
  'sec-news': loadNews,
  'sec-standards': loadStandards,
  'sec-faq': loadFaq,
};

document.querySelectorAll('.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    exitDetailView();
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.sec).classList.add('active');
    window.scrollTo(0, 0);
    const loader = sectionLoaders[btn.dataset.sec];
    if (loader) loader();
  });
});

const esc = s => (s || '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function skeletonHtml() {
  return '<div class="skeleton-card">' +
    '<div class="skeleton-line"></div>' +
    '<div class="skeleton-line"></div>' +
    '<div class="skeleton-line short"></div>' +
    '</div>';
}

/* Сразу показываем заглушки — экран живой с первого кадра */
document.getElementById('news-list').innerHTML = skeletonHtml() + skeletonHtml();
document.getElementById('profile-box').innerHTML = skeletonHtml();
document.getElementById('restaurants-list').innerHTML = skeletonHtml() + skeletonHtml();
document.getElementById('standards-list').innerHTML = skeletonHtml() + skeletonHtml();
document.getElementById('faq-list').innerHTML = skeletonHtml() + skeletonHtml();

function blockedHtml() {
  return '<div class="blocked-screen">' +
    '<div class="big">🚫</div>' +
    '<div class="title">Доступ ограничен</div>' +
    '<div class="text">Администратор ограничил доступ к приложению.<br>Обратитесь к управляющему.</div>' +
    '</div>';
}

function tgUserInfo() {
  try {
    if (!tg || !tg.initDataUnsafe) return null;
    return tg.initDataUnsafe.user || null;
  } catch (e) { return null; }
}

function avatarHtml(initial) {
  return '<div class="avatar">' + esc(initial) + '</div>';
}

function initialFor(name) {
  const n = (name || '').trim();
  if (n) return n.charAt(0).toUpperCase();
  const u = tgUserInfo();
  if (u && u.first_name && u.first_name.trim()) return u.first_name.trim().charAt(0).toUpperCase();
  return '👤';
}

/* Приветствие по времени суток */
function greetingTexts() {
  const h = new Date().getHours();
  if (h >= 5 && h < 12) return { hello: 'Доброе утро', sub: 'Хорошего начала дня и лёгких смен ☀️' };
  if (h >= 12 && h < 18) return { hello: 'Добрый день', sub: 'Рабочая половина дня уже позади 💪' };
  if (h >= 18 && h < 23) return { hello: 'Добрый вечер', sub: 'Загляните в новости перед сменой 🌙' };
  return { hello: 'Доброй ночи', sub: 'Отдыхайте — завтра снова в бой 🌙' };
}

/* Запасной вариант: имя из профиля (первое слово ФИО) */
function firstNameFromProfile(p) {
  if (p && p.first_name && p.first_name.trim()) return p.first_name.trim();
  if (p && p.full_name) {
    const parts = p.full_name.trim().split(/\s+/);
    return parts[0] || '';
  }
  return '';
}

/* Имя для обращения: сначала имя из Telegram, затем из профиля */
function displayNameOf(p) {
  const u = tgUserInfo();
  if (u && u.first_name && u.first_name.trim()) return u.first_name.trim();
  return firstNameFromProfile(p);
}

async function fillAvatar() {
  const el = document.querySelector('#profile-box .avatar');
  if (!el) return;
  const u = tgUserInfo();
  if (u && u.photo_url) {
    el.style.backgroundImage = "url('" + esc(u.photo_url) + "')";
    el.textContent = '';
    return;
  }
  try {
    const resp = await fetch('/api/avatar', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ initData: getInitData() })
    });
    if (resp.ok) {
      const blob = await resp.blob();
      if (blob.size > 0) {
        el.style.backgroundImage = "url('" + URL.createObjectURL(blob) + "')";
        el.textContent = '';
      }
    }
  } catch (e) { /* остаётся буква */ }
}

async function loadProfile() {
  const box = document.getElementById('profile-box');
  const g = greetingTexts();
  try {
    /* Профиль и поздравление грузим параллельно — экономим один сетевой круг */
    const [resp, gr] = await Promise.all([
      fetch('/api/profile', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ initData: getInitData() })
      }),
      fetch('/api/greeting', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ initData: getInitData() })
      }).catch(() => null)
    ]);

    let greet = null;
    if (gr && gr.ok) {
      try { greet = await gr.json(); } catch (e) { greet = null; }
    }
    const greetHtml = (greet && greet.kind && greet.kind !== 'normal')
      ? '<div class="greet-banner ' + greet.kind + '">' +
        '<div class="gb-title">' + esc(greet.title) + '</div>' +
        '<div class="gb-sub">' + esc(greet.sub) + '</div></div>'
      : '';

    const data = await resp.json();
    if (resp.ok && data.registered) {
      const p = data.profile;
      const isOffice = p.restaurant === 'ОФИС';
      const restBadge = isOffice ? 'office' : 'normal';
      const name = displayNameOf(p);

      box.innerHTML =
        '<div class="greeting">' +
        '<div class="g-title">' + esc(g.hello) + (name ? ', ' + esc(name) : '') + ' 👋</div>' +
        '<div class="g-sub">' + esc(g.sub) + '</div>' +
        '</div>' +
        greetHtml +
        '<div class="profile-card">' +
        '<div class="profile-header">' +
        '<div class="avatar-ring">' + avatarHtml(initialFor(p.full_name)) + '</div>' +
        '<div class="p-name">' + esc(p.full_name) + '</div>' +
        '<div class="p-pos">' + esc(p.position) + '</div>' +
        '<span class="badge">✅ Активен</span>' +
        '</div>' +
        '<div class="info-list">' +
        '<div class="info-row"><span class="ico">📍</span><span class="lbl">Ресторан</span>' +
        '<span class="val"><span class="badge-rest ' + restBadge + '">' + esc(p.restaurant) + '</span></span></div>' +
        '<div class="info-row"><span class="ico">📞</span><span class="lbl">Телефон</span>' +
        '<span class="val"><a href="tel:' + esc(p.phone) + '">' + esc(p.phone) + '</a></span></div>' +
        '<div class="info-row"><span class="ico">🎂</span><span class="lbl">Дата рождения</span>' +
        '<span class="val">' + esc(p.birth_date) + '</span></div>' +
        '</div>' +
        '<div class="profile-footer">💡 Изменить данные можно только через администратора. ' +
        '<button id="btn-report-error">Сообщить об ошибке</button></div>' +
        '</div>';

      /* Аватар грузим после отрисовки карточки, не мешая ей */
      setTimeout(fillAvatar, 250);

      document.getElementById('btn-report-error').addEventListener('click', async () => {
        const text = 'Ошибка в данных профиля: прошу проверить и скорректировать.';
        try {
          const r = await fetch('/api/questions', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ initData: getInitData(), question: text })
          });
          if (r.ok) {
            alert('Сообщение отправлено администратору.');
          } else {
            alert('Не удалось отправить сообщение.');
          }
        } catch (e) {
          alert('Ошибка сети');
        }
      });
    } else if (resp.status === 401) {
      box.innerHTML = '<div class="card">⚠️ Ошибка авторизации Telegram. Закрой приложение и открой заново из бота.</div>';
    } else if (resp.status === 403) {
      ALL_RESTAURANTS = null;
      box.innerHTML = blockedHtml();
    } else {
      box.innerHTML = '<div class="card">Ты ещё не зарегистрирован.<br>Напиши /start в боте и пройди регистрацию.</div>';
    }
  } catch (e) {
    box.innerHTML = '<div class="card">Ошибка загрузки профиля: ' + esc(String(e)) + '</div>';
  }
}

/* ===== Рестораны: кэш + мгновенный поиск + сортировка ===== */
let ALL_RESTAURANTS = null;
let REST_FETCH_TS = 0;
const REST_TTL = 5 * 60 * 1000;

function prepareRestaurants(list) {
  return list.map(r => {
    const copy = Object.assign({}, r);
    copy._search = ((r.name || '') + ' ' + (r.address || '')).toLowerCase();
    return copy;
  });
}

async function fetchRestaurants() {
  const now = Date.now();
  if (ALL_RESTAURANTS && (now - REST_FETCH_TS) < REST_TTL) return ALL_RESTAURANTS;

  const resp = await fetch('/api/restaurants', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ initData: getInitData() })
  });
  if (resp.status === 403) { ALL_RESTAURANTS = null; throw Object.assign(new Error('blocked'), { code: 403 }); }
  if (resp.status === 401) { throw Object.assign(new Error('unauthorized'), { code: 401 }); }
  ALL_RESTAURANTS = prepareRestaurants(await resp.json());
  REST_FETCH_TS = now;
  return ALL_RESTAURANTS;
}

function mapUrlFor(r) {
  return r.org
    ? 'https://yandex.ru/maps/org/' + r.org
    : 'https://yandex.ru/maps/?text=' + encodeURIComponent('Воккер ' + r.address);
}

function statusBadge(r, cls) {
  return '<span class="' + cls + ' ' + (r.status === 'open' ? 'open' : 'closed') + '">' +
    esc(r.status_text || '') + '</span>';
}

function renderRestaurants(query) {
  const box = document.getElementById('restaurants-list');
  const countEl = document.getElementById('rest-count');

  if (!ALL_RESTAURANTS) {
    box.innerHTML = '<div class="no-results">Загрузка…</div>';
    return;
  }

  const q = (query || '').trim().toLowerCase();
  const list = q
    ? ALL_RESTAURANTS.filter(r => r._search.indexOf(q) !== -1)
    : ALL_RESTAURANTS;

  list.sort((a, b) => {
    const aOpen = a.status === 'open';
    const bOpen = b.status === 'open';

    if (aOpen && !bOpen) return -1;
    if (!aOpen && bOpen) return 1;

    if (a.sort !== b.sort) return a.sort - b.sort;
    return a.name.localeCompare(b.name);
  });

  const totalCount = list.length;
  const openCount = list.filter(r => r.status === 'open').length;

  if (q) {
    countEl.style.display = 'inline-block';
    countEl.textContent = 'Найдено: ' + totalCount + ' · открыто сейчас: ' + openCount;
  } else {
    countEl.style.display = 'inline-block';
    countEl.textContent = 'Открыто сейчас: ' + openCount + ' · Всего точек: ' + totalCount;
  }

  if (!list.length) {
    countEl.style.display = 'none';
    box.innerHTML = '<div class="no-results">Ничего не нашлось 🔍<br>Попробуйте другое название или улицу</div>';
    return;
  }

  box.innerHTML = list.map(r => {
    return '<div class="rest-card ' + (r.status !== 'open' ? 'rest-card-closed' : '') + '">' +
      '<div class="rest-head">' +
      '<div class="rest-logo">🍜</div>' +
      '<div class="rest-head-main">' +
      '<div class="rest-name">' + esc(r.name) + '</div>' +
      statusBadge(r, 'rest-status') +
      '</div>' +
      '</div>' +
      '<div class="rest-meta">' +
      '<div class="addr">📍 ' + esc(r.address) + '</div>' +
      '<div class="rest-hours">🕒 ' + esc(r.hours).replaceAll('\n', ' · ') + '</div>' +
      '</div>' +
      '<div class="rest-actions">' +
      '<a href="' + mapUrlFor(r) + '" target="_blank"><span class="btn-map">🗺 На Яндекс Картах</span></a>' +
      '</div>' +
      '</div>';
  }).join('');
}

async function loadRestaurants() {
  const box = document.getElementById('restaurants-list');
  try {
    await fetchRestaurants();
    renderRestaurants(document.getElementById('rest-search').value);
  } catch (e) {
    if (e && e.code === 403) { box.innerHTML = blockedHtml(); return; }
    if (e && e.code === 401) { box.innerHTML = '<div class="card">⚠️ Ошибка авторизации. Открой приложение заново из бота.</div>'; return; }
    if (ALL_RESTAURANTS) {
      renderRestaurants(document.getElementById('rest-search').value);
    } else {
      box.innerHTML = '<div class="card">Ошибка загрузки списка ресторанов</div>';
    }
  }
}

document.getElementById('rest-search').addEventListener('input', e => {
  renderRestaurants(e.target.value);
});

/* ===== Карточка одного ресторана (глубокая ссылка ?rest=…) ===== */

function renderDetail(r) {
  document.getElementById('detail-box').innerHTML =
    '<div class="detail-hero">' +
    '<div class="emoji">🍜</div>' +
    '<div class="name">' + esc(r.name) + '</div>' +
    statusBadge(r, 'detail-status') +
    '</div>' +
    '<div class="detail-card">' +
    '<div class="row"><div class="lbl">Адрес</div>📍 ' + esc(r.address) + '</div>' +
    '<div class="row"><div class="lbl">Часы работы</div>🕒 ' + esc(r.hours).replaceAll('\n', '<br>') + '</div>' +
    '<div class="detail-actions">' +
    '<a href="' + mapUrlFor(r) + '" target="_blank"><span class="btn-map">🗺 На Яндекс Картах</span></a>' +
    '</div>' +
    '</div>';
}

async function showDetail(key) {
  const section = document.getElementById('sec-detail');
  const box = document.getElementById('detail-box');
  box.innerHTML = skeletonHtml();
  try {
    const list = await fetchRestaurants();
    const r = list.find(x => x.key === key);
    if (!r) {
      box.innerHTML = '<div class="card">Ресторан не найден 🤷</div>';
    } else {
      renderDetail(r);
    }
    document.querySelector('.tabs').style.display = 'none';
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    section.classList.add('active');
    window.scrollTo(0, 0);
  } catch (e) {
    if (e && e.code === 403) { box.innerHTML = blockedHtml(); section.classList.add('active'); return; }
    box.innerHTML = '<div class="card">Ошибка загрузки карточки ресторана</div>';
    section.classList.add('active');
  }
}

function exitDetailView() {
  document.querySelector('.tabs').style.display = 'flex';
}

document.getElementById('detail-back').addEventListener('click', () => {
  history.replaceState(null, '', location.pathname);
  exitDetailView();
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  document.querySelector('.tabs button[data-sec="sec-restaurants"]').classList.add('active');
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById('sec-restaurants').classList.add('active');
  loadRestaurants();
});

async function loadNews() {
  const box = document.getElementById('news-list');
  try {
    const resp = await fetch('/api/news', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ initData: getInitData() })
    });
    if (resp.status === 403) { box.innerHTML = blockedHtml(); return; }
    if (resp.status === 401) { box.innerHTML = '<div class="card">⚠️ Ошибка авторизации. Открой приложение заново из бота.</div>'; return; }
    const list = await resp.json();
    if (!list.length) {
      box.innerHTML = '<div class="card">Пока новостей нет 📰</div>';
      return;
    }
    box.innerHTML = list.map(n => {
      const lvl = ['urgent', 'important'].includes(n.level) ? n.level : 'normal';
      return '<div class="card level-' + lvl + '">' +
        '<b>' + esc(n.title) + '</b>' +
        '<div>' + esc(n.text) + '</div>' +
        '<div class="news-date">' + esc(n.date) + '</div>' +
        '</div>';
    }).join('');
  } catch (e) {
    box.innerHTML = '<div class="card">Ошибка загрузки новостей</div>';
  }
}

async function loadStandards() {
  const box = document.getElementById('standards-list');
  try {
    const resp = await fetch('/api/standards', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ initData: getInitData() })
    });
    if (resp.status === 403) { box.innerHTML = blockedHtml(); return; }
    if (resp.status === 401) { box.innerHTML = '<div class="card">⚠️ Ошибка авторизации. Открой приложение заново из бота.</div>'; return; }
    const list = await resp.json();
    box.innerHTML = list.map(s =>
      '<div class="card">' +
      '<b>' + esc(s.title) + '</b>' +
      '<div class="muted">' + esc(s.category) + '</div>' +
      '<div style="margin-top:6px">' + esc(s.description) + '</div>' +
      (s.url ? '<a href="' + esc(s.url) + '" target="_blank"><button class="btn">Открыть</button></a>' : '') +
      '</div>'
    ).join('');
  } catch (e) {
    box.innerHTML = '<div class="card">Ошибка загрузки стандартов</div>';
  }
}

async function loadFaq() {
  const box = document.getElementById('faq-list');
  try {
    const resp = await fetch('/api/faq', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ initData: getInitData() })
    });
    if (resp.status === 403) { box.innerHTML = blockedHtml(); return; }
    if (resp.status === 401) { box.innerHTML = '<div class="card">⚠️ Ошибка авторизации. Открой приложение заново из бота.</div>'; return; }
    const list = await resp.json();
    box.innerHTML = list.map(f =>
      '<details>' +
      '<summary>' + esc(f.question) + '</summary>' +
      '<p>' + esc(f.answer) + '</p>' +
      '</details>'
    ).join('');
  } catch (e) {
    box.innerHTML = '<div class="card">Ошибка загрузки вопросов</div>';
  }
}

document.getElementById('send-question').addEventListener('click', async () => {
  const input = document.getElementById('question-input');
  const text = input.value.trim();
  if (!text) return;
  try {
    const resp = await fetch('/api/questions', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ initData: getInitData(), question: text })
    });
    if (resp.ok) {
      input.value = '';
      alert('Вопрос отправлен! Ответ увидишь в боте.');
    } else if (resp.status === 403) {
      alert('Доступ ограничен администратором.');
    } else if (resp.status === 401) {
      alert('Ошибка авторизации. Закрой приложение и открой заново из бота.');
    } else {
      alert('Не удалось отправить вопрос. Попробуй позже.');
    }
  } catch (e) {
    alert('Ошибка сети');
  }
});

async function boot() {
  const restKey = new URLSearchParams(location.search).get('rest');
  if (restKey) {
    /* Глубокая ссылка из бота: карточка ресторана важнее стартовой вкладки */
    loadProfile();
    await showDetail(restKey);
    return;
  }

  /* Все разделы грузим параллельно — каждый появляется сразу, как придёт */
  loadProfile();
  loadRestaurants();
  loadNews();
  loadStandards();
  loadFaq();
}

function startWhenReady() {
  /* initData в Telegram доступен почти сразу — если он уже есть, стартуем мгновенно.
     Если ещё нет, ждём максимум 1,5 с (вместо прежних 5) — и всё равно стартуем,
     чтобы экран не «висел» в ожидании. */
  if (getInitData()) { boot(); return; }
  let waited = 0;
  const timer = setInterval(() => {
    waited += 100;
    if (getInitData() || waited >= 1500) {
      clearInterval(timer);
      boot();
    }
  }, 100);
}

startWhenReady();
</script>
