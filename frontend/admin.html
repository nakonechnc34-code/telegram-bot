<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wokker · Админ</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231A1A2E'/%3E%3Ccircle cx='50' cy='50' r='42' fill='none' stroke='%23D500F9' stroke-width='8'/%3E%3Cpath d='M25 50 A 25 25 0 0 0 75 50' fill='none' stroke='%23D500F9' stroke-width='12' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1A1A2E">
<link rel="apple-touch-icon" href="/static/icon-192.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wokker Admin">
<!-- Подключаем шрифт Inter -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    /* НОВАЯ ПАЛИТРА (Dark & Glass) */
    --bg: #131324; /* Глубокий фон */
    --card-bg: rgba(255, 255, 255, 0.04); /* Стеклянная карточка */
    --text-main: #FFFFFF;
    --text-muted: #9E9EA7;
    
    /* Неоновые акценты */
    --accent: #B538FF; /* Фиолетовый неон */
    --accent-soft: rgba(181, 56, 255, 0.15);
    --green: #00E676; 
    --green-soft: rgba(0, 230, 118, 0.15);
    --amber: #FFB300; 
    --amber-soft: rgba(255, 179, 0, 0.15);
    --blue: #00B0FF; 
    --blue-soft: rgba(0, 176, 255, 0.15);
    --purple: #D500F9; 
    --purple-soft: rgba(213, 0, 249, 0.15);
    
    /* Границы и тени */
    --border: rgba(255, 255, 255, 0.08); 
    --sidebar: rgba(18, 18, 30, 0.7); 
    --sidebar-hover: rgba(255, 255, 255, 0.06);
    --shadow: 0 8px 32px rgba(0, 0, 0, 0.2); 
    --shadow-lg: 0 24px 64px rgba(0, 0, 0, 0.6);
    
    --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  
  body {
    font-family: var(--font);
    background: var(--bg); 
    background-image: radial-gradient(circle at top right, rgba(181, 56, 255, 0.1) 0%, transparent 40%),
                      radial-gradient(circle at bottom left, rgba(0, 176, 255, 0.05) 0%, transparent 40%);
    color: var(--text-main); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; overflow-x: hidden; min-height: 100vh;
  }
  button, input, select, textarea { font-family: inherit; font-size: inherit; }
  button { cursor: pointer; border: none; background: none; color: inherit; }

  /* ================== LOGIN ================== */
  #login-screen {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(10, 10, 15, 0.8); backdrop-filter: blur(20px); z-index: 2000; padding: 20px;
  }
  .login-card { 
    background: var(--card-bg); border: 1px solid var(--border); 
    backdrop-filter: blur(30px); border-radius: 24px; padding: 40px; 
    width: 100%; max-width: 420px; box-shadow: var(--shadow-lg); 
  }
  .login-card h1 { font-size: 26px; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.5px; }
  .login-card .sub { color: var(--text-muted); margin-bottom: 24px; font-size: 14px; }
  .login-logo { width: 60px; height: 60px; background: var(--accent-soft); border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 32px; margin-bottom: 20px; color: var(--accent); }
  .login-input { 
    width: 100%; border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; 
    font-size: 15px; background: rgba(0,0,0,0.2); outline: none; margin-bottom: 12px; 
    font-weight: 600; color: #fff; transition: all 0.2s;
  }
  .login-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .login-btn { 
    width: 100%; background: var(--accent); color: #fff; border-radius: 12px; padding: 14px; 
    font-size: 15px; font-weight: 700; margin-top: 8px; transition: all 0.2s; 
    box-shadow: 0 4px 16px var(--accent-soft);
  }
  .login-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .login-error { color: #FF5252; font-size: 13px; min-height: 18px; margin-top: 10px; font-weight: 600; }

  /* ================== LAYOUT ================== */
  #app { display: none; min-height: 100vh; }
  .layout { display: flex; min-height: 100vh; }
  
  /* ================== SIDEBAR ================== */
  .sidebar { 
    width: 250px; background: var(--sidebar); backdrop-filter: blur(20px);
    border-right: 1px solid var(--border); color: #fff; padding: 20px 16px; 
    display: flex; flex-direction: column; flex-shrink: 0; position: sticky; top: 0; height: 100vh; z-index: 100;
  }
  .sidebar-logo { display: flex; align-items: center; gap: 12px; padding: 10px 12px 30px; font-weight: 800; font-size: 18px; letter-spacing: -0.3px; }
  .sidebar-logo .badge { background: var(--accent-soft); color: var(--accent); font-size: 10px; padding: 4px 8px; border-radius: 6px; font-weight: 800; text-transform: uppercase; }
  .sidebar nav { display: flex; flex-direction: column; gap: 4px; flex: 1; overflow-y: auto; scrollbar-width: none; }
  .nav-item { 
    background: none; border: 0; color: var(--text-muted); text-align: left; padding: 12px 16px; 
    border-radius: 12px; font-size: 14px; font-weight: 500; display: flex; align-items: center; 
    gap: 12px; white-space: nowrap; transition: all 0.2s; 
  }
  .nav-item:hover { background: var(--sidebar-hover); color: #fff; }
  .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; border-left: 3px solid var(--accent); }
  .nav-item .ico { width: 20px; display: inline-block; text-align: center; font-size: 16px; }
  .nav-item .count { margin-left: auto; background: var(--accent); color: #fff; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .sidebar-footer { padding: 16px; border-top: 1px solid var(--border); margin-top: 12px; font-size: 12px; }
  .sidebar-footer .who { color: #fff; font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .sidebar-footer .login-line { font-family: monospace; color: var(--text-muted); margin-bottom: 8px; }
  .sidebar-footer .badge-role { display: inline-block; font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 6px; margin-bottom: 12px; text-transform: uppercase; }
  .sidebar-footer .badge-role.super { background: var(--purple-soft); color: var(--purple); }
  .sidebar-footer .badge-role.hr { background: var(--blue-soft); color: var(--blue); }
  .sidebar-footer .badge-role.regular { background: rgba(255,255,255,0.1); color: #fff; }
  .sidebar-footer button { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff; padding: 10px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; width: 100%; margin-top: 8px; transition: all 0.2s; }
  .sidebar-footer button:hover { background: rgba(255,255,255,0.1); }
  .sidebar-footer button.danger:hover { background: rgba(255, 82, 82, 0.2); color: #FF5252; border-color: rgba(255, 82, 82, 0.3); }

  .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 150; display: none; }
  .sidebar-overlay.show { display: block; }

  /* ================== MAIN CONTENT ================== */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { 
    padding: 20px 32px; background: rgba(19, 19, 36, 0.8); backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border); display: flex; align-items: center; 
    justify-content: space-between; gap: 16px; position: sticky; top: 0; z-index: 50; 
  }
  .topbar-left { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .topbar h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
  .topbar .actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .content { padding: 32px; flex: 1; }

  .hamburger { display: none; background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; width: 40px; height: 40px; font-size: 20px; align-items: center; justify-content: center; flex-shrink: 0; color: #fff; }

  /* ================== UI ELEMENTS ================== */
  .btn { 
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 18px; font-size: 13px; 
    font-weight: 600; display: inline-flex; align-items: center; gap: 8px; 
    background: rgba(255,255,255,0.05); color: var(--text-main); transition: all 0.2s; 
  }
  .btn:hover { background: rgba(255,255,255,0.1); }
  .btn.primary { background: var(--accent); color: #fff; border-color: transparent; box-shadow: 0 4px 12px var(--accent-soft); }
  .btn.primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .btn.ghost { background: transparent; border: 1px solid var(--border); }
  .btn.ghost:hover { background: rgba(255,255,255,0.05); }
  .btn.small { padding: 8px 14px; font-size: 12px; border-radius: 8px; }
  .btn.danger { background: var(--accent-soft); color: #FF5252; border-color: transparent; }
  .btn.danger:hover { background: rgba(255, 82, 82, 0.25); }
  .btn.green { background: var(--green-soft); color: var(--green); border-color: transparent; }
  .btn.green:hover { background: rgba(0, 230, 118, 0.25); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

  /* Glass Cards */
  .table-card, .chart-card, .stat-card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 16px; box-shadow: var(--shadow); backdrop-filter: blur(10px);
  }
  
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 16px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 16px 20px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { background: rgba(255,255,255,0.02); font-weight: 700; font-size: 11px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.03); }
  .row-clickable { cursor: pointer; }
  tr.fired-row td { opacity: 0.4; }

  .tag { display: inline-block; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; white-space: nowrap; border: 1px solid transparent; }
  .tag.green { background: var(--green-soft); color: var(--green); border-color: rgba(0,230,118,0.2); }
  .tag.red { background: rgba(255,82,82,0.15); color: #FF5252; border-color: rgba(255,82,82,0.2); }
  .tag.gray { background: rgba(255,255,255,0.05); color: var(--text-muted); }
  .tag.amber { background: var(--amber-soft); color: var(--amber); border-color: rgba(255,179,0,0.2); }
  .tag.blue { background: var(--blue-soft); color: var(--blue); border-color: rgba(0,176,255,0.2); }
  .tag.purple { background: var(--purple-soft); color: var(--purple); border-color: rgba(213,0,249,0.2); }
  .login-cell { font-family: monospace; font-weight: 700; font-size: 12px; background: rgba(255,255,255,0.08); padding: 4px 8px; border-radius: 6px; color: #fff; }

  .actions-cell { display: flex; gap: 8px; justify-content: flex-end; }
  .icon-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 8px; width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; transition: all 0.2s; color: #fff;}
  .icon-btn:hover { background: rgba(255,255,255,0.1); transform: translateY(-1px); }
  .icon-btn.danger { background: rgba(255,82,82,0.1); color: #FF5252; border-color: transparent; }
  .icon-btn.danger:hover { background: rgba(255,82,82,0.2); }
  .icon-btn.fire { background: rgba(255,82,82,0.1); color: #FF5252; border-color: transparent; }
  .icon-btn.restore { background: var(--green-soft); color: var(--green); border-color: transparent; }

  .search-bar { display: flex; gap: 12px; margin-bottom: 24px; align-items: center; }
  .search-bar input { 
    flex: 1; max-width: 400px; border: 1px solid var(--border); border-radius: 12px; 
    padding: 12px 18px; font-size: 14px; outline: none; background: var(--card-bg); 
    color: #fff; transition: all 0.2s; backdrop-filter: blur(10px);
  }
  .search-bar input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-bottom: 32px; }
  .stat-card { padding: 24px; position: relative; overflow: hidden; }
  .stat-card::before { content: ''; position: absolute; top: -20px; right: -20px; width: 80px; height: 80px; background: var(--accent-soft); border-radius: 50%; filter: blur(20px); z-index: 0; }
  .stat-card > * { position: relative; z-index: 1; }
  .stat-card .label { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-card .value { font-size: 32px; font-weight: 800; letter-spacing: -1px; color: #fff; }
  .stat-card .hint { font-size: 12px; color: var(--text-muted); margin-top: 8px; }
  .stat-card.accent .value { color: var(--accent); }
  .stat-card.green .value { color: var(--green); }
  .stat-card.amber .value { color: var(--amber); }

  .chart-card { padding: 24px; margin-bottom: 24px; }
  .chart-card h3 { font-size: 14px; font-weight: 700; margin-bottom: 20px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }

  .empty { text-align: center; padding: 60px 20px; color: var(--text-muted); background: var(--card-bg); border-radius: 16px; border: 1px dashed var(--border); }
  .empty .emoji { font-size: 48px; margin-bottom: 16px; display: block; opacity: 0.5; }

  /* ================== MODALS ================== */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; backdrop-filter: blur(8px); }
  .modal-overlay.show { display: flex; }
  .modal { 
    background: rgba(25, 25, 40, 0.95); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px; width: 100%; max-width: 640px; max-height: 92vh; 
    overflow-y: auto; box-shadow: var(--shadow-lg); backdrop-filter: blur(30px);
  }
  .modal.wide { max-width: 820px; }
  .modal-header { padding: 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: rgba(25, 25, 40, 0.95); z-index: 1; backdrop-filter: blur(10px); }
  .modal-header h3 { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
  .modal-close { background: rgba(255,255,255,0.05); border: 1px solid var(--border); width: 36px; height: 36px; border-radius: 10px; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; color: var(--text-muted); }
  .modal-close:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .modal-body { padding: 24px; }
  .modal-footer { padding: 20px 24px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; gap: 12px; position: sticky; bottom: 0; background: rgba(25, 25, 40, 0.95); flex-wrap: wrap; backdrop-filter: blur(10px); }
  .modal-footer .right-side { display: flex; gap: 12px; }
  
  /* ================== FORMS ================== */
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
  .form-input, .form-select, .form-textarea { 
    width: 100%; border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; 
    font-size: 14px; outline: none; background: rgba(0,0,0,0.2); color: #fff; transition: all 0.2s;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .form-input[readonly] { background: rgba(255,255,255,0.02); color: var(--text-muted); cursor: not-allowed; border-color: transparent; font-family: monospace; font-weight: 700; }
  .form-textarea { resize: vertical; min-height: 100px; font-family: inherit; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-hint { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
  .form-hint.error { color: #FF5252; font-weight: 600; }
  .checkbox-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; }
  .checkbox-row input { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; }
  .checkbox-row label { font-size: 14px; font-weight: 500; cursor: pointer; text-transform: none; letter-spacing: 0; color: var(--text-main); margin: 0; }

  .perm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .perm-item { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: rgba(255,255,255,0.03); border-radius: 10px; font-size: 13px; border: 1px solid var(--border); cursor: pointer; transition: all 0.2s; }
  .perm-item:hover { background: rgba(255,255,255,0.06); }
  .perm-item.checked { background: var(--green-soft); border-color: rgba(0,230,118,0.3); }
  .perm-item input { width: 16px; height: 16px; accent-color: var(--green); flex-shrink: 0; pointer-events: none; }
  .perm-item .perm-icon { font-size: 16px; }
  .perm-item .perm-label { flex: 1; font-weight: 500; color: var(--text-main); }

  .login-preview { background: rgba(0, 230, 118, 0.1); border: 1px solid rgba(0, 230, 118, 0.2); border-radius: 12px; padding: 16px; margin-bottom: 20px; display: flex; align-items: center; gap: 16px; }
  .login-preview .lp-icon { font-size: 24px; }
  .login-preview .lp-label { font-size: 11px; font-weight: 700; color: var(--green); text-transform: uppercase; letter-spacing: 0.5px; }
  .login-preview .lp-value { font-family: monospace; font-size: 20px; font-weight: 800; color: var(--green); letter-spacing: 1px; }
  .login-preview .lp-hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

  .pending-card { background: rgba(255, 179, 0, 0.1); border-radius: 16px; padding: 20px; margin-bottom: 16px; border: 1px solid rgba(255, 179, 0, 0.2); }
  .pending-card .pc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 12px; flex-wrap: wrap; }
  .pending-card .pc-author { font-size: 12px; color: var(--amber); font-weight: 700; }
  .pending-card .pc-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; color: #fff; }
  .pending-card .pc-body { font-size: 14px; color: var(--text-muted); margin-bottom: 16px; line-height: 1.5; }
  .pending-card .pc-actions { display: flex; gap: 12px; flex-wrap: wrap; }

  .subtabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid var(--border); overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .subtab { background: none; border: 0; padding: 12px 20px; font-size: 14px; font-weight: 600; color: var(--text-muted); border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
  .subtab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .subtab:hover { color: #fff; }

  .medbook-section { margin-bottom: 32px; }
  .medbook-section h4 { font-size: 13px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .medbook-row { display: grid; grid-template-columns: 1fr 140px 90px; gap: 16px; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
  .medbook-row:last-child { border-bottom: none; }
  .medbook-row .name { font-weight: 600; color: #fff; }
  .medbook-row input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-family: monospace; text-align: center; outline: none; font-weight: 600; background: rgba(0,0,0,0.2); color: #fff; }
  .medbook-row input:focus { border-color: var(--accent); }
  .medbook-row input.err { border-color: #FF5252; background: rgba(255,82,82,0.1); }
  .medbook-row .status { font-size: 11px; font-weight: 700; text-align: center; }
  .medbook-row .status.ok { color: var(--green); }
  .medbook-row .status.expiring { color: var(--amber); }
  .medbook-row .status.expired, .medbook-row .status.missing { color: #FF5252; }

  .ref-row { display: grid; grid-template-columns: 1fr 100px 80px 60px; gap: 12px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .ref-row:last-child { border-bottom: none; }
  .ref-row .ref-name { font-weight: 600; color: #fff; }
  .ref-row .ref-badge { font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 6px; text-align: center; }
  .ref-row .ref-badge.req { background: rgba(255,82,82,0.15); color: #FF5252; }
  .ref-row .ref-badge.opt { background: rgba(255,255,255,0.05); color: var(--text-muted); }
  .ref-row .ref-months { font-size: 12px; color: var(--text-muted); text-align: center; }

  .medbook-status-banner { padding: 16px 20px; border-radius: 12px; margin-bottom: 24px; display: flex; align-items: center; gap: 12px; font-size: 14px; line-height: 1.5; font-weight: 500; }
  .medbook-status-banner.ok { background: var(--green-soft); color: var(--green); border: 1px solid rgba(0,230,118,0.2); }
  .medbook-status-banner.expiring { background: var(--amber-soft); color: var(--amber); border: 1px solid rgba(255,179,0,0.2); }
  .medbook-status-banner.invalid { background: rgba(255,82,82,0.15); color: #FF5252; border: 1px solid rgba(255,82,82,0.2); }

  /* ================== TOASTS ================== */
  .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 3000; display: flex; flex-direction: column; gap: 12px; }
  .toast { background: rgba(30, 30, 50, 0.9); backdrop-filter: blur(10px); border: 1px solid var(--border); color: #fff; padding: 16px 24px; border-radius: 12px; font-size: 14px; font-weight: 600; max-width: 380px; box-shadow: var(--shadow-lg); animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
  .toast.error { border-color: rgba(255,82,82,0.5); background: rgba(255,82,82,0.9); }
  .toast.success { border-color: rgba(0,230,118,0.5); background: rgba(0,230,118,0.9); color: #000; }
  @keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  .loading { text-align: center; padding: 60px; color: var(--accent); font-weight: 600; letter-spacing: 1px; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

  /* ================== MEDIA QUERIES ================== */
  @media (max-width: 900px) {
    .layout { display: block; }
    .sidebar { position: fixed; top: 0; left: 0; bottom: 0; height: 100vh; height: 100dvh; width: 280px; max-width: 85vw; transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 200; padding-top: max(20px, env(safe-area-inset-top)); }
    .sidebar.open { transform: translateX(0); }
    .hamburger { display: inline-flex; }
    .main { width: 100%; }
    .topbar { padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); }
    .topbar h2 { font-size: 18px; }
    .topbar .actions { gap: 8px; }
    .content { padding: 16px; }

    .modal-overlay { padding: 12px; }
    .modal { max-width: 100%; border-radius: 20px; }
    .modal-body { padding: 20px; }
    .modal-header { padding: 16px 20px; }
    .modal-footer { padding: 16px 20px; }

    .form-row { grid-template-columns: 1fr; gap: 0; }
    .perm-grid { grid-template-columns: 1fr; }

    .form-input, .form-select, .form-textarea, .login-input, .q, .search-bar input, .medbook-row input { font-size: 16px; min-height: 48px; }

    th, td { padding: 12px 14px; font-size: 13px; }
    th { font-size: 11px; }

    .stats-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat-card { padding: 16px; border-radius: 14px; }
    .stat-card .label { font-size: 11px; }
    .stat-card .value { font-size: 24px; }
    .stat-card .hint { font-size: 11px; }

    .search-bar { flex-wrap: wrap; margin-bottom: 16px; }
    .search-bar input { max-width: 100%; }

    .icon-btn { width: 40px; height: 40px; font-size: 16px; }
    .btn.small { padding: 10px 16px; font-size: 13px; min-height: 40px; }

    .medbook-row { grid-template-columns: 1fr 130px 80px; gap: 8px; font-size: 13px; }
    .medbook-row input { padding: 10px 8px; font-size: 15px; }
    .ref-row { grid-template-columns: 1fr 80px 70px 70px; gap: 8px; font-size: 13px; }
    
    .toast-container { bottom: 16px; right: 16px; left: 16px; align-items: stretch; }
    .toast { max-width: 100%; text-align: center; }

    .login-card { padding: 32px 24px; border-radius: 20px; }
  }

  @media (max-width: 480px) {
    .topbar h2 { font-size: 16px; }
    .btn { padding: 10px 14px; font-size: 13px; }
    .btn.small { padding: 8px 12px; font-size: 12px; }
    .stats-grid { grid-template-columns: 1fr; }
    .content { padding: 12px; }
    .modal-overlay { padding: 0; align-items: flex-end; }
    .modal { border-radius: 24px 24px 0 0; max-height: 90vh; max-height: 90dvh; }
    .pending-card .pc-actions .btn { flex: 1; }
    .medbook-row { grid-template-columns: 1fr 110px 70px; }
    .ref-row { grid-template-columns: 1fr 70px 60px 60px; }
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">🛠</div>
    <h1>Wokker Admin</h1>
    <div class="sub">Вход в панель управления</div>
    <input class="login-input" id="login-login" type="text" placeholder="Логин" maxlength="5" style="text-transform: lowercase;" autocomplete="username">
    <input class="login-input" id="login-password" type="password" placeholder="Пароль" autocomplete="current-password">
    <button class="login-btn" id="login-btn">Войти</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div id="app">
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">🍜 Wokker <span class="badge">Admin</span></div>
      <nav id="nav">
        <button class="nav-item" data-sec="dashboard"><span class="ico">📊</span> Дашборд</button>
        <button class="nav-item" data-sec="users"><span class="ico">👥</span> Сотрудники</button>
        <button class="nav-item" data-sec="medbooks"><span class="ico">🩺</span> Медкнижки</button>
        <button class="nav-item" data-sec="restaurants"><span class="ico">🏪</span> Рестораны</button>
        <button class="nav-item" data-sec="news"><span class="ico">📰</span> Новости <span class="count" id="news-pending-count" style="display:none;">0</span></button>
        <button class="nav-item" data-sec="standards"><span class="ico">📚</span> Стандарты</button>
        <button class="nav-item" data-sec="faq"><span class="ico">❓</span> FAQ</button>
        <button class="nav-item" data-sec="positions"><span class="ico">💼</span> Должности</button>
        <button class="nav-item" data-sec="questions"><span class="ico">💬</span> Вопросы <span class="count" id="q-count" style="display:none;">0</span></button>
        <button class="nav-item" data-sec="admins" id="nav-admins" style="display:none;"><span class="ico">👑</span> Администраторы</button>
        <button class="nav-item" data-sec="reports"><span class="ico">📈</span> Отчёты</button>
        <button class="nav-item" data-sec="audit"><span class="ico">📜</span> История</button>
      </nav>
      <div class="sidebar-footer">
        <div class="who" id="admin-name">—</div>
        <div class="login-line" id="admin-login">—</div>
        <div class="badge-role regular" id="admin-role">—</div>
        <button id="change-password-btn">🔐 Сменить пароль</button>
        <button id="logout-btn" class="danger">🚪 Выйти</button>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="main">
      <div class="topbar">
        <div class="topbar-left">
          <button class="hamburger" id="hamburger" aria-label="Меню">☰</button>
          <h2 id="page-title">Дашборд</h2>
        </div>
        <div class="actions" id="page-actions"></div>
      </div>
      <div class="content" id="page-content"></div>
    </div>
  </div>
</div>

<div class="toast-container" id="toasts"></div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-box">
    <div class="modal-header">
      <h3 id="modal-title">—</h3>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<script>
/* ================== CONSTANTS ================== */
const TOKEN_KEY = 'wokker_admin_token';
const LOGIN_RE = /^[a-z]{3}\d{2}$/;

const PERMISSIONS_LIST = [
  { key: 'users_create', label: 'Добавлять сотрудников', icon: '➕' },
  { key: 'users_edit', label: 'Редактировать сотрудников', icon: '✏️' },
  { key: 'users_fire', label: 'Увольнять сотрудников', icon: '🚪' },
  { key: 'citizenships_edit', label: 'Управлять гражданствами', icon: '🌍' },
  { key: 'medbook_edit', label: 'Заполнять медкнижки', icon: '📝' },
  { key: 'medbook_doctors_manage', label: 'Врачи: добавление и сроки', icon: '👨‍⚕️' },
  { key: 'medbook_tests_manage', label: 'Анализы: добавление и сроки', icon: '🧪' },
  { key: 'medbook_vaccines_manage', label: 'Прививки: добавление и сроки', icon: '💉' },
  { key: 'restaurant_tu', label: 'Менять ТУ у ресторанов', icon: '👔' },
  { key: 'restaurant_create', label: 'Добавлять рестораны', icon: '➕' },
  { key: 'restaurant_edit', label: 'Редактировать рестораны', icon: '🏪' },
  { key: 'standards_edit', label: 'Менять стандарты', icon: '📚' },
  { key: 'checklist_create', label: 'Создавать чек-листы', icon: '📋' },
  { key: 'checklist_edit', label: 'Редактировать чек-листы', icon: '✏️' },
  { key: 'news_write', label: 'Писать новости', icon: '📝' },
  { key: 'news_edit', label: 'Редактировать новости', icon: '✏️' },
  { key: 'news_suggest', label: 'Предлагать новости', icon: '💭' },
  { key: 'faq_edit', label: 'Редактировать FAQ', icon: '❓' },
  { key: 'positions_edit', label: 'Управлять должностями', icon: '💼' },
  { key: 'questions_reply', label: 'Отвечать на вопросы', icon: '💬' },
];

let ME = null;

/* ================== UTILS ================== */
const $ = id => document.getElementById(id);
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }
function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
function clearToken() { localStorage.removeItem(TOKEN_KEY); }

function toast(text, type) {
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = text;
  $('toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; }, 2600);
  setTimeout(() => el.remove(), 3000);
}

function fmtDate(iso, withTime) {
  if (!iso) return '—';
  try {
    const d = new Date(iso);
    const pad = n => String(n).padStart(2, '0');
    const date = `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`;
    if (!withTime) return date;
    return `${date} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  } catch (e) { return iso; }
}

async function api(path, body) {
  const payload = { webToken: getToken() };
  if (body && typeof body === 'object') Object.assign(payload, body);
  const res = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  if (res.status === 401) { clearToken(); showLogin(); throw new Error('unauthorized'); }
  if (res.status === 403) {
    let j = {};
    try { j = await res.json(); } catch (e) {}
    if (j.error === 'fired') { clearToken(); showLogin(); throw new Error('fired'); }
    throw new Error(j.error || 'forbidden');
  }
  if (!res.ok) {
    let msg = 'error';
    try { 
        const j = await res.json(); 
        msg = j.detail || j.error || msg; 
    } catch (e) {}
    throw new Error(msg);
  }
  return res.json();
}

/* ================== MOBILE SIDEBAR ================== */
const sidebar = document.getElementById('sidebar');
const sidebarOverlay = document.getElementById('sidebar-overlay');
const hamburger = document.getElementById('hamburger');
function openSidebar() { sidebar.classList.add('open'); sidebarOverlay.classList.add('show'); document.body.style.overflow = 'hidden'; }
function closeSidebar() { sidebar.classList.remove('open'); sidebarOverlay.classList.remove('show'); document.body.style.overflow = ''; }
if (hamburger) hamburger.addEventListener('click', openSidebar);
if (sidebarOverlay) sidebarOverlay.addEventListener('click', closeSidebar);

/* ================== PERMISSIONS ================== */
function isSuperAdmin() { return !!(ME && ME.is_super_admin); }
function isHR() { return !!(ME && ME.is_hr); }
function canPublishNews() { return isSuperAdmin() || isHR(); }
function hasPerm(perm) {
  if (!ME) return false;
  if (ME.is_super_admin) return true;
  if (ME.is_hr) return true;
  return !!(ME.permissions && ME.permissions[perm]);
}

/* ================== LOGIN ================== */
function showLogin() {
  $('app').style.display = 'none';
  $('login-screen').style.display = 'flex';
  $('login-error').textContent = '';
  $('login-login').value = '';
  $('login-password').value = '';
}
function showApp() { $('login-screen').style.display = 'none'; $('app').style.display = 'block'; }

$('login-login').addEventListener('input', e => {
  e.target.value = e.target.value.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 5);
});

async function doLogin() {
  const login = $('login-login').value.trim().toLowerCase();
  const password = $('login-password').value;
  const errEl = $('login-error');
  errEl.textContent = '';
  if (!LOGIN_RE.test(login)) { errEl.textContent = 'Логин: 3 латинские буквы + 2 цифры'; return; }
  if (!password) { errEl.textContent = 'Введите пароль'; return; }
  const btn = $('login-btn');
  btn.disabled = true; btn.textContent = 'Проверяем…';
  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ login, password }),
    });
    if (res.status === 401) { errEl.textContent = '❌ Неверный логин или пароль'; return; }
    if (res.status === 403) { errEl.textContent = '❌ Аккаунт уволен или нет прав администратора'; return; }
    if (!res.ok) { errEl.textContent = 'Ошибка сервера'; return; }
    const data = await res.json();
    if (!data.token) { errEl.textContent = 'Ошибка'; return; }
    setToken(data.token);
    await checkAdminAndLoad();
  } catch (e) {
    errEl.textContent = 'Сеть недоступна';
  } finally {
    btn.disabled = false; btn.textContent = 'Войти';
  }
}

$('login-btn').addEventListener('click', doLogin);
$('login-password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
$('login-login').addEventListener('keydown', e => { if (e.key === 'Enter') $('login-password').focus(); });

async function checkAdminAndLoad() {
  try {
    const res = await api('/api/admin/me', {});
    ME = res.profile;
    $('admin-name').textContent = ME.full_name;
    $('admin-login').textContent = '@' + ME.login;
    const roleEl = $('admin-role');
    if (ME.is_super_admin) { roleEl.textContent = '👑 Супер-админ'; roleEl.className = 'badge-role super'; }
    else if (ME.is_hr) { roleEl.textContent = '💼 HR'; roleEl.className = 'badge-role hr'; }
    else { roleEl.textContent = '🛡 Админ'; roleEl.className = 'badge-role regular'; }
    $('nav-admins').style.display = ME.is_super_admin ? 'flex' : 'none';
    showApp();
    navigate('dashboard');
    refreshCounters();
  } catch (e) {
    showLogin();
    $('login-error').textContent = 'Ошибка: ' + e.message;
  }
}

$('logout-btn').addEventListener('click', async () => {
  if (!confirm('Выйти?')) return;
  try { await api('/api/auth/logout', {}); } catch (e) {}
  clearToken(); ME = null; closeSidebar(); showLogin();
});
$('change-password-btn').addEventListener('click', () => { closeSidebar(); openChangePassword(); });

/* ================== CHANGE PASSWORD ================== */
function openChangePassword() {
  openModal('🔐 Сменить пароль', `
    <div class="form-group"><label>Текущий пароль</label><input class="form-input" id="cp-old" type="password"></div>
    <div class="form-group"><label>Новый пароль</label><input class="form-input" id="cp-new" type="password"><div class="form-hint">Минимум 8 символов</div></div>
    <div class="form-group"><label>Повторите</label><input class="form-input" id="cp-new2" type="password"></div>
    <div class="form-hint error" id="cp-error"></div>
  `, `<button class="btn ghost" onclick="closeModal()">Отмена</button><button class="btn primary" id="cp-save">Сохранить</button>`);
  $('cp-save').addEventListener('click', async () => {
    const errEl = $('cp-error');
    errEl.textContent = '';
    if (!$('cp-old').value) { errEl.textContent = 'Введите текущий пароль'; return; }
    if (!$('cp-new').value || $('cp-new').value.length < 8) { errEl.textContent = 'Новый минимум 8 символов'; return; }
    if ($('cp-new').value !== $('cp-new2').value) { errEl.textContent = 'Пароли не совпадают'; return; }
    try {
      await api('/api/admin/change-password', { old_password: $('cp-old').value, new_password: $('cp-new').value });
      toast('Пароль изменён', 'success'); closeModal();
    } catch (e) {
      if (e.message === 'wrong_password') errEl.textContent = 'Текущий пароль неверный';
      else if (e.message === 'password_too_short') errEl.textContent = 'Минимум 8 символов';
      else errEl.textContent = 'Ошибка: ' + e.message;
    }
  });
}

/* ================== MODAL ================== */
function openModal(title, bodyHtml, footerHtml, opts) {
  opts = opts || {};
  $('modal-title').textContent = title;
  $('modal-body').innerHTML = bodyHtml;
  $('modal-footer').innerHTML = footerHtml || '';
  $('modal-box').className = 'modal' + (opts.wide ? ' wide' : '');
  $('modal-overlay').classList.add('show');
}
function closeModal() { $('modal-overlay').classList.remove('show'); }
$('modal-close').addEventListener('click', closeModal);
$('modal-overlay').addEventListener('click', e => { if (e.target === $('modal-overlay')) closeModal(); });

/* ================== NAV ================== */
const SECTION_TITLES = {
  dashboard: 'Дашборд', users: 'Сотрудники', medbooks: 'Медкнижки',
  restaurants: 'Рестораны', news: 'Новости', standards: 'Стандарты', faq: 'FAQ',
  positions: 'Должности', questions: 'Вопросы', admins: 'Администраторы',
  reports: 'Отчёты', audit: 'История',
};
const SECTION_LOADERS = {
  dashboard: loadDashboard, users: loadUsers, medbooks: loadMedbooks,
  restaurants: loadRestaurants, news: loadNews, standards: loadStandards,
  faq: loadFaq, positions: loadPositions, questions: loadQuestions,
  admins: loadAdmins, reports: loadReports, audit: loadAudit,
};
document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => { closeSidebar(); navigate(btn.dataset.sec); });
});

function navigate(sec) {
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.sec === sec));
  $('page-title').textContent = SECTION_TITLES[sec];
  $('page-actions').innerHTML = '';
  $('page-content').innerHTML = '<div class="loading">Загрузка…</div>';
  const loader = SECTION_LOADERS[sec];
  if (!loader) return;
  Promise.resolve()
    .then(() => loader())
    .catch(e => {
      console.error('load:', e);
      if (e.message !== 'unauthorized' && e.message !== 'fired') {
        $('page-content').innerHTML = '<div class="empty"><span class="emoji">⚠️</span>Ошибка: ' + esc(e.message) + '</div>';
      }
    });
}

async function refreshCounters() {
  try {
    const q = await api('/api/admin/questions', {});
    const open = (q.questions || []).filter(x => !x.replied).length;
    const qEl = $('q-count');
    if (open > 0) { qEl.textContent = open; qEl.style.display = 'inline-block'; }
    else qEl.style.display = 'none';
  } catch (e) {}
  try {
    const n = await api('/api/admin/news', {});
    const pending = (n.news || []).filter(x => x.status === 'pending').length;
    const nEl = $('news-pending-count');
    if (pending > 0 && canPublishNews()) { nEl.textContent = pending; nEl.style.display = 'inline-block'; }
    else nEl.style.display = 'none';
  } catch (e) {}
}

/* ================== DASHBOARD ================== */
async function loadDashboard() {
  const { stats } = await api('/api/admin/dashboard', {});
  const attention = [];
  if (stats.questions_open > 0) attention.push(`❓ ${stats.questions_open} вопросов без ответа`);
  if (canPublishNews() && stats.news_pending > 0) attention.push(`💭 ${stats.news_pending} новостей на модерации`);

  $('page-content').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card accent"><div class="label">Сегодня</div><div class="value">+${stats.new_today}</div><div class="hint">новых</div></div>
      <div class="stat-card green"><div class="label">Активных</div><div class="value">${stats.active}</div><div class="hint">из ${stats.total}</div></div>
      <div class="stat-card"><div class="label">За 7 дней</div><div class="value">${stats.new7}</div></div>
      <div class="stat-card amber"><div class="label">Уволено</div><div class="value">${stats.fired}</div></div>
    </div>
    ${attention.length ? `
      <div class="chart-card"><h3>Требует внимания</h3>
        ${attention.map(a => `<div style="padding:16px;background:var(--amber-soft);border:1px solid rgba(255,179,0,0.2);border-radius:12px;color:var(--amber);font-weight:600;margin-bottom:12px;">${a}</div>`).join('')}
      </div>` : ''}
    <div id="medbook-alerts-box"></div>`;

  try {
    const alerts = await api('/api/admin/medbook-alerts', {});
    const box = $('medbook-alerts-box');
    if (!box) return;
    if (alerts.expired_count === 0 && alerts.expiring_count === 0) {
      box.innerHTML = `<div class="chart-card" style="margin-top:24px;">
        <h3>🩺 Медкнижки</h3>
        <div style="color:var(--green); font-weight:600;">✅ Все медкнижки в порядке</div>
      </div>`;
      return;
    }
    let html = `<div class="chart-card" style="margin-top:24px;">
      <h3>🩺 Медкнижки требуют внимания</h3>`;
    if (alerts.expired_count > 0) {
      html += `<div style="margin-bottom:24px;">
        <div style="font-size:13px;font-weight:700;color:#FF5252;margin-bottom:12px;text-transform:uppercase;letter-spacing:0.5px;">🔴 Просрочены (${alerts.expired_count})</div>
        ${alerts.expired.map(u => `<div style="padding:12px 16px;background:rgba(255,82,82,0.1);border:1px solid rgba(255,82,82,0.2);border-radius:10px;margin-bottom:8px;font-size:14px;color:#fff;"><b>${esc(u.full_name)}</b> <span style="color:var(--text-muted);">· ${esc(u.position || '—')}</span></div>`).join('')}
        ${alerts.expired_count > alerts.expired.length ? `<div style="font-size:12px;color:var(--text-muted);margin-top:8px;">…и ещё ${alerts.expired_count - alerts.expired.length}</div>` : ''}
      </div>`;
    }
    if (alerts.expiring_count > 0) {
      html += `<div>
        <div style="font-size:13px;font-weight:700;color:var(--amber);margin-bottom:12px;text-transform:uppercase;letter-spacing:0.5px;">⚠️ Скоро истекают (${alerts.expiring_count})</div>
        ${alerts.expiring.map(u => `<div style="padding:12px 16px;background:var(--amber-soft);border:1px solid rgba(255,179,0,0.2);border-radius:10px;margin-bottom:8px;font-size:14px;color:#fff;"><b>${esc(u.full_name)}</b> <span style="color:var(--text-muted);">· ${esc(u.position || '—')}</span></div>`).join('')}
        ${alerts.expiring_count > alerts.expiring.length ? `<div style="font-size:12px;color:var(--text-muted);margin-top:8px;">…и ещё ${alerts.expiring_count - alerts.expiring.length}</div>` : ''}

    box.innerHTML = html;
  } catch (e) {}
}

/* ================== USERS ================== */
let _usersCurrentSearch = '';
let _usersTab = 'active';
let _citizenshipsList = [];

async function loadCitizenships() {
    if (_citizenshipsList.length > 0) return _citizenshipsList;
    try {
        const res = await api('/api/admin/citizenships', {});
        _citizenshipsList = res.citizenships || [];
        return _citizenshipsList;
    } catch(e) { return []; }
}

async function loadUsers(search) {
  _usersCurrentSearch = search || '';
  const canCreate = hasPerm('users_create');
  $('page-actions').innerHTML = canCreate ? '<button class="btn primary small" id="users-create">+ Создать</button>' : '';
  if (canCreate) $('users-create').addEventListener('click', openUserCreate);

  $('page-content').innerHTML = `
    <div class="subtabs">
      <button class="subtab ${_usersTab==='active'?'active':''}" data-users-tab="active">Активные</button>
      <button class="subtab ${_usersTab==='fired'?'active':''}" data-users-tab="fired">Уволенные</button>
    </div>
    <div class="search-bar"><input id="users-search" placeholder="Поиск по логину, ФИО, телефону, ID…" value="${esc(_usersCurrentSearch)}" autocomplete="off"></div>
    <div class="table-card"><div class="table-wrap"><table id="users-table">
      <thead id="users-thead"></thead>
      <tbody id="users-tbody"></tbody>
    </table></div></div>`;

  document.querySelectorAll('[data-users-tab]').forEach(t => t.addEventListener('click', () => {
    _usersTab = t.dataset.usersTab;
    loadUsers(_usersCurrentSearch);
  }));

  const thead = $('users-thead');
  if (_usersTab === 'fired') {
    thead.innerHTML = '<tr><th>Логин</th><th>ФИО</th><th>Должность</th><th>Уволен</th><th></th></tr>';
  } else {
    thead.innerHTML = '<tr><th>Логин</th><th>ФИО</th><th>Должность</th><th>Медкнижка</th><th></th></tr>';
  }

  const inp = $('users-search');
  let timer = null;
  inp.addEventListener('input', () => {
    _usersCurrentSearch = inp.value;
    clearTimeout(timer);
    timer = setTimeout(() => refreshUsersTable(_usersCurrentSearch.trim()), 200);
  });

  $('users-tbody').addEventListener('click', (e) => {
    const e1 = e.target.closest('[data-edit]'); if (e1) { e.stopPropagation(); openUserEditor(parseInt(e1.dataset.edit)); return; }
    const e2 = e.target.closest('[data-medbook]'); if (e2) { e.stopPropagation(); openMedbookEditor(parseInt(e2.dataset.medbook)); return; }
    const e3 = e.target.closest('[data-fire]'); if (e3) { e.stopPropagation(); fireUser(parseInt(e3.dataset.fire)); return; }
    const e4 = e.target.closest('[data-restore]'); if (e4) { e.stopPropagation(); restoreUser(parseInt(e4.dataset.restore)); return; }
    const tr = e.target.closest('tr[data-uid]'); if (tr) openUserEditor(parseInt(tr.dataset.uid));
  });

  const data = await api('/api/admin/users', { search: _usersCurrentSearch.trim(), fired: _usersTab === 'fired' });
  renderUsersTbody(data.users);
  if (_usersCurrentSearch) { inp.focus(); const l = inp.value.length; inp.setSelectionRange(l, l); }
}
async function refreshUsersTable(search) {
  _usersCurrentSearch = search || '';
  if (!$('users-tbody')) return;
  const data = await api('/api/admin/users', { search: _usersCurrentSearch, fired: _usersTab === 'fired' });
  renderUsersTbody(data.users);
}
function renderUsersTbody(users) {
  const tbody = $('users-tbody');
  if (!tbody) return;
  if (!users.length) {
    tbody.innerHTML = `<tr><td colspan="5"><div class="empty">${_usersTab === 'fired' ? 'Уволенных нет' : 'Нет сотрудников'}</div></td></tr>`;
    return;
  }
  const canEdit = hasPerm('users_edit');
  const canMedbook = hasPerm('medbook_edit');
  const canFire = hasPerm('users_fire');

  tbody.innerHTML = users.map(u => {
    if (_usersTab === 'fired') {
      return `
        <tr class="row-clickable fired-row" data-uid="${u.user_id}">
          <td>${u.login ? `<span class="login-cell">${esc(u.login)}</span>` : '<span class="tag gray">нет</span>'}</td>
          <td><b>${esc(u.full_name || '—')}</b></td>
          <td>${esc(u.position || '—')}</td>
          <td style="font-size:12px;color:var(--text-muted);">${fmtDate(u.fired_at, false)}</td>
          <td class="actions-cell">
            ${canFire ? `<button class="icon-btn restore" data-restore="${u.user_id}" title="Восстановить">↩️</button>` : ''}
          </td>
        </tr>`;
    }
    const mbStatus = u.medbook_status || 'invalid';
    let mbTag = '';
    if (u.is_admin) mbTag = '<span class="tag gray">—</span>';
    else if (mbStatus === 'ok') mbTag = '<span class="tag green">✅</span>';
    else if (mbStatus === 'expiring') mbTag = '<span class="tag amber">⚠️</span>';
    else mbTag = '<span class="tag red">❌</span>';
    const showFireBtn = canFire && !u.is_super_admin && u.user_id !== ME.user_id;
    return `
      <tr class="row-clickable" data-uid="${u.user_id}">
        <td>${u.login ? `<span class="login-cell">${esc(u.login)}</span>` : '<span class="tag gray">нет</span>'}</td>
        <td><b>${esc(u.full_name || '—')}</b></td>
        <td>${esc(u.position || '—')}</td>
        <td>${mbTag}</td>
        <td class="actions-cell">
          ${!u.is_admin && canMedbook ? `<button class="icon-btn" data-medbook="${u.user_id}" title="Медкнижка">🩺</button>` : ''}
          ${canEdit ? `<button class="icon-btn" data-edit="${u.user_id}">✏️</button>` : ''}
          ${showFireBtn ? `<button class="icon-btn fire" data-fire="${u.user_id}" title="Уволить">🚪</button>` : ''}
        </td>
      </tr>`;
  }).join('');
}

async function fireUser(uid) {
  if (!confirm('Уволить сотрудника? Он потеряет доступ и переместится во вкладку «Уволенные».')) return;
  try {
    await api('/api/admin/user/fire', { user_id: uid });
    toast('Сотрудник уволен', 'success');
    loadUsers(_usersCurrentSearch);
  } catch (e) {
    const map = { forbidden: 'Нет права увольнять', cannot_fire_super: 'Нельзя уволить супер-админа',
      cannot_fire_admin: 'Только супер-админ может уволить другого админа',
      cannot_fire_self: 'Нельзя уволить себя', already_fired: 'Уже уволен', invalid_id: 'Неверный ID' };
    toast(map[e.message] || 'Ошибка: ' + e.message, 'error');
  }
}
async function restoreUser(uid) {
  if (!confirm('Восстановить сотрудника?')) return;
  try {
    await api('/api/admin/user/restore', { user_id: uid });
    toast('Восстановлен', 'success');
    loadUsers(_usersCurrentSearch);
  } catch (e) { toast('Ошибка: ' + e.message, 'error'); }
}

async function openUserCreate() {

    const posOpts = posData.positions.filter(p => !p.is_archived).map(p => `<option value="${esc(p.name)}" style="background:#1a1a2e;">${esc(p.name)}</option>`).join('');
    const citOpts = cits.map(c => `<option value="${c.id}" style="background:#1a1a2e;">${esc(c.name)}</option>`).join('');

    openModal('Создать сотрудника', `
      <div class="form-group">

        <div class="form-hint">Логин будет сгенерирован из фамилии автоматически</div>
      </div>
      <div class="login-preview" id="login-preview" style="display:none;">
        <div class="lp-icon">🔑</div>
        <div style="flex:1;">
          <div class="lp-label">Логин будет выдан</div>
          <div class="lp-value" id="lp-value">—</div>

      <div class="form-row">
        <div class="form-group"><label>Телефон</label><input class="form-input" id="nc-phone" inputmode="tel"></div>
        <div class="form-group"><label>Дата рождения</label><input class="form-input" id="nc-birth" placeholder="ДД.ММ.ГГГГ"></div>
      </div>

      <div class="form-row">
        <div class="form-group"><label>Дата трудоустройства</label><input class="form-input" id="nc-hire-date" type="date" style="color-scheme: dark;"></div>
        <div class="form-group">
          <label>Гражданство <button class="btn primary small" type="button" onclick="addNewCitizenship('nc-citizenship')" style="padding:2px 6px; margin-left:6px;">+</button></label>
          <select class="form-select" id="nc-citizenship">${citOpts}</select>

      <div class="form-row">
        <div class="form-group"><label>Должность</label><select class="form-select" id="nc-position">${posOpts}</select></div>
        <div class="form-group"><label>Ресторан</label><select class="form-select" id="nc-restaurant"><option value="" style="background:#1a1a2e;">—</option>${restOpts}</select></div>
      </div>
      
      <div class="form-group"><div class="checkbox-row"><input type="checkbox" id="nc-cert"><label for="nc-cert">Сертификация пройдена</label></div></div>
      <div class="form-hint error" id="nc-error"></div>
    `, `<button class="btn ghost" onclick="closeModal()">Отмена</button><button class="btn primary" id="nc-save">Создать</button>`);

    function previewLogin(name) {
      const translit = {"а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ё":"e","ж":"zh","з":"z","и":"i","й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u","ф":"f","х":"h","ц":"ts","ч":"ch","ш":"sh","щ":"sch","ъ":"","ы":"y","ь":"","э":"e","ю":"yu","я":"ya"};
      const parts = (name || "").trim().split(/\s+/);
      const surname = (parts[0] || "").toLowerCase();
      let letters = "";
      for (const ch of surname) { if (letters.length >= 3) break; const t = translit[ch]; if (t) letters += t; }
      while (letters.length < 3) letters += "abcdefghijklmnopqrstuvwxyz"[Math.floor(Math.random() * 26)];
      const rnd = Math.floor(Math.random() * 90) + 10;
      return letters.slice(0, 3) + rnd;
    }

    $('nc-name').addEventListener('input', (e) => {
      const name = e.target.value.trim();
      const p = $('login-preview');
      if (!name) { p.style.display = 'none'; return; }
      p.style.display = 'flex';
      $('lp-value').textContent = previewLogin(name);
    });

    $('nc-save').addEventListener('click', async () => {
      const errEl = $('nc-error');
      errEl.textContent = '';
      const name = $('nc-name').value.trim();
      const password = $('nc-password').value;
      if (!name) { errEl.textContent = 'Введите ФИО'; return; }
      if (!password || password.length < 6) { errEl.textContent = 'Пароль должен быть минимум 6 символов'; return; }
      try {
        const res = await api('/api/admin/user/create', {
          password, full_name: name,
          phone: $('nc-phone').value.trim(), birth_date: $('nc-birth').value.trim(),
          position: $('nc-position').value, restaurant: $('nc-restaurant').value,
          is_certified: $('nc-cert').checked,
          hire_date: $('nc-hire-date').value, citizenship_id: $('nc-citizenship').value
        });
        closeModal();
        openModal('✅ Сотрудник создан', `
          <div style="text-align:center; padding: 10px 0;">
            <div style="font-size:48px; margin-bottom:12px;">🎉</div>
            <div style="font-size:18px; font-weight:800; margin-bottom:6px; color:#fff;">${esc(res.user.full_name)}</div>
            <div class="login-preview" style="display:inline-flex; text-align:left; margin:16px auto 0;">
              <div class="lp-icon">🔑</div>
              <div><div class="lp-label">Логин</div>
              <div class="lp-value" style="font-size:24px;">${esc(res.user.login)}</div>
              <div class="lp-hint">Сообщите сотруднику вместе с паролем</div></div>
            </div>
          </div>
        `, `<button class="btn primary" id="after-create-ok">Понятно</button>`);
        $('after-create-ok').addEventListener('click', () => {
          closeModal();
          refreshUsersTable(_usersCurrentSearch);
        });
      } catch (e) {
        const map = { invalid: 'Проверьте данные (пароль минимум 6 символов)', forbidden: 'Нет права', invalid_json: 'Ошибка данных' };
        errEl.textContent = map[e.message] || 'Ошибка: ' + e.message;
      }
    });
  } catch (e) {
    toast('Ошибка загрузки данных: ' + e.message, 'error');
  }
}

async function addNewCitizenship(selectId) {
    if (!hasPerm('citizenships_edit')) {
        toast('Нет права добавлять гражданства', 'error');
        return;
    }
    const name = prompt("Введите название страны (гражданства):");
    if (!name || !name.trim()) return;
    
    try {
        const res = await api('/api/admin/citizenship/add', { name: name.trim() });
        if (res.ok) {
            toast('Гражданство добавлено', 'success');
            _citizenshipsList = []; // сброс кэша
            const cits = await loadCitizenships();
            
            // Обновляем все существующие селекты на странице
            const sel = $(selectId);
            if (sel) {
                const curVal = sel.value;
                sel.innerHTML = cits.map(c => `<option value="${c.id}" style="background:#1a1a2e;">${esc(c.name)}</option>`).join('');
                // Пытаемся выбрать только что добавленное
                const newOpt = Array.from(sel.options).find(o => o.text === name.trim());
                if (newOpt) sel.value = newOpt.value;
                else sel.value = curVal;
            }
        } else {

function parseDdMmYyyy(s) {
  if (!s) return null;
  const m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(s.trim());
  if (!m) return null;
  const d = new Date(+m[3], +m[2] - 1, +m[1]);
  if (isNaN(d.getTime())) return null;
  if (d.getDate() !== +m[1] || d.getMonth() !== +m[2] - 1) return null;
  return d;
}
function addMonthsClient(d, months) {
  const r = new Date(d);
  r.setMonth(r.getMonth() + months);
  return r;
}
function entryStatusClient(dateStr, validityMonths) {
  if (!dateStr) return 'missing';
  const d = parseDdMmYyyy(dateStr);
  if (!d) return 'invalid_date';
  const exp = addMonthsClient(d, validityMonths);
  const now = new Date();
  if (exp < now) return 'expired';
  if ((exp - now) / 86400000 <= 30) return 'expiring';
  return 'ok';
}

async function openMedbookEditor(userId) {
  if (!hasPerm('medbook_edit')) { toast('Нет права редактировать медкнижки', 'error'); return; }
  const data = await api('/api/admin/medbook/get', { user_id: userId });
  const { user, medbook, doctors, tests, vaccines } = data;
  const mb = medbook || { doctors: {}, tests: {}, vaccines: {} };

  const renderRows = (list, source) => list.map(item => {
    const dateStr = (mb[source] && mb[source][item.id]) || '';
    const st = entryStatusClient(dateStr, item.validity_months);
    let statusText = '', statusCls = '';
    if (st === 'missing') { statusText = 'Обяз.'; statusCls = 'missing'; }
    else if (st === 'invalid_date') { statusText = 'Ошибка'; statusCls = 'missing'; }
    else if (st === 'expired') { statusText = 'Просроч.'; statusCls = 'expired'; }
    else if (st === 'expiring') { statusText = 'Скоро'; statusCls = 'expiring'; }
    else { statusText = 'OK'; statusCls = 'ok'; }
    return `
      <div class="medbook-row">
        <div class="name">${esc(item.name)}${item.required ? ' <span style="color:#FF5252;font-weight:800;">*</span>' : ''}</div>
        <input type="text" placeholder="ДД.ММ.ГГГГ" value="${esc(dateStr)}" data-mb-input="${source}:${item.id}" inputmode="numeric">
        <div class="status ${statusCls}">${statusText}</div>
      </div>`;
  }).join('');

  openModal(`🩺 Медкнижка: ${esc(user.full_name)}`, `
    <div style="background:rgba(255,255,255,0.05); padding:16px; border-radius:12px; margin-bottom:24px; font-size:14px; border:1px solid var(--border);">
      <b style="color:#fff;">${esc(user.full_name)}</b> <span style="color:var(--text-muted);">· ${esc(user.position || '—')}${user.restaurant_name ? ' · ' + esc(user.restaurant_name) : ''}</span>
    </div>
    <div class="medbook-status-banner invalid" id="mb-banner">Статус будет рассчитан после сохранения</div>
    <div class="form-hint" style="margin-bottom:24px;">
      ⚠️ Медкнижка действительна только когда заполнены ВСЕ пункты и не просрочены. Формат даты: ДД.ММ.ГГГГ.
    </div>
    <div class="medbook-section"><h4>👨‍⚕️ Врачи</h4>${renderRows(doctors, 'doctors')}</div>
    <div class="medbook-section"><h4>🧪 Анализы</h4>${renderRows(tests, 'tests')}</div>
    <div class="medbook-section"><h4>💉 Прививки</h4>${renderRows(vaccines, 'vaccines')}</div>
    <div class="form-hint error" id="mb-error"></div>
  `, `<button class="btn ghost" onclick="closeModal()">Отмена</button><button class="btn primary" id="mb-save">Сохранить</button>`, { wide: true });

  const refreshBanner = () => {
    const newMb = { doctors: {}, tests: {}, vaccines: {} };
    document.querySelectorAll('[data-mb-input]').forEach(inp => {
      const [src, idStr] = inp.dataset.mbInput.split(':');
      const val = inp.value.trim();
      if (val) newMb[src][+idStr] = val;
    });
    const items = [
      ...doctors.map(x => ({ date: newMb.doctors[x.id], validity: x.validity_months })),
      ...tests.map(x => ({ date: newMb.tests[x.id], validity: x.validity_months })),
      ...vaccines.map(x => ({ date: newMb.vaccines[x.id], validity: x.validity_months })),
    ];
    let emptyCount = 0, expiredCount = 0, expiringCount = 0;
    for (const it of items) {
      const s = entryStatusClient(it.date, it.validity);
      if (s === 'missing' || s === 'invalid_date') emptyCount++;
      else if (s === 'expired') expiredCount++;
      else if (s === 'expiring') expiringCount++;
    }
    const banner = $('mb-banner');
    const total = items.length;
    if (emptyCount > 0 || expiredCount > 0) {
      banner.className = 'medbook-status-banner invalid';
      const parts = [];
      if (emptyCount > 0) parts.push(`не заполнено: ${emptyCount}`);
      if (expiredCount > 0) parts.push(`просрочено: ${expiredCount}`);
      banner.textContent = `❌ Медкнижка НЕДЕЙСТВИТЕЛЬНА — ${parts.join(', ')} из ${total} пунктов`;
    } else if (expiringCount > 0) {
      banner.className = 'medbook-status-banner expiring';
      banner.textContent = `⚠️ Все заполнено, но ${expiringCount} пунктов истекают в ближайшие 30 дней`;
    } else {
      banner.className = 'medbook-status-banner ok';
      banner.textContent = '✅ Медкнижка действительна — все пункты заполнены и в сроке';
    }
    document.querySelectorAll('[data-mb-input]').forEach(inp => {
      const [src, idStr] = inp.dataset.mbInput.split(':');
      const list = src === 'doctors' ? doctors : src === 'tests' ? tests : vaccines;
      const item = list.find(x => x.id === +idStr);
      if (!item) return;
      const st = entryStatusClient(inp.value.trim(), item.validity_months);
      inp.classList.toggle('err', st === 'missing' || st === 'invalid_date' || st === 'expired');
    });
  };
  document.querySelectorAll('[data-mb-input]').forEach(inp => inp.addEventListener('input', refreshBanner));
  refreshBanner();

  $('mb-save').addEventListener('click', async () => {
    const errEl = $('mb-error'); errEl.textContent = '';
    const newMb = { doctors: {}, tests: {}, vaccines: {} };
    document.querySelectorAll('[data-mb-input]').forEach(inp => {
      const [src, idStr] = inp.dataset.mbInput.split(':');
      const val = inp.value.trim();
      if (val) newMb[src][+idStr] = val;
    });
    try {
      await api('/api/admin/medbook/save', { user_id: userId, medbook: newMb });
      toast('Медкнижка сохранена', 'success');
      closeModal();
      if (document.querySelector('#page-content [data-mb-tab]')) loadMedbooks();
      if (document.querySelector('#users-tbody')) refreshUsersTable(_usersCurrentSearch);
    } catch (e) { errEl.textContent = 'Ошибка: ' + e.message; }
  });
}

/* ================== NEWS ================== */
let _uploadedNewsImageUrl = '';

async function loadNews() {
  const data = await api('/api/admin/news', {});
  const all = data.news || [];
  const pending = all.filter(n => n.status === 'pending');
  const others = all.filter(n => n.status !== 'pending');
  const canPublish = canPublishNews();
  const canWrite = hasPerm('news_write') || hasPerm('news_suggest') || canPublish;
  const canEdit = hasPerm('news_edit');
  
  $('page-actions').innerHTML = canWrite ? `<button class="btn primary small" id="news-add-btn">+ ${canPublish ? 'Новость' : 'Предложить'}</button>` : '';
  if (canWrite) $('news-add-btn').addEventListener('click', openNewsAdd);
  
  let pendingHtml = '';
  if (canPublish && pending.length) {
    pendingHtml = `
      <div style="margin-bottom:32px;">
        <h3 style="font-size:14px;text-transform:uppercase;color:var(--text-muted);letter-spacing:0.5px;margin-bottom:16px;">
          💭 На модерации (${pending.length})
        </h3>
        ${pending.map(n => `
          <div class="pending-card">
            <div class="pc-header">
              <div class="pc-author">✍️ ${esc(n.proposed_by || '—')} · ${fmtDate(n.created_at, true)}</div>
              <span class="tag amber">Предложено</span>
            </div>
            ${n.image_url ? `<img src="${esc(n.image_url)}" style="max-height: 150px; border-radius: 10px; margin-bottom: 12px; display: block;">` : ''}
            <div class="pc-title">${esc(n.title)}</div>
            <div class="pc-body">${esc(n.body)}</div>
            <div class="pc-actions">
              <button class="btn green small" data-approve="${n.id}">✅ Опубликовать</button>
              <button class="btn danger small" data-reject="${n.id}">❌ Отклонить</button>
            </div>
          </div>
        `).join('')}
      </div>`;
  }
  const rows = others.map(n => {
    const lvl = n.level === 'urgent' ? '<span class="tag red">Срочно</span>'
      : n.level === 'important' ? '<span class="tag amber">Важно</span>' : '<span class="tag gray">Обычная</span>';
    const status = n.status === 'published' ? '<span class="tag green">✅</span>'
      : n.status === 'scheduled' ? `<span class="tag blue">⏰ ${fmtDate(n.publish_at, false)}</span>` : '<span class="tag amber">Модерация</span>';
    return `
      <tr>
        <td>
            ${n.image_url ? `<img src="${esc(n.image_url)}" style="width: 40px; height: 40px; object-fit: cover; border-radius: 8px; margin-right: 8px; vertical-align: middle;">` : ''}
            ${lvl}
        </td>
        <td><b>${esc(n.title)}</b></td>
        <td>${status}</td>
        <td class="actions-cell">
          ${canEdit ? `<button class="icon-btn" data-title="${n.id}">✏️</button>` : ''}
          ${canEdit && n.status !== 'pending' ? `<button class="icon-btn danger" data-del="${n.id}">🗑</button>` : ''}
        </td>
      </tr>`;
  }).join('');
  
  $('page-content').innerHTML = `
    ${pendingHtml}
    <div class="table-card"><div class="table-wrap"><table>
      <thead><tr><th>Тип / Фото</th><th>Заголовок</th><th>Статус</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="4"><div class="empty">Новостей нет</div></td></tr>'}</tbody>
    </table></div></div>`;
    
  document.querySelectorAll('[data-approve]').forEach(b => b.addEventListener('click', async () => {
    try {
      await api('/api/admin/news/approve', { id: parseInt(b.dataset.approve) });
      toast('Опубликовано', 'success');
      loadNews();
      refreshCounters();
    } catch (e) { toast('Ошибка: ' + e.message, 'error'); }
  }));
  document.querySelectorAll('[data-reject]').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('Отклонить?')) return;
    try {
      await api('/api/admin/news/reject', { id: parseInt(b.dataset.reject) });
      toast('Отклонено', 'success');
      loadNews();
      refreshCounters();
    } catch (e) { toast('Ошибка: ' + e.message, 'error'); }
  }));
  document.querySelectorAll('[data-title]').forEach(b => b.addEventListener('click', () => openNewsEdit(parseInt(b.dataset.title), others)));
  document.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('Удалить?')) return;
    try {
      await api('/api/admin/news/delete', { id: parseInt(b.dataset.del) });
      toast('Удалена', 'success');
      loadNews();
    } catch (e) { toast('Ошибка: ' + e.message, 'error'); }
  }));
}

function openNewsAdd() {
  const canPublish = canPublishNews();
  const intentOpts = canPublish
    ? `<option value="publish" style="background:#1a1a2e;">📤 Опубликовать сейчас</option><option value="schedule" style="background:#1a1a2e;">⏰ Отложить</option><option value="suggest" style="background:#1a1a2e;">💭 Предложить</option>`
    : `<option value="suggest" style="background:#1a1a2e;">💭 Предложить (на модерацию)</option>`;
    
  _uploadedNewsImageUrl = '';
  
  openModal(canPublish ? 'Новая новость' : 'Предложить новость', `
    <div class="form-group">
      <label>Фотография (опционально)</label>
      <input type="file" id="n-image-file" accept="image/*" style="display: none;">
      <button type="button" class="btn ghost" id="n-image-btn" style="width: 100%; padding: 14px; border-style:dashed;">📷 Прикрепить фото</button>
      <div id="n-image-preview-box" style="display: none; margin-top: 12px; text-align: center;">
        <img id="n-image-preview" style="max-width: 100%; max-height: 200px; border-radius: 12px; object-fit: contain;">
      </div>
    </div>
    <div class="form-group"><label>Заголовок</label><input class="form-input" id="n-title" maxlength="100"></div>
    <div class="form-group"><label>Текст</label><textarea class="form-textarea" id="n-body"></textarea></div>
    <div class="form-group"><label>Уровень</label>
      <select class="form-select" id="n-level">
        <option value="normal" style="background:#1a1a2e;">🔵 Обычная</option><option value="important" style="background:#1a1a2e;">🟡 Важная</option><option value="urgent" style="background:#1a1a2e;">🔴 Срочная</option>
      </select>
    </div>
    <div class="form-group"><label>Действие</label><select class="form-select" id="n-intent">${intentOpts}</select></div>
    <div class="form-group" id="n-sched-time" style="display:none;"><label>Дата и время</label><input class="form-input" type="datetime-local" id="n-publish-at" style="color-scheme: dark;"></div>
  `, `<button class="btn ghost" onclick="closeModal()">Отмена</button><button class="btn primary" id="create-news-btn">${canPublish ? 'Создать' : 'Предложить'}</button>`);
  
  $('n-image-btn').addEventListener('click', () => $('n-image-file').click());
  $('n-image-file').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 15 * 1024 * 1024) { toast('Файл слишком большой (макс 15MB)', 'error'); return; }
    
    const reader = new FileReader();
    reader.onload = async (ev) => {
      const b64 = ev.target.result;
      $('n-image-preview').src = b64;
      $('n-image-preview-box').style.display = 'block';
      
      const btn = $('n-image-btn');
      btn.textContent = '⏳ Загрузка...';
      btn.disabled = true;
      
      try {
        const res = await api('/api/admin/upload', { image_base64: b64, filename: file.name });
        _uploadedNewsImageUrl = res.url;
        btn.textContent = '✅ Фото загружено';
        btn.style.borderColor = 'var(--green)';
        btn.style.color = 'var(--green)';
      } catch (err) {
        toast('Ошибка загрузки фото', 'error');
        btn.textContent = '📷 Прикрепить фото';
      } finally {
        btn.disabled = false;
      }
    };
    reader.readAsDataURL(file);
  });

  $('n-intent').addEventListener('change', e => {
    $('n-sched-time').style.display = e.target.value === 'schedule' ? 'block' : 'none';
  });
  
  $('create-news-btn').addEventListener('click', async () => {
    const body = {
      title: $('n-title').value.trim(), body: $('n-body').value.trim(),
      level: $('n-level').value, intent: $('n-intent').value,
      image_url: _uploadedNewsImageUrl
    };
    if (!body.title || !body.body) { toast('Заполните поля', 'error'); return; }
    if (body.intent === 'schedule') {
      const dt = $('n-publish-at').value;
      if (!dt) { toast('Укажите дату', 'error'); return; }
      body.publish_at = new Date(dt).toISOString();
    }
    try {
      const res = await api('/api/admin/news/add', body);
      const msgs = { published: 'Опубликовано', scheduled: 'Отложено', pending: 'Отправлено на модерацию' };
      toast(msgs[res.status] || 'Готово', 'success');
      closeModal();
      loadNews();
      refreshCounters();
    } catch (e) {
      if (e.message === 'forbidden') toast('Нет прав на публикацию', 'error');
      else if (e.message === 'publish_at_required') toast('Укажите дату', 'error');
      else toast('Ошибка: ' + e.message, 'error');
    }
  });
}
