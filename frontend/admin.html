<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wokker · Админ</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2316161a'/%3E%3Ccircle cx='50' cy='50' r='42' fill='none' stroke='%23ef4444' stroke-width='8'/%3E%3Cpath d='M25 50 A 25 25 0 0 0 75 50' fill='none' stroke='%23ef4444' stroke-width='12' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#08080a">
<link rel="apple-touch-icon" href="/static/icon-192.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wokker Admin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin.css">
<style>
/* Bento-specific overrides */
.nav-group-title {
  font-size: 11px; font-weight: 600; color: var(--text-terc); text-transform: uppercase; letter-spacing: 1px; padding: 16px 12px 8px;
}
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 14px; font-weight: 500; color: var(--text-sec); background: transparent; border: none; cursor: pointer; transition: all 0.2s; width: 100%; text-align: left;
}
.nav-item:hover { color: var(--text); background: rgba(255,255,255,0.04); }
.nav-item--active { color: #fff; background: rgba(139,92,246,0.15); box-shadow: inset 3px 0 0 var(--purple); }
.nav-item .count { margin-left: auto; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: rgba(255,255,255,0.06); color: var(--text-terc); }
.nav-item--active .count { background: rgba(139,92,246,0.2); color: var(--purple); }
.sidebar-footer { margin-top: auto; padding: 20px 12px; border-top: 1px solid var(--border); }
.sidebar-footer .who { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
.sidebar-footer .login-line { font-size: 12px; color: var(--text-terc); margin-bottom: 8px; }
.badge-role { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; margin-bottom: 12px; }
.badge-role.super { background: rgba(139,92,246,0.15); color: var(--purple); }
.badge-role.hr { background: rgba(34,197,94,0.15); color: var(--green); }
.badge-role.regular { background: rgba(59,130,246,0.15); color: var(--blue); }
.sidebar-footer button { width: 100%; padding: 8px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; transition: all 0.2s; border: 1px solid var(--border); background: rgba(255,255,255,0.03); color: var(--text-sec); margin-bottom: 6px; }
.sidebar-footer button:hover { background: rgba(255,255,255,0.06); color: var(--text); }
.sidebar-footer button.danger { color: var(--red); border-color: rgba(239,68,68,0.2); }
.sidebar-footer button.danger:hover { background: rgba(239,68,68,0.1); }
.sidebar-logo { font-size: 18px; font-weight: 700; padding: 0 12px 16px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
.sidebar-logo .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: rgba(239,68,68,0.15); color: var(--red); margin-left: 8px; }
.hamburger { display: none; background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer; padding: 4px; }
.topbar-left { display: flex; align-items: center; gap: 16px; flex: 1; }
.topbar-right { display: flex; align-items: center; gap: 16px; }
.topbar-icon-btn { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-sec); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: all 0.2s; }
.topbar-icon-btn:hover { background: rgba(255,255,255,0.08); color: var(--text); }
.topbar-title { font-size: 18px; font-weight: 600; color: var(--text); margin: 0; }
.sidebar-overlay { display: none; }
.content { padding: 24px 0; }
/* Bento grid */
.b-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; position: relative; overflow: hidden; transition: all 0.25s ease; }
.b-card::before { content: ''; position: absolute; inset: 0; background: radial-gradient(800px circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,0.02), transparent 40%); opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.b-card:hover::before { opacity: 1; }
.b-card--wide { grid-column: span 2; }
.b-card--tall { grid-row: span 2; }
.b-card--stat { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.b-card__label { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--text-sec); margin-bottom: 8px; }
.b-card__icon { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.b-card__icon--green { background: rgba(34,197,94,0.15); }
.b-card__icon--amber { background: rgba(245,158,11,0.15); }
.b-card__icon--purple { background: rgba(139,92,246,0.15); }
.b-card__icon--blue { background: rgba(59,130,246,0.15); }
.b-card__value { font-size: 32px; font-weight: 700; color: var(--text); line-height: 1; }
.b-card__value--green { color: var(--green); }
.b-card__value--amber { color: var(--amber); }
.b-card__value--purple { color: var(--purple); }
.b-card__value--blue { color: var(--blue); }
.b-card__meta { font-size: 12px; color: var(--text-terc); display: flex; align-items: center; gap: 6px; }
.b-card__trend { font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px; }
.b-card__trend--up { background: rgba(34,197,94,0.1); color: var(--green); }
.b-card__trend--warn { background: rgba(245,158,11,0.1); color: var(--amber); }
.b-card__trend--down { background: rgba(239,68,68,0.1); color: var(--red); }
.b-card__header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.b-card__header-title { font-size: 15px; font-weight: 600; color: var(--text); }
.b-card__header-action { font-size: 13px; color: var(--purple); cursor: pointer; font-weight: 500; }
.b-card__header-action:hover { text-decoration: underline; }
/* Activity feed */
.activity { display: flex; flex-direction: column; gap: 12px; }
.activity__item { display: flex; align-items: flex-start; gap: 12px; padding: 12px; border-radius: var(--radius); background: rgba(255,255,255,0.02); border: 1px solid var(--border); }
.activity__icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
.activity__icon--green { background: rgba(34,197,94,0.1); }
.activity__icon--accent { background: rgba(139,92,246,0.1); }
.activity__icon--blue { background: rgba(59,130,246,0.1); }
.activity__icon--purple { background: rgba(139,92,246,0.1); }
.activity__content { flex: 1; min-width: 0; }
.activity__text { font-size: 13px; color: var(--text); line-height: 1.5; }
.activity__text strong { color: var(--purple); font-weight: 600; }
.activity__time { font-size: 11px; color: var(--text-terc); margin-top: 4px; }
/* Name cell */
.name-cell { display: flex; align-items: center; gap: 10px; }
.avatar { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; font-size: 14px; flex-shrink: 0; }
/* Skeleton */
.skeleton { background: rgba(255,255,255,0.05); border-radius: 6px; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
.skeleton-stat { height: 28px; width: 60px; }
/* Responsive */
@media (max-width: 1200px) {
  .b-card--wide { grid-column: span 1; }
}
@media (max-width: 768px) {
  .hamburger { display: block; }
  .sidebar { position: fixed; top: 64px; left: 0; bottom: 0; transform: translateX(-100%); z-index: 200; transition: transform 0.3s ease; }
  .sidebar--open { transform: translateX(0); }
  .sidebar-overlay { display: none; position: fixed; inset: 0; top: 64px; background: rgba(0,0,0,0.5); z-index: 199; }
  .sidebar-overlay--show { display: block; }
  .main { margin-left: 0; }
  .content { padding: 16px 0; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">W</div>
    <h1>Wokker Admin</h1>
    <div class="sub">Вход в панель управления</div>
    <input class="login-input" id="login-login" type="text" placeholder="Логин" maxlength="5" style="text-transform: lowercase;" autocomplete="username">
    <input class="login-input" id="login-password" type="password" placeholder="Пароль" autocomplete="current-password">
    <button class="login-btn" id="login-btn">Войти</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none;">
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo"><span style="color:var(--accent)">wokker</span> <span class="badge">Admin</span></div>

      <nav id="nav">
        <div class="nav-group-title">Управление</div>
        <button class="nav-item" data-page="dashboard">🏠 Дашборд</button>
        <button class="nav-item" data-page="users">👥 Сотрудники</button>
        <button class="nav-item" data-page="medbooks">📋 Медкнижки</button>

        <div class="nav-group-title">Контент</div>
        <button class="nav-item" data-page="news">📰 Новости <span class="count" id="news-pending-count" style="display:none;">0</span></button>
        <button class="nav-item" data-page="standards">📜 Стандарты <span class="count" id="standards-pending-count" style="display:none;">0</span></button>
        <button class="nav-item" data-page="certification">🎓 Сертификация</button>
        <button class="nav-item" data-page="faq">❓ FAQ</button>

        <div class="nav-group-title">Настройки</div>
        <button class="nav-item" data-page="restaurants">🏢 Рестораны</button>
        <button class="nav-item" data-page="positions">💼 Должности</button>
        <button class="nav-item" data-page="questions">💬 Вопросы <span class="count" id="q-count" style="display:none;">0</span></button>
        <button class="nav-item" data-page="admins" id="nav-admins" style="display:none;">🔑 Администраторы</button>
        <button class="nav-item" data-page="reports">📊 Отчёты</button>
        <button class="nav-item" data-page="audit">🕘 История</button>
      </nav>

      <div class="sidebar-footer">
        <div class="who" id="admin-name">—</div>
        <div class="login-line" id="admin-login">—</div>
        <div class="badge-role regular" id="admin-role">—</div>
        <button id="change-password-btn">Сменить пароль</button>
        <button id="logout-btn" class="danger">Выйти</button>
      </div>
    </aside>

    <div class="sidebar-overlay" id="overlay"></div>

    <div class="main">
      <div class="topbar">
        <div class="topbar-left">
          <button class="hamburger" id="hamburger" aria-label="Меню">☰</button>
        </div>
        <h2 class="topbar-title" id="page-title">Дашборд</h2>
        <div class="topbar-right">
          <div class="topbar-avatar" id="topbar-avatar">?</div>
        </div>
      </div>
      <div class="content" id="page-content">
        <div class="loading">Загрузка…</div>
      </div>
    </div>
  </div>
</div>

<!-- TOASTS -->
<div class="toast-container" id="toasts"></div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-box">
    <div class="modal-header">
      <h3 id="modal-title">—</h3>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- BENTO JS -->
<script src="/admin.js"></script>
</body>
</html>
