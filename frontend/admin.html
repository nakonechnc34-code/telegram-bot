<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wokker · Админ</title>
<style>
  :root {
    --bg: #F5F5F7; --card-bg: #FFFFFF; --text-main: #1C1C1E;
    --text-muted: #8E8E93; --accent: #FF3B30; --accent-soft: #FFEBEA;
    --green: #34C759; --green-soft: #E8F8EB;
    --amber: #FF9500; --amber-soft: #FFF4E0;
    --blue: #007AFF; --blue-soft: #E5F0FF;
    --border: rgba(0,0,0,0.08); --sidebar: #1C1C1E; --sidebar-hover: #2C2C2E;
    --shadow: 0 4px 16px rgba(0,0,0,0.06); --shadow-lg: 0 24px 64px rgba(0,0,0,0.14);
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text-main); font-size: 14px;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  button, input, select, textarea { font-family: inherit; font-size: inherit; }
  button { cursor: pointer; }

  #login-screen {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #1C1C1E 0%, #2C2C2E 100%); z-index: 2000;
  }
  .login-card {
    background: #fff; border-radius: 24px; padding: 40px; width: 100%; max-width: 400px;
    box-shadow: 0 32px 80px rgba(0,0,0,0.4);
  }
  .login-card h1 { font-size: 26px; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.5px; }
  .login-card .sub { color: var(--text-muted); margin-bottom: 28px; font-size: 14px; }
  .login-logo { width: 60px; height: 60px; background: #F8F9FA; border-radius: 18px;
    display: flex; align-items: center; justify-content: center; font-size: 32px; margin-bottom: 20px; }
  .login-input {
    width: 100%; border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; font-size: 15px; background: #F8F9FA; outline: none;
    transition: border-color 0.2s, background 0.2s; margin-bottom: 12px;
    font-weight: 600; color: var(--text-main);
  }
  .login-input:focus { border-color: var(--accent); background: #fff; }
  .login-btn {
    width: 100%; background: var(--accent); color: #fff; border: 0; border-radius: 12px;
    padding: 14px; font-size: 15px; font-weight: 700; margin-top: 8px;
  }
  .login-btn:hover { opacity: 0.92; }
  .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .login-hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; margin-bottom: 8px; }
  .login-error { color: var(--accent); font-size: 13px; min-height: 18px; margin-top: 10px; font-weight: 600; }

  #app { display: none; min-height: 100vh; }
  .layout { display: flex; min-height: 100vh; }
  .sidebar {
    width: 240px; background: var(--sidebar); color: #fff; padding: 20px 12px;
    display: flex; flex-direction: column; flex-shrink: 0; position: sticky; top: 0; height: 100vh;
  }
  .sidebar-logo {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px 24px; font-weight: 800;
    font-size: 17px; letter-spacing: -0.3px;
  }
  .sidebar-logo .badge { background: var(--accent); color: #fff; font-size: 10px; padding: 3px 7px;
    border-radius: 6px; font-weight: 800; text-transform: uppercase; }
  .sidebar nav { display: flex; flex-direction: column; gap: 2px; flex: 1; overflow-y: auto; }
  .nav-item {
    background: none; border: 0; color: rgba(255,255,255,0.7); text-align: left;
    padding: 10px 14px; border-radius: 10px; font-size: 14px; font-weight: 500;
    display: flex; align-items: center; gap: 10px; white-space: nowrap;
  }
  .nav-item:hover { background: var(--sidebar-hover); color: #fff; }
  .nav-item.active { background: var(--accent); color: #fff; font-weight: 600; }
  .nav-item .ico { width: 18px; display: inline-block; text-align: center; }
  .nav-item .count { margin-left: auto; background: rgba(255,255,255,0.15); padding: 2px 8px;
    border-radius: 20px; font-size: 11px; font-weight: 700; }
  .sidebar-footer {
    padding: 14px; border-top: 1px solid rgba(255,255,255,0.1); margin-top: 12px;
    font-size: 12px; color: rgba(255,255,255,0.6);
  }
  .sidebar-footer .who { color: #fff; font-weight: 600; font-size: 13px; margin-bottom: 2px; }
  .sidebar-footer .login-line { font-family: monospace; color: rgba(255,255,255,0.8); margin-bottom: 10px; }
  .sidebar-footer button {
    background: rgba(255,255,255,0.1); border: 0; color: #fff;
    padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 600;
    width: 100%; margin-top: 6px;
  }
  .sidebar-footer button:hover { background: rgba(255,255,255,0.2); }
  .sidebar-footer button.danger:hover { background: rgba(255,59,48,0.7); }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    padding: 20px 32px; background: var(--card-bg); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    position: sticky; top: 0; z-index: 50;
  }
  .topbar h2 { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }
  .topbar .actions { display: flex; gap: 8px; align-items: center; }
  .content { padding: 24px 32px; flex: 1; }

  .btn { border: 0; border-radius: 10px; padding: 10px 18px; font-size: 13px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 6px; background: #F2F2F7; color: var(--text-main); }
  .btn:hover { background: #E5E5EA; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.primary:hover { background: #E6342A; }
  .btn.ghost { background: transparent; border: 1px solid var(--border); }
  .btn.ghost:hover { background: #F8F9FA; }
  .btn.small { padding: 6px 12px; font-size: 12px; }
  .btn.danger { background: var(--accent-soft); color: var(--accent); }
  .btn.danger:hover { background: #FFD9D6; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .table-card { background: var(--card-bg); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 14px 18px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { background: #F8F9FA; font-weight: 700; font-size: 11%;
    text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #FAFAFA; }
  .row-clickable { cursor: pointer; }

  .tag { display: inline-block; padding: 3px 8px; border-radius: 6px;
    font-size: 11px; font-weight: 700; white-space: nowrap; }
  .tag.green { background: var(--green-soft); color: #1B7A36; }
  .tag.red { background: var(--accent-soft); color: var(--accent); }
  .tag.gray { background: #F2F2F7; color: var(--text-muted); }
  .tag.amber { background: var(--amber-soft); color: #C77700; }
  .tag.blue { background: var(--blue-soft); color: #0055CC; }
  .tag-stack { display: flex; gap: 4px; flex-wrap: wrap; }
  .login-cell { font-family: monospace; font-weight: 700; font-size: 12px;
    background: #F2F2F7; padding: 2px 6px; border-radius: 4px; }

  .actions-cell { display: flex; gap: 6px; justify-content: flex-end; }
  .icon-btn {
    background: #F2F2F7; border: 0; border-radius: 8px; width: 30px; height: 30px;
    display: inline-flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .icon-btn:hover { background: #E5E5EA; }
  .icon-btn.danger { background: var(--accent-soft); color: var(--accent); }
  .icon-btn.danger:hover { background: #FFD9D6; }

  .search-bar { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; }
  .search-bar input {
    flex: 1; max-width: 360px; border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; font-size: 14px; outline: none; background: #fff;
  }
  .search-bar input:focus { border-color: var(--accent); }

  .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat-card { background: var(--card-bg); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); }
  .stat-card .label { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-bottom: 8px;
    text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-card .value { font-size: 28px; font-weight: 800; letter-spacing: -1px; }
  .stat-card .hint { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
  .stat-card.accent .value { color: var(--accent); }
  .stat-card.green .value { color: var(--green); }
  .stat-card.amber .value { color: var(--amber); }

  .chart-card { background: var(--card-bg); border-radius: 14px; padding: 24px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .chart-card h3 { font-size: 14px; font-weight: 700; margin-bottom: 20px;
    text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }
  .bar-chart { display: flex; align-items: flex-end; gap: 12px; height: 120px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { width: 100%; background: var(--accent); border-radius: 6px 6px 0 0; min-height: 4px; }
  .bar-label { font-size: 11px; color: var(--text-muted); font-weight: 600; }
  .bar-value { font-size: 12px; font-weight: 700; }

  .empty { text-align: center; padding: 60px 20px; color: var(--text-muted);
    background: var(--card-bg); border-radius: 14px; box-shadow: var(--shadow); }
  .empty .emoji { font-size: 48px; margin-bottom: 12px; display: block; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: none; align-items: center; justify-content: center; z-index: 1000;
    padding: 20px; backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 16px; width: 100%; max-width: 620px;
    max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
  .modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; background: #fff; z-index: 1; }
  .modal-header h3 { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
  .modal-close { background: #F2F2F7; border: 0; width: 32px; height: 32px; border-radius: 8px;
    font-size: 18px; display: flex; align-items: center; justify-content: center; }
  .modal-body { padding: 24px; }
  .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border);
    display: flex; justify-content: flex-end; gap: 8px; position: sticky; bottom: 0; background: #fff; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted);
    margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .form-input, .form-select, .form-textarea {
    width: 100%; border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 14px; font-size: 14px; outline: none; background: #fff; color: var(--text-main);
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
  .form-textarea { resize: vertical; min-height: 100px; font-family: inherit; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .form-hint.error { color: var(--accent); font-weight: 600; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; }
  .checkbox-row input { width: 18px; height: 18px; accent-color: var(--accent); }
  .checkbox-row label { font-size: 14px; font-weight: 500; cursor: pointer;
    text-transform: none; letter-spacing: 0; color: var(--text-main); margin: 0; }

  .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 3000;
    display: flex; flex-direction: column; gap: 10px; }
  .toast { background: rgba(28, 28, 30, 0.96); color: #fff; padding: 14px 20px;
    border-radius: 12px; font-size: 13px; font-weight: 600; max-width: 380px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2); animation: slideIn 0.25s ease; }
  .toast.error { background: rgba(255, 59, 48, 0.96); }
  .toast.success { background: rgba(52, 199, 89, 0.96); }
  @keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  .page-loading { text-align: center; padding: 60px; color: var(--text-muted); }
  .loader { display: inline-block; width: 16px; height: 16px;
    border: 2px solid rgba(0,0,0,0.15); border-top-color: var(--text-main);
    border-radius: 50%; animation: spin 0.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .subtabs { display: flex; gap: 6px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
  .subtab { background: none; border: 0; padding: 10px 16px; font-size: 13px; font-weight: 600;
    color: var(--text-muted); border-bottom: 2px solid transparent; }
  .subtab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .subtab:hover { color: var(--text-main); }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">🛠</div>
    <h1>Wokker Admin</h1>
    <div class="sub">Вход в панель управления</div>
    <input class="login-input" id="login-login" type="text" placeholder="Логин (напр. adm01)"
           autocomplete="username" maxlength="5" style="text-transform: lowercase;">
    <input class="login-input" id="login-password" type="password" placeholder="Пароль"
           autocomplete="current-password">
    <div class="login-hint">Логин: 3 латинские буквы + 2 цифры (например, adm01)</div>
    <button class="login-btn" id="login-btn">Войти</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div id="app">
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-logo">🍜 Wokker <span class="badge">Admin</span></div>
      <nav id="nav">
        <button class="nav-item" data-sec="dashboard"><span class="ico">📊</span> Дашборд</button>
        <button class="nav-item" data-sec="users"><span class="ico">👥</span> Сотрудники</button>
        <button class="nav-item" data-sec="restaurants"><span class="ico">🏪</span> Рестораны</button>
        <button class="nav-item" data-sec="news"><span class="ico">📰</span> Новости</button>
        <button class="nav-item" data-sec="standards"><span class="ico">📚</span> Стандарты</button>
        <button class="nav-item" data-sec="faq"><span class="ico">❓</span> FAQ</button>
        <button class="nav-item" data-sec="positions"><span class="ico">💼</span> Должности</button>
        <button class="nav-item" data-sec="questions"><span class="ico">💬</span> Вопросы <span class="count" id="q-count" style="display:none;">0</span></button>
        <button class="nav-item" data-sec="reports"><span class="ico">📈</span> Отчёты</button>
        <button class="nav-item" data-sec="audit"><span class="ico">📜</span> История</button>
      </nav>
      <div class="sidebar-footer">
        <div class="who" id="admin-name">—</div>
        <div class="login-line" id="admin-login">—</div>
        <button id="change-password-btn">🔐 Сменить пароль</button>
        <button id="logout-btn" class="danger">🚪 Выйти</button>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <h2 id="page-title">Дашборд</h2>
        <div class="actions" id="page-actions"></div>
      </div>
      <div class="content" id="page-content"></div>
    </div>
  </div>
</div>

<div class="toast-container" id="toasts"></div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">—</h3>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<script>
/* ================== CONFIG ================== */
const TOKEN_KEY = 'wokker_admin_token';
const LOGIN_RE = /^[a-z]{3}\d{2}$/;
let ME = null;

const esc = s => (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);

function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }
function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
function clearToken() { localStorage.removeItem(TOKEN_KEY); }

function toast(text, type) {
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = text;
  $('toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; }, 2600);
  setTimeout(() => el.remove(), 3000);
}

async function api(path, body) {
  const payload = { webToken: getToken() };
  if (body && typeof body === 'object') Object.assign(payload, body);
  const res = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  if (res.status === 401 || res.status === 403) {
    clearToken();
    showLogin();
    throw new Error('unauthorized');
  }
  if (!res.ok) {
    let msg = 'error';
    try { const j = await res.json(); msg = j.error || msg; } catch (e) {}
    throw new Error(msg);
  }
  return res.json();
}

function fmtDate(iso, withTime) {
  if (!iso) return '—';
  try {
    const d = new Date(iso);
    const pad = n => String(n).padStart(2, '0');
    const date = `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`;
    if (!withTime) return date;
    return `${date} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  } catch (e) { return iso; }
}

/* ================== LOGIN ================== */
function showLogin() {
  $('app').style.display = 'none';
  $('login-screen').style.display = 'flex';
  $('login-error').textContent = '';
  $('login-login').value = '';
  $('login-password').value = '';
}
function showApp() {
  $('login-screen').style.display = 'none';
  $('app').style.display = 'block';
}

$('login-login').addEventListener('input', e => {
  e.target.value = e.target.value.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 5);
});

async function doLogin() {
  const login = $('login-login').value.trim().toLowerCase();
  const password = $('login-password').value;
  const errEl = $('login-error');
  errEl.textContent = '';
  if (!LOGIN_RE.test(login)) {
    errEl.textContent = 'Логин: 3 латинские буквы + 2 цифры';
    return;
  }
  if (!password) {
    errEl.textContent = 'Введите пароль';
    return;
  }
  const btn = $('login-btn');
  btn.disabled = true; btn.textContent = 'Проверяем…';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ login, password }),
    });
    if (res.status === 429) { errEl.textContent = 'Слишком много попыток. Подождите минуту.'; return; }
    if (res.status === 401) { errEl.textContent = 'Неверный логин или пароль'; return; }
    if (res.status === 403) { errEl.textContent = 'Аккаунт заблокирован'; return; }
    if (!res.ok) { errEl.textContent = 'Ошибка сервера'; return; }
    const data = await res.json();
    if (!data.is_admin) {
      errEl.textContent = 'Этот аккаунт не является администратором';
      return;
    }
    setToken(data.token);
    await checkAdminAndLoad();
  } catch (e) {
    errEl.textContent = 'Сеть недоступна';
  } finally {
    btn.disabled = false; btn.textContent = 'Войти';
  }
}

$('login-btn').addEventListener('click', doLogin);
$('login-password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
$('login-login').addEventListener('keydown', e => { if (e.key === 'Enter') $('login-password').focus(); });

async function checkAdminAndLoad() {
  try {
    const res = await api('/api/admin/me', {});
    ME = res.profile;
    $('admin-name').textContent = ME.full_name || '—';
    $('admin-login').textContent = '@' + (ME.login || '—');
    showApp();
    navigate('dashboard');
    refreshQuestionCount();
  } catch (e) {
    if (e.message === 'forbidden') {
      clearToken();
      showLogin();
      $('login-error').textContent = 'Доступ только для администратора';
    } else if (e.message !== 'unauthorized') {
      toast('Ошибка загрузки', 'error');
    }
  }
}

$('logout-btn').addEventListener('click', async () => {
  if (!confirm('Выйти из аккаунта?')) return;
  try { await api('/api/auth/logout', {}); } catch (e) {}
  clearToken();
  ME = null;
  showLogin();
});

$('change-password-btn').addEventListener('click', openChangePasswordModal);

/* ================== CHANGE PASSWORD ================== */
function openChangePasswordModal() {
  openModal('🔐 Сменить пароль', `
    <div class="form-group">
      <label>Текущий пароль</label>
      <input class="form-input" id="cp-old" type="password" autocomplete="current-password">
    </div>
    <div class="form-group">
      <label>Новый пароль</label>
      <input class="form-input" id="cp-new" type="password" autocomplete="new-password">
      <div class="form-hint">Минимум 6 символов</div>
    </div>
    <div class="form-group">
      <label>Повторите новый пароль</label>

  `, `

    <button class="btn primary" id="cp-save">Сохранить</button>
  `);
  $('cp-save').addEventListener('click', async () => {

    const newPass = $('cp-new').value;
    const newPass2 = $('cp-new2').value;
    const errEl = $('cp-error');
    errEl.textContent = '';
    if (!oldPass) { errEl.textContent = 'Введите текущий пароль'; return; }

      await api('/api/admin/change-password', { old_password: oldPass, new_password: newPass });

      closeModal();
    } catch (e) {
      if (e.message === 'wrong_password') errEl.textContent = 'Текущий пароль неверный';

          <td class="actions-cell">

              <tr><th>Логин</th><th>ФИО</th><th>Телефон</th><th>Должность</th>

          </table>
        </div>
      </div>
    `;

    const searchInput = $('users-search');
    let timer;
    searchInput.addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(() => loadUsers(searchInput.value.trim()), 400);
    });
    document.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      openUserEditor(parseInt(b.dataset.edit));
    }));
    document.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      deleteUser(parseInt(b.dataset.del));

    $('page-content').innerHTML = '<div class="empty">Ошибка загрузки пользователей</div>';

      <button class="btn primary" id="eu-save">Сохранить</button>
    `);

      const errEl = $('eu-error');

      if (newLogin && newLogin !== u.login) {

async function exportUsers() {
  try {
    const { csv } = await api('/api/admin/export/users', {});
    downloadCsv(csv, 'users.csv');
  } catch (e) { toast('Ошибка экспорта', 'error'); }
}

function downloadCsv(csv, filename) {
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

/* ================== NEWS ================== */
async function loadNews() {
  $('page-actions').innerHTML = '<button class="btn primary small" id="news-add-btn">+ Добавить</button>';
  $('news-add-btn').addEventListener('click', openNewsAdd);
  try {
    const data = await api('/api/admin/news', {});
    const news = data.news || [];
    const rows = news.map(n => {
      const lvl = n.level === 'urgent' ? '<span class="tag red">Срочно</span>'
        : n.level === 'important' ? '<span class="tag amber">Важно</span>'
        : '<span class="tag gray">Обычная</span>';
      const status = n.published ? '<span class="tag green">Опубликована</span>'
        : `<span class="tag blue">⏰ ${fmtDate(n.publish_at, true)}</span>`;
      return `
        <tr>
          <td>${lvl}</td>
          <td><b>${esc(n.title)}</b><br><span style="font-size:11px;color:var(--text-muted);">${esc((n.body||'').substring(0, 60))}${(n.body||'').length>60?'…':''}</span></td>
          <td>${status}</td>
          <td style="font-size:12px;color:var(--text-muted);">${fmtDate(n.created_at, true)}</td>
          <td class="actions-cell">
            <button class="icon-btn" data-title="${n.id}" title="Изменить заголовок">✏️</button>
            ${n.published ? `<button class="icon-btn danger" data-del="${n.id}" title="Удалить">🗑</button>` : ''}
          </td>
        </tr>
      `;
    }).join('');
    $('page-content').innerHTML = `
      <div class="table-card">
        <div class="table-wrap">
          <table>
            <thead><tr><th>Тип</th><th>Заголовок</th><th>Статус</th><th>Создано</th><th></th></tr></thead>
            <tbody>${rows || '<tr><td colspan="5"><div class="empty">Новостей нет</div></td></tr>'}</tbody>
          </table>
        </div>
      </div>
    `;
    document.querySelectorAll('[data-title]').forEach(b => b.addEventListener('click', () => openNewsEditTitle(parseInt(b.dataset.title), news)));
    document.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
      if (!confirm('Удалить новость?')) return;
      try { await api('/api/admin/news/delete', { id: parseInt(b.dataset.del) }); toast('Удалена', 'success'); loadNews(); }
      catch (e) { toast('Ошибка', 'error'); }
    }));
  } catch (e) {
    $('page-content').innerHTML = '<div class="empty">Ошибка загрузки</div>';
  }
}

/* ================== REPORTS ================== */
async function loadReports() {
  $('page-actions').innerHTML = `
    <button class="btn ghost small" id="exp-users">📤 CSV сотрудников</button>
    <button class="btn ghost small" id="exp-news">📤 CSV новостей</button>
  `;
  $('exp-users').addEventListener('click', exportUsers);
  $('exp-news').addEventListener('click', async () => {
    try { const { csv } = await api('/api/admin/export/news', {}); downloadCsv(csv, 'news.csv'); }
    catch (e) { toast('Ошибка', 'error'); }
  });
  try {
    const { report } = await api('/api/admin/reports', {});
    $('page-content').innerHTML = `
      <div class="stats-grid">
        <div class="stat-card"><div class="label">Всего</div><div class="value">${report.total}</div></div>
        <div class="stat-card green"><div class="label">Активных</div><div class="value">${report.active}</div></div>
        <div class="stat-card accent"><div class="label">Заблокировано</div><div class="value">${report.blocked}</div></div>
        <div class="stat-card"><div class="label">Новых за 7д</div><div class="value">${report.new7}</div></div>
        <div class="stat-card amber"><div class="label">Неактивных 7+</div><div class="value">${report.inactive7}</div></div>
      </div>
    `;
  } catch (e) { $('page-content').innerHTML = '<div class="empty">Ошибка</div>'; }
}

/* ================== AUDIT ================== */
async function loadAudit() {
  try {
    const data = await api('/api/admin/audit', {});
    const list = data.audit || [];
    const rows = list.map(a => `
      <tr>
        <td style="font-size:12px;color:var(--text-muted);white-space:nowrap;">${fmtDate(a.created_at, true)}</td>
        <td><code style="font-size:11px;">${esc(a.action)}</code></td>
        <td>${esc(a.target_type)}:${esc(a.target_id)}</td>
        <td style="font-size:12px;">${esc((a.details || '').substring(0, 80))}</td>
      </tr>
    `).join('');
    $('page-content').innerHTML = `
      <div class="table-card">
        <div class="table-wrap">
          <table>
            <thead><tr><th>Когда</th><th>Действие</th><th>Цель</th><th>Детали</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="4"><div class="empty">История пуста</div></td></tr>'}</tbody>
          </table>
        </div>
      </div>
    `;
  } catch (e) { $('page-content').innerHTML = '<div class="empty">Ошибка</div>'; }
}

/* ================== INIT ================== */
(async function init() {
  if (!getToken()) { showLogin(); return; }
  await checkAdminAndLoad();
})();
</script>
