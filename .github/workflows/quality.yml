name: Quality and security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.11 tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci_not_connected
      ADMIN_PASSWORD: ci-only-placeholder-not-used-for-login
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q app.py config.py db.py routes utils middleware tests
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Check shell script syntax
        run: bash -n scripts/backup_postgres.sh scripts/verify_restore_postgres.sh

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Audit installed dependencies
        run: |
          python -m pip install --upgrade 'setuptools>=84.1.0' pip-audit
          python -m pip_audit

  control-postgres:
    name: CONTROL PostgreSQL migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: control_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d control_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - name: Apply SQL migrations twice
        run: |
          for pass in 1 2; do
            for migration in database/*.sql; do
              psql -h localhost -U ci -d control_ci -v ON_ERROR_STOP=1 -f "$migration"
            done
          done
      - name: Verify notification schema
        run: |
          psql -h localhost -U ci -d control_ci -v ON_ERROR_STOP=1 -c "SELECT recipient_id, restaurant_key, event_kind, source_id, created_at, read_at FROM control_notifications LIMIT 0"
