<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wokker · Табель</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23F5F5F7'/%3E%3Ccircle cx='50' cy='50' r='42' fill='none' stroke='%23007AFF' stroke-width='8'/%3E%3Cpath d='M25 50 A 25 25 0 0 0 75 50' fill='none' stroke='%23007AFF' stroke-width='12' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#F5F5F7">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F5F7; --card-bg: #FFFFFF; --text-main: #1C1C1E; --text-muted: #8E8E93;
    --accent: #007AFF; --accent-soft: #E5F0FF; 
    --green: #34C759; --green-soft: #E8F8EB; 
    --red: #FF3B30; --red-soft: #FFEBEA;
    --amber: #FF9500; --amber-soft: #FFF8E1;
    --border: rgba(0,0,0,0.06); --font: 'Inter', sans-serif;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: var(--font); background: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; font-size: 13px; }
  
  /* HEADER */
  .header { background: #fff; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20; }
  .logo { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .btn-close { background: #F2F2F7; padding: 8px 16px; border-radius: 100px; font-weight: 600; color: var(--text-main); text-decoration: none; font-size: 13px; transition: background 0.2s; }
  .btn-close:hover { background: #E5E5EA; }
  
  /* TABS */
  .tabs { display: flex; gap: 8px; padding: 8px 20px; background: #fff; border-bottom: 1px solid var(--border); overflow-x: auto; z-index: 15; }
  .tab { background: none; border: none; padding: 8px 16px; font-weight: 600; font-size: 13px; color: var(--text-muted); border-radius: 100px; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
  .tab:hover { color: var(--text-main); }
  .tab.active { background: var(--accent-soft); color: var(--accent); }
  
  /* CONTENT */
  .content { padding: 16px; flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .section { display: none; height: 100%; }
  .section.active { display: flex; flex-direction: column; animation: fadeIn 0.3s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  
  /* TOOLBAR */
  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; background: #fff; padding: 10px 16px; border-radius: var(--radius); box-shadow: 0 4px 16px rgba(0,0,0,0.03); flex-shrink: 0; flex-wrap: wrap; gap: 12px; border: 1px solid var(--border); }
  
  .view-toggle { display: flex; background: #F2F2F7; border-radius: 100px; padding: 3px; }
  .view-toggle button { background: none; border: none; padding: 6px 16px; border-radius: 100px; font-weight: 600; font-size: 12px; color: var(--text-muted); cursor: pointer; transition: all 0.2s; }
  .view-toggle button.active { background: #fff; color: var(--text-main); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

  .month-selector { display: flex; align-items: center; gap: 12px; }
  .month-selector button { background: #F2F2F7; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
  .month-selector button:hover { background: #E5E5EA; }
  .month-title { font-size: 15px; font-weight: 700; min-width: 140px; text-align: center; }
  
  .toolbar-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .hint-text { font-size: 11px; color: var(--text-muted); margin-right: 4px; font-weight: 500; }
  .btn-tool { background: #F2F2F7; border: 1px solid transparent; padding: 8px 16px; border-radius: 100px; font-weight: 600; font-size: 12px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px; color: var(--text-main); }
  .btn-tool:hover { background: #E5E5EA; }
  .norm-badge { background:var(--amber-soft); color:#C77700; padding:8px 16px; border-radius:100px; font-weight:700; font-size:12px; }

  /* TABLE WRAPPER */
  .table-scroll { flex: 1; overflow: auto; background: #fff; border-radius: var(--radius); box-shadow: 0 4px 24px rgba(0,0,0,0.04); position: relative; max-height: calc(100vh - 180px); width: 100%; border: 1px solid var(--border); }
  
  /* Таблица на всю ширину */
  table { border-collapse: collapse; width: 100%; table-layout: fixed; }
  
  /* ЯЧЕЙКИ */
  th, td { border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); font-size: 12px; text-align: center; vertical-align: middle; }
  th:last-child, td:last-child { border-right: none; }
  tr:last-child td { border-bottom: none; }
  
  /* Заголовки */
  thead th { position: sticky; top: 0; background: #F9F9FB; z-index: 10; font-weight: 700; color: var(--text-muted); font-size: 10px; text-transform: uppercase; padding: 10px 2px; letter-spacing: 0.5px; }
  th.weekend { color: var(--red); }

  /* Колонка сотрудников */
  th.sticky-col, td.sticky-col { 
    position: sticky; left: 0; background: #fff; z-index: 5; text-align: left; 
    border-right: 2px solid var(--border); 
    padding: 8px 12px;
    white-space: normal;
    word-break: break-word;
    line-height: 1.3;
    width: 240px; /* Фиксированная ширина для имен */
    min-width: 240px;
    max-width: 240px;
  }
  thead th.sticky-col { z-index: 15; background: #F9F9FB; font-size: 10px; white-space: nowrap; }
  
  /* Заголовки групп (рестораны) */
  .rest-header td { background: #F5F5F7 !important; font-weight: 800; padding: 8px 12px; border-bottom: 1px solid var(--border); text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; color: var(--text-main); }
  .rest-header td.sticky-col { background: #F5F5F7 !important; color: var(--accent); }

  /* Инпуты внутри ячеек */
  .cell-input { width: 100%; border: 2px solid transparent; border-radius: 6px; text-align: center; font-weight: 600; font-size: 13px; background: transparent; transition: all 0.2s; outline: none; padding: 4px; }
  .cell-input:hover { background: #F2F2F7; }
  .cell-input:focus { background: #fff; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .cell-input.direct-input {
    width: 100%; height: 100%; min-height: 32px; border: 2px solid transparent;
    text-align: center; font-weight: 700; font-size: 13px;
    background: transparent; border-radius: 0; padding: 0;
  }
  .cell-input.direct-input:focus {
    background: #fff; border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent);
  }

  /* Колонка Часов */
  .col-total { font-weight: 800; background: #FAFCFF; width: 80px; font-size: 14px; color: var(--text-main); border-left: 1px solid var(--border); }

  /* НЕДЕЛЬНЫЙ РЕЖИМ: просто растягиваем таблицу на 100% */
  table.week-mode {
    width: 100%;
    margin: 0;
  }

  /* Индикатор сохранения */
  .save-indicator { position: fixed; bottom: 24px; right: 24px; background: var(--text-main); color: #fff; padding: 12px 24px; border-radius: 100px; font-weight: 600; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); opacity: 0; transform: translateY(10px); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none; z-index: 100; }
  .save-indicator.show { opacity: 1; transform: translateY(0); }

  .loader { text-align: center; padding: 40px; color: var(--text-muted); font-weight: 600; font-size: 14px; }

  /* SETTINGS & REPORTS */
  .settings-container { padding: 24px; background: #fff; border-radius: var(--radius); box-shadow: 0 4px 24px rgba(0,0,0,0.04); max-width: 600px; margin: 0 auto; width: 100%; border: 1px solid var(--border); }
  .settings-title { font-size: 18px; font-weight: 800; margin-bottom: 20px; }
  .setting-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .setting-row:last-child { border-bottom: none; }
  .setting-row span { font-weight: 600; font-size: 14px; }
  .setting-row input { width: 120px; text-align: right; padding: 8px 12px; border: 1px solid #E5E5EA; border-radius: 8px; font-size: 14px; outline: none; transition: all 0.2s; }
  .setting-row input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .btn-save-settings { width: 100%; background: var(--accent); color: #fff; border-radius: 12px; padding: 16px; font-size: 15px; font-weight: 700; margin-top: 24px; border: none; cursor: pointer; transition: background 0.2s; }
  .btn-save-settings:hover { background: #0062CC; }

  @media (max-width: 900px) {
    th.sticky-col, td.sticky-col { width: 180px; min-width: 180px; max-width: 180px; padding: 8px; }
    .cell-input.direct-input { min-height: 36px; font-size: 13px; }
    .col-total { width: 60px; font-size: 13px; }
    .hint-text { display: none; }
    .toolbar { padding: 12px; flex-direction: column; align-items: stretch; }
    .view-toggle, .month-selector { justify-content: center; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">⏱ Табель учёта</div>
  <a href="/" class="btn-close">← На портал</a>
</div>

<div class="tabs">
  <button class="tab active" data-sec="tab-sheet">Табель</button>
  <button class="tab" data-sec="tab-reports">Отчёты</button>
  <button class="tab" data-sec="tab-settings">Настройки</button>
</div>

<div class="content">
  <!-- ВКЛАДКА: ТАБЕЛЬ (МАТРИЦА) -->
  <div class="section active" id="tab-sheet">
    
    <div class="toolbar">
      <div class="view-toggle">
        <button class="active" onclick="setViewMode('month')">Месяц</button>
        <button onclick="setViewMode('week')">Неделя</button>
      </div>
      
      <div class="month-selector">
        <button onclick="changePeriod(-1)">←</button>
        <div class="month-title" id="current-period-title">Месяц</div>
        <button onclick="changePeriod(1)">→</button>
      </div>
      
      <div class="toolbar-actions">
        <div class="hint-text">В — отпуск, Б — больничный, Н — прогул</div>
        <div class="norm-badge" id="norm-label">Норма: - ч</div>
        <button class="btn-tool" onclick="fillWeekdays()">⚡ Заполнить будни</button>
      </div>
    </div>
    
    <div class="table-scroll" id="matrix-container">
      <div class="loader">Загрузка данных...</div>
    </div>
  </div>

  <!-- ВКЛАДКА: ОТЧЁТЫ -->
  <div class="section" id="tab-reports">
    <div class="toolbar">
      <div class="view-toggle" style="opacity: 0.5; pointer-events: none;">
        <button id="rep-view-month" class="active">Месяц</button>
        <button id="rep-view-week">Неделя</button>
      </div>
      <div class="month-selector">
        <button onclick="changePeriod(-1)">←</button>
        <div class="month-title" id="report-period-title">Месяц</div>
        <button onclick="changePeriod(1)">→</button>
      </div>
    </div>
    <div class="table-scroll">
      <table>
        <thead><tr><th class="sticky-col">Сотрудник</th><th>Должность</th><th>Часов</th><th>Ставка</th><th>К оплате (₽)</th></tr></thead>
        <tbody id="report-list">
          <tr><td colspan="5" class="loader">Загрузка...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- ВКЛАДКА: НАСТРОЙКИ -->
  <div class="section" id="tab-settings">
    <div class="settings-container">
      <div class="settings-title">Ставки по должностям</div>
      <div id="settings-list">
        <div class="loader">Загрузка...</div>
      </div>
      <button class="btn-save-settings" onclick="saveSettings()">Сохранить настройки</button>
    </div>
  </div>
</div>

<div class="save-indicator" id="save-indicator">✓ Сохранено</div>

<script>
const TOKEN_KEY = 'wokker_staff_token';
let CURRENT_DATE = new Date();
let CURRENT_MONTH = CURRENT_DATE.getMonth() + 1;
let CURRENT_YEAR = CURRENT_DATE.getFullYear();
let CURRENT_WEEK_START = getMonday(new Date());

let VIEW_MODE = 'month'; // 'month' | 'week'
let EMPLOYEES_DATA = [];
let SETTINGS_DATA = [];

const $ = id => document.getElementById(id);
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }

async function api(path, body) {
  const payload = { webToken: getToken() };
  if (body && typeof body === 'object') Object.assign(payload, body);
  const res = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  if (res.status === 401) { window.location.href = '/'; throw new Error('unauthorized'); }
  if (!res.ok) {
    let msg = 'error';
    try { const j = await res.json(); msg = j.error || msg; } catch (e) {}
    throw new Error(msg);
  }
  return res.json();
}

function showSaveIndicator() {
  const ind = $('save-indicator');
  ind.classList.add('show');
  setTimeout(() => ind.classList.remove('show'), 2000);
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    t.classList.add('active');
    $(t.dataset.sec).classList.add('active');
    
    if (t.dataset.sec === 'tab-sheet') loadMatrix();
    if (t.dataset.sec === 'tab-reports') loadReports();
    if (t.dataset.sec === 'tab-settings') loadSettings();
  });
});

function getMonday(d) {
  d = new Date(d);
  var day = d.getDay(),
      diff = d.getDate() - day + (day == 0 ? -6 : 1);
  return new Date(d.setDate(diff));
}

function formatDate(d) {
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

function formatDateShort(d) {
  const pad = n => String(n).padStart(2, '0');
  return `${pad(d.getDate())}.${pad(d.getMonth()+1)}`;
}

function getPeriodDates() {
  if (VIEW_MODE === 'month') {
    const start = new Date(CURRENT_YEAR, CURRENT_MONTH - 1, 1);
    const end = new Date(CURRENT_YEAR, CURRENT_MONTH, 0);
    return { start, end };
  } else {
    const start = new Date(CURRENT_WEEK_START);
    const end = new Date(CURRENT_WEEK_START.getTime() + 6 * 86400000);
    return { start, end };
  }
}

function calculateNorm(start, end) {
  let workDays = 0;
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    const dayOfWeek = d.getDay();
    if (dayOfWeek >= 1 && dayOfWeek <= 5) workDays++;
  }
  return workDays * 8;
}

function updatePeriodTitle() {
  const { start, end } = getPeriodDates();
  const months = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
  
  let title = '';
  if (VIEW_MODE === 'month') {
    title = `${months[CURRENT_MONTH - 1]} ${CURRENT_YEAR}`;
  } else {
    title = `${formatDateShort(start)} — ${formatDateShort(end)}`;
  }

  $('current-period-title').textContent = title;
  $('report-period-title').textContent = title;
  
  const norm = calculateNorm(start, end);
  $('norm-label').textContent = `Норма: ${norm} ч`;
}

function setViewMode(mode) {
  VIEW_MODE = mode;
  document.querySelectorAll('.view-toggle button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.view-toggle button')[mode === 'month' ? 0 : 1].classList.add('active');
  
  if (mode === 'week') {
    CURRENT_WEEK_START = getMonday(new Date(CURRENT_YEAR, CURRENT_MONTH - 1, 15));
  } else {
    CURRENT_MONTH = CURRENT_WEEK_START.getMonth() + 1;
    CURRENT_YEAR = CURRENT_WEEK_START.getFullYear();
  }

  updatePeriodTitle();
  loadMatrix();
}

function changePeriod(delta) {
  if (VIEW_MODE === 'month') {
    let m = CURRENT_MONTH + delta;
    let y = CURRENT_YEAR;
    if (m > 12) { m = 1; y++; }
    if (m < 1) { m = 12; y--; }
    CURRENT_MONTH = m;
    CURRENT_YEAR = y;
  } else {
    CURRENT_WEEK_START.setDate(CURRENT_WEEK_START.getDate() + delta * 7);
  }
  
  updatePeriodTitle();
  
  const activeSec = document.querySelector('.section.active').id;
  if (activeSec === 'tab-sheet') loadMatrix();
  if (activeSec === 'tab-reports') loadReports();
}

// ================== МАТРИЦА ТАБЕЛЯ ==================
async function loadMatrix() {
  $('matrix-container').innerHTML = '<div class="loader">Загрузка табеля...</div>';
  
  const { start, end } = getPeriodDates();
  const dateFrom = formatDate(start);
  const dateTo = formatDate(end);

  try {
    const res = await api('/api/timesheet/matrix', { date_from: dateFrom, date_to: dateTo });
    EMPLOYEES_DATA = res.employees || [];
    renderMatrix();
  } catch (e) {
    $('matrix-container').innerHTML = `<div class="loader" style="color:var(--red);">Ошибка: ${esc(e.message)}</div>`;
  }
}

function getCellDisplayValue(c) {
  if (c.s === 'vacation') return 'В';
  if (c.s === 'sick') return 'Б';
  if (c.s === 'absent') return 'Н';
  return c.h || '';
}

function renderMatrix() {
  if (!EMPLOYEES_DATA.length) {
    $('matrix-container').innerHTML = '<div class="loader">Нет сотрудников для отображения</div>';
    return;
  }

  const { start, end } = getPeriodDates();

  const grouped = {};
  EMPLOYEES_DATA.forEach(emp => {
    const rest = emp.restaurant_name || 'Без ресторана';
    if (!grouped[rest]) grouped[rest] = [];
    grouped[rest].push(emp);
  });

  let thead = `<thead><tr>
    <th class="sticky-col">Сотрудник</th>`;
  
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    const dayOfWeek = d.getDay();
    const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
    thead += `<th class="${isWeekend ? 'weekend' : ''}">${d.getDate()}<br><span style="font-size:9px;">${['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][dayOfWeek]}</span></th>`;
  }
  
  let dayCount = 0;
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) dayCount++;

  thead += `<th class="col-total">Часов</th>
            </tr></thead>`;

  let tbody = '<tbody>';
  
  for (const [restName, employees] of Object.entries(grouped)) {
    tbody += `<tr class="rest-header">
      <td class="sticky-col">📍 ${esc(restName)}</td>
      <td colspan="${dayCount + 1}"></td>
    </tr>`;

    employees.forEach(emp => {
      tbody += `<tr data-uid="${emp.user_id}">
        <td class="sticky-col" title="${esc(emp.full_name)}"><b>${esc(emp.full_name)}</b><br><span style="font-size:11px; color:var(--text-muted);">${esc(emp.position || '')}</span></td>`;
      
      let totalHours = 0;

      for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
        const dayNum = d.getDate();
        const cellData = emp.data[dayNum] || { h: '', s: 'work' };
        
        if (cellData.s === 'work') totalHours += parseFloat(cellData.h || 0);
        else if (cellData.s === 'vacation' || cellData.s === 'sick') totalHours += 8;

        tbody += `<td style="padding:0; background: ${cellData.s !== 'work' ? 'var(--bg)' : 'transparent'};">
          <input type="text" class="cell-input direct-input" 
                 data-uid="${emp.user_id}" data-day="${dayNum}"
                 value="${getCellDisplayValue(cellData)}"
                 title="В = отпуск, Б = больничный, Н = прогул"
                 onchange="saveCellDirect(this)"
                 onfocus="this.select()"
                 onkeydown="if(event.key==='Enter') this.blur()"
                 style="color: ${cellData.s !== 'work' ? 'var(--text-muted)' : 'var(--text-main)'};">
        </td>`;
      }
      
      tbody += `<td class="col-total total-hours">${totalHours}</td>
        </tr>`;
    });
  }
  tbody += '</tbody>';

  const isWeek = VIEW_MODE === 'week';
  $('matrix-container').innerHTML = `<table class="${isWeek ? 'week-mode' : ''}">${thead}${tbody}</table>`;
}

// ================== ПРЯМОЕ СОХРАНЕНИЕ ЯЧЕЙКИ ==================
async function saveCellDirect(inp) {
  const uid = parseInt(inp.dataset.uid);
  const day = parseInt(inp.dataset.day);
  let val = inp.value.trim().toUpperCase();
  
  let hours = 0;
  let status = 'work';

  if (val === 'В') { status = 'vacation'; hours = 8; inp.value = 'В'; }
  else if (val === 'Б') { status = 'sick'; hours = 8; inp.value = 'Б'; }
  else if (val === 'Н') { status = 'absent'; hours = 0; inp.value = 'Н'; }
  else if (val === '') { status = 'work'; hours = 0; inp.value = ''; }
  else { 
    status = 'work'; 
    hours = parseFloat(val.replace(',', '.')) || 0; 
    inp.value = hours || ''; 
  }

  const { start } = getPeriodDates();
  const targetDate = new Date(start.getFullYear(), start.getMonth(), day);
  if (day < start.getDate()) {
      targetDate.setMonth(targetDate.getMonth() + 1);
  }
  
  const dateStr = formatDate(targetDate);

  try {
    await api('/api/timesheet/save_cell', {
      user_id: uid,
      work_date: dateStr,
      hours: hours,
      status: status
    });
    
    const emp = EMPLOYEES_DATA.find(x => x.user_id === uid);
    if (emp) {
      emp.data[day] = { h: hours, s: status };
    }
    
    renderMatrix();
    showSaveIndicator();
  } catch (err) {
    alert('Ошибка сохранения: ' + err.message);
    renderMatrix();
  }
}

// ================== МАССОВОЕ ЗАПОЛНЕНИЕ ==================
async function fillWeekdays() {
  if (!confirm('Заполнить все будние дни в выбранном периоде по 8 часов?')) return;
  
  const { start, end } = getPeriodDates();
  const cellsToSave = [];
  
  EMPLOYEES_DATA.forEach(emp => {
    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
      const dayOfWeek = d.getDay();
      const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
      const dayNum = d.getDate();
      
      const cellData = emp.data[dayNum];
      if (!isWeekend && (!cellData || !cellData.h)) {
        cellsToSave.push({
          user_id: emp.user_id,
          work_date: formatDate(d),
          hours: 8,
          status: 'work'
        });
      }
    }
  });

  if (!cellsToSave.length) {
    alert('Все будние дни уже заполнены.');
    return;
  }

  const btn = event.target;
  btn.disabled = true;
  btn.textContent = 'Заполняем...';

  try {
    await api('/api/timesheet/bulk_save', { cells: cellsToSave });
    await loadMatrix();
    showSaveIndicator();
  } catch (e) {
    alert('Ошибка массового заполнения: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '⚡ Заполнить будни';
  }
}

// ================== ОТЧЕТЫ ==================
async function loadReports() {
  $('report-list').innerHTML = '<tr><td colspan="5" class="loader">Загрузка...</td></tr>';
  
  const { start, end } = getPeriodDates();
  const dateFrom = formatDate(start);
  const dateTo = formatDate(end);

  try {
    const res = await api('/api/timesheet/reports', { date_from: dateFrom, date_to: dateTo });
    const report = res.report || [];
    
    if (!report.length) {
      $('report-list').innerHTML = '<tr><td colspan="5" class="loader">Нет данных за этот период</td></tr>';
      return;
    }
    
    $('report-list').innerHTML = report.map(r => `
      <tr>
        <td class="sticky-col"><b>${esc(r.full_name)}</b></td>
        <td>${esc(r.position || '—')}</td>
        <td style="font-weight:700; color:var(--accent);">${r.total_hours} ч</td>
        <td>${r.payment_type === 'fixed' ? 'Оклад' : r.rate + ' ₽'}</td>
        <td style="font-weight:700; color:var(--green);">${(r.total_salary || 0).toLocaleString('ru-RU')} ₽</td>
      </tr>
    `).join('');
  } catch (e) {
    $('report-list').innerHTML = '<tr><td colspan="5" class="loader" style="color:var(--red);">Ошибка загрузки</td></tr>';
  }
}

// ================== НАСТРОЙКИ ==================
async function loadSettings() {
  $('settings-list').innerHTML = '<div class="loader">Загрузка...</div>';
  try {
    const res = await api('/api/timesheet/settings', {});
    SETTINGS_DATA = res.settings || [];
    
    if (!SETTINGS_DATA.length) {
      $('settings-list').innerHTML = '<div class="loader">У вас нет прав для просмотра настроек, либо нет доступных должностей.</div>';
      return;
    }

    $('settings-list').innerHTML = SETTINGS_DATA.map(s => `
      <div class="setting-row">
        <span>${esc(s.position_name)}</span>
        <input type="number" class="setting-input" data-pos="${esc(s.position_name)}" value="${s.rate}" min="0" step="10" placeholder="0 ₽">
      </div>
    `).join('');
  } catch (e) {
    $('settings-list').innerHTML = `<div class="loader" style="color:var(--red);">Ошибка: ${esc(e.message)}</div>`;
  }
}

async function saveSettings() {
  const inputs = document.querySelectorAll('.setting-input');
  if (!inputs.length) return;

  const btn = document.querySelector('.btn-save-settings');
  btn.disabled = true;
  btn.textContent = 'Сохранение...';

  try {
    for (const inp of inputs) {
      const posName = inp.dataset.pos;
      const rate = parseFloat(inp.value) || 0;
      await api('/api/timesheet/settings/save', { position_name: posName, rate });
    }
    showSaveIndicator();
  } catch (e) {
    alert('Ошибка сохранения: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Сохранить настройки';
  }
}

(async function init() {
  if (!getToken()) { window.location.href = '/'; return; }
  updatePeriodTitle();
  await loadMatrix();
})();
</script>
