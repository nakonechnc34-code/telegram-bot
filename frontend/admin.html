<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WOKKER · Admin</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2313131A'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-size='50' font-weight='800' fill='%23ff4444'%3EW%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin.css">
</head>
<body>
  <div class="orb orb--1"></div>
  <div class="orb orb--2"></div>

  <!-- LOGIN -->
  <div id="login-screen">
    <div class="login-card">
      <div class="login-logo">W</div>
      <h1>Wokker Admin</h1>
      <div class="sub">Вход в панель управления</div>
      <input class="login-input" id="login-login" type="text" placeholder="Логин" maxlength="5" style="text-transform: lowercase;" autocomplete="username">
      <input class="login-input" id="login-password" type="password" placeholder="Пароль" autocomplete="current-password">
      <button class="login-btn" id="login-btn">Войти</button>
      <div class="login-error" id="login-error"></div>
    </div>
  </div>

  <!-- APP -->
  <div id="app" style="display:none;">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <div class="sidebar__logo">W</div>
        <span class="sidebar__name">Wokker</span>
        <span class="sidebar__env">ADMIN</span>
      </div>
      <nav class="sidebar__nav">
        <div class="sidebar__section">Основное</div>
        <a class="nav-item nav-item--active" data-page="dashboard" href="#"><span class="nav-item__icon">◆</span> Дашборд</a>
        <a class="nav-item" data-page="users" href="#"><span class="nav-item__icon">👥</span> Сотрудники <span class="nav-item__badge">48</span></a>
        <a class="nav-item" data-page="timesheet" href="#"><span class="nav-item__icon">📋</span> Табель</a>
        <a class="nav-item" data-page="medbooks" href="#"><span class="nav-item__icon">📖</span> Медкнижки <span class="nav-item__badge">3</span></a>
        <a class="nav-item" data-page="payments" href="#"><span class="nav-item__icon">💰</span> Выплаты</a>
        <div class="sidebar__section">Контент</div>
        <a class="nav-item" data-page="news" href="#"><span class="nav-item__icon">📰</span> Новости <span class="nav-item__badge" id="news-pending-count" style="display:none;">0</span></a>
        <a class="nav-item" data-page="standards" href="#"><span class="nav-item__icon">📜</span> Стандарты</a>
        <a class="nav-item" data-page="academy" href="#"><span class="nav-item__icon">🎓</span> Академия</a>
        <a class="nav-item" data-page="faq" href="#"><span class="nav-item__icon">❓</span> FAQ</a>
        <div class="sidebar__section">Система</div>
        <a class="nav-item" data-page="restaurants" href="#"><span class="nav-item__icon">🍔</span> Рестораны</a>
        <a class="nav-item" data-page="settings" href="#"><span class="nav-item__icon">⚙️</span> Настройки</a>
      </nav>
      <div class="sidebar__user">
        <div class="sidebar__avatar">АДМ</div>
        <div class="sidebar__user-info">
          <div class="sidebar__uname" id="admin-name">—</div>
          <div class="sidebar__urole" id="admin-login">—</div>
        </div>
      </div>
    </aside>

    <div class="overlay" id="overlay"></div>

    <main class="main" id="main-content">
      <div class="header">
        <div style="display:flex;align-items:center;gap:14px;">
          <button class="hamburger" id="hamburger">☰</button>
          <div>
            <div class="header__title" id="page-title">Дашборд</div>
            <div class="header__date" id="page-date">Загрузка...</div>
          </div>
        </div>
        <div class="header__actions">
          <button class="btn btn--ghost" id="btn-export">↓ Экспорт</button>
          <button class="btn btn--accent" id="btn-add-user">+ Сотрудник</button>
        </div>
      </div>
      <div class="bento anim" id="page-content">
        <div class="loading">Загрузка...</div>
      </div>
    </main>
  </div>

  <div class="toast-container" id="toasts"></div>
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal-box">
      <div class="modal-header"><h3 id="modal-title">—</h3><button class="modal-close" id="modal-close">✕</button></div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

<script src="/admin.js"></script>
</body>
</html>
