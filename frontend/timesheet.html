<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Табель · Wokker</title>
  <style>
    body { margin: 0; font: 16px system-ui, sans-serif; color: #172033; background: #f4f6fa; }
    main { max-width: 1050px; margin: auto; padding: 24px; }
    header, .toolbar, form { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    header { justify-content: space-between; }
    section { background: white; padding: 16px; border: 1px solid #dce2ed; border-radius: 12px; margin-block: 16px; }
    label { display: inline-flex; align-items: center; gap: 6px; }
    input, select, button { font: inherit; padding: 6px 8px; max-width: 100%; }
    button { cursor: pointer; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e6eaf1; }
    .table { overflow: auto; }
    dialog { max-width: min(90vw, 500px); border: 1px solid #c5cedd; border-radius: 12px; }
    #edit-form label { flex: 1 1 100%; justify-content: space-between; }
    [role="status"] { white-space: pre-line; }
  </style>
  <script src="/timesheet.js" defer></script>
</head>
<body>
<main>
  <header><h1>Табель</h1><a href="/" id="back">На главную</a></header>
  <section class="toolbar" aria-label="Дата и экспорт">
    <label>Дата <input type="date" id="date" required></label>
    <button id="export" type="button">Скачать Excel</button>
  </section>
  <p id="status" role="status"></p>
  <section class="table">
    <table>
      <thead><tr><th>Сотрудник</th><th>Ресторан</th><th>Статус</th><th>Часы</th><th>Смена</th><th></th></tr></thead>
      <tbody id="employees"></tbody>
    </table>
  </section>
  <section>
    <form id="import-form">
      <label>Табель Excel <input type="file" name="file" accept=".xlsx" required></label>
      <label>Ресторан <select name="restaurant_key" id="import-restaurant"></select></label>
      <button type="submit">Импортировать</button>
    </form>
  </section>
  <dialog id="editor">
    <h2 id="employee-name"></h2>
    <form id="edit-form">
      <label>Статус <select name="status"></select></label>
      <label>Часы <input name="hours" type="number" min="0" max="24" step="0.01" required></label>
      <label>Начало <input name="start_time" type="time"></label>
      <label>Конец <input name="end_time" type="time"></label>
      <label>Ресторан <select name="restaurant_key" id="edit-restaurant"></select></label>
      <p id="edit-status" role="status"></p>
      <button type="submit">Сохранить</button>
      <button id="cancel" type="button">Отмена</button>
    </form>
  </dialog>
</main>
</body>
</html>
