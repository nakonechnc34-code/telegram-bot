meta:
  environment: python
  toolchain:
    name: pip
    version: '3.11'

build:
  # Правильное название параметра — requirementsPath
  requirementsPath: requirements.txt

run:
  # Подключаем постоянное хранилище (диск) для файлов
  persistenceMount: /data
  
  # Порт, на котором работает aiohttp (в вашем app.py установлен 8080)
  containerPort: 8080
  
  # Команда запуска
  command: python app.py
