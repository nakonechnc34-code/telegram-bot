      if (!confirm('Удалить?')) return;
      try {
        await api('/api/admin/faq/delete', { id: parseInt(b.dataset.del) });
        toast('Удалено', 'success');
        loadFaq();
      } catch (e) { toast('Ошибка: ' + e.message, 'error'); }
    }));
  }
}
function openFaqAdd() {
  openModal('Новый вопрос', `
    <div class="form-group"><label>Вопрос</label><textarea class="form-textarea" id="f-q" rows="2"></textarea></div>
    <div class="form-group"><label>Ответ</label><textarea class="form-textarea" id="f-a" rows="4"></textarea></div>
  `, `<button class="btn ghost" onclick="closeModal()">Отмена</button><button class="btn primary" id="create-faq-btn">Создать</button>`);
  $('create-faq-btn').addEventListener('click', async () => {
    try {
      await api('/api/admin/faq/add', { question: $('f-q').value.trim(), answer: $('f-a').value.trim() });
      toast('Создан', 'success');
      closeModal();
      loadFaq();
    } catch (e) { toast('Ошибка: ' + e.message, 'error'); }
  });
}
function openFaqEdit(id, list) {
  const f = list.find(x => x.id === id);
  if (!f) return;
  openModal('Редактирование', `
    <div class="form-group"><label>Вопрос</label><textarea class="form-textarea" id="fe-q" rows="2">${esc(f.question)}</textarea></div>
    <div class="form-group"><label>Ответ</label><textarea class="form-textarea" id="fe-a" rows="4">${esc(f.answer)}</textarea></div>
  `, `<button class="btn ghost" onclick="closeModal()">Отмена</button><button class="btn primary" id="save-faq-btn">Сохранить</button>`);
  $('save-faq-btn').addEventListener('click', async () => {
    try {
      await api('/api/admin/faq/update', { id, field: 'question', value: $('fe-q').value.trim() });
      await api('/api/admin/faq/update', { id, field: 'answer', value: $('fe-a').value.trim() });
      toast('Сохранено', 'success');
      closeModal();
      loadFaq();
    } catch (e) { toast('Ошибка: ' + e.message, 'error'); }
  });
}

async function loadPositions() {
  const canEdit = hasPerm('positions_edit');
  $('page-actions').innerHTML = canEdit ? '<button class="btn primary small" id="pos-add-btn">+ Добавить</button>' : '';
  if (canEdit) $('pos-add-btn').addEventListener('click', openPosAdd);
  const data = await api('/api/admin/positions', {});
  const active = data.positions.filter(p => !p.is_archived);
  const arch = data.positions.filter(p => p.is_archived);
  const rows = active.map(p => `
    <tr><td><b>${esc(p.name)}</b></td>
    <td class="actions-cell">${canEdit ? `<button class="icon-btn danger" data-arch="${p.id}">📦</button>` : '—'}</td></tr>`).join('');
  $('page-content').innerHTML = `
    <div class="table-card"><div class="table-wrap"><table>
      <thead><tr><th>Активные (${active.length})</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div></div>
    ${arch.length ? `<div class="table-card" style="margin-top:24px;"><div class="table-wrap"><table>
      <thead><tr><th>📦 Архив (${arch.length})</th></tr></thead>
      <tbody>${arch.map(p => `<tr><td style="color:var(--text-muted);text-decoration:line-through;">${esc(p.name)}</td></tr>`).join('')}</tbody>
    </table></div></div>` : ''}`;
  if (canEdit) {
    document.querySelectorAll('[data-arch]').forEach(b => b.addEventListener('click', async () => {
      if (!confirm('В архив?')) return;
      try {
        await api('/api/admin/position/archive', { id: parseInt(b.dataset.arch) });
        toast('В архиве', 'success');
        loadPositions();
      } catch (e) { toast('Ошибка: ' + e.message, 'error'); }
    }));
  }
}
function openPosAdd() {
  openModal('Новая должность', `
    <div class="form-group"><label>Название</label><input class="form-input" id="p-name" placeholder="Например: Стажёр"></div>
  `, `<button class="btn ghost" onclick="closeModal()">Отмена</button><button class="btn primary" id="create-pos-btn">Создать</button>`);
  $('create-pos-btn').addEventListener('click', async () => {
    try {
      await api('/api/admin/position/add', { name: $('p-name').value.trim() });
      toast('Создана', 'success');
      closeModal();
      loadPositions();
    } catch (e) {
      toast(e.message === 'duplicate' ? 'Такая должность уже есть' : 'Ошибка: ' + e.message, 'error');
    }
  });
}

async function loadQuestions() {
  const canReply = hasPerm('questions_reply');
  const data = await api('/api/admin/questions', {});
  const rows = data.questions.map(q => `
    <tr>
      <td><b>${esc(q.full_name || '—')}</b></td>
      <td>${q.replied ? '<span class="tag green">✅</span>' : '<span class="tag amber">❓</span>'}</td>
      <td style="font-size:12px;color:var(--text-muted);">${fmtDate(q.created_at, false)}</td>
      <td class="actions-cell">${!q.replied && canReply ? `<button class="icon-btn" data-reply="${q.id}">✍️</button>` : ''}</td>
    </tr>`).join('');
  $('page-content').innerHTML = `<div class="table-card"><div class="table-wrap"><table>
    <thead><tr><th>Кто</th><th>Статус</th><th>Когда</th><th></th></tr></thead>
    <tbody>${rows || '<tr><td colspan="4"><div class="empty">Вопросов нет</div></td></tr>'}</tbody></table></div></div>`;
  if (canReply) {
    document.querySelectorAll('[data-reply]').forEach(b => b.addEventListener('click', () => openReply(parseInt(b.dataset.reply), data.questions)));
  }
  refreshCounters();
}
function openReply(id, list) {
  const q = list.find(x => x.id === id);
  if (!q) return;
  openModal('Ответ на вопрос', `
    <div class="form-group"><label>Вопрос</label><div style="background:rgba(255,255,255,0.05);padding:16px;border-radius:12px;border:1px solid var(--border);color:#fff;line-height:1.5;">${esc(q.text)}</div></div>
    <div class="form-group"><label>Ответ</label><textarea class="form-textarea" id="reply-text" rows="4"></textarea></div>
  `, `<button class="btn ghost" onclick="closeModal()">Отмена</button><button class="btn primary" id="send-reply-btn">Сохранить</button>`);
  $('send-reply-btn').addEventListener('click', async () => {
    const text = $('reply-text').value.trim();
    if (!text) { toast('Введите текст', 'error'); return; }
    try {
      await api('/api/admin/question/reply', { id, text });
      toast('Сохранено', 'success');
      closeModal();
      loadQuestions();
    } catch (e) { toast('Ошибка: ' + e.message, 'error'); }
  });
}

async function loadReports() {
  const { report } = await api('/api/admin/reports', {});
  $('page-content').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="label">Всего</div><div class="value">${report.total}</div></div>
      <div class="stat-card green"><div class="label">Активных</div><div class="value">${report.active}</div></div>
      <div class="stat-card accent"><div class="label">Уволено</div><div class="value">${report.fired}</div></div>
      <div class="stat-card"><div class="label">Новых за 7д</div><div class="value">${report.new7}</div></div>
      <div class="stat-card amber"><div class="label">Неактивных 7+</div><div class="value">${report.inactive7}</div></div>
    </div>`;
}

async function loadAudit() {
  const data = await api('/api/admin/audit', {});
  const rows = data.audit.map(a => `
    <tr>
      <td style="font-size:11px;color:var(--text-muted);white-space:nowrap;">${fmtDate(a.created_at, true)}</td>
      <td><code style="font-size:11px;background:rgba(255,255,255,0.05);padding:4px 8px;border-radius:6px;">${esc(a.action)}</code></td>
      <td style="font-size:11px;color:var(--text-muted);">${esc(a.target_type || '')}:${esc(a.target_id || '')}</td>
    </tr>`).join('');
  $('page-content').innerHTML = `<div class="table-card"><div class="table-wrap"><table>
    <thead><tr><th>Когда</th><th>Действие</th><th>Цель</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="3"><div class="empty">История пуста</div></td></tr>'}</tbody></table></div></div>`;
}

/* ================== PWA ================== */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}

/* ================== INIT ================== */
(function init() {
  if (!getToken()) { showLogin(); return; }
  checkAdminAndLoad();
})();
</script>
</body>
</html>
