function exportErrors(){
 const cell=value=>'"'+String(value??'').replace(/^[=+\-@\t\r]/,"'$&").replace(/"/g,'""')+'"';
 const rows=[['Дата загрузки','Отчёт','Табельный номер','Сотрудник','Ресторан','Дата смены','Часы','Причина','Статус']];
 for(const {row:r,report:p} of visibleIssues())rows.push([stamp(p.uploaded),p.file.name,r.no,r.name,r.restaurant,date(r.day),nf.format((r.processed?r.minutes:r.declared)/60),types[r.type||r.lastType],status[r.status]]);
 const url=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(cell).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}));
 hrefDownload('Ошибки_табеля.csv',url);setTimeout(()=>URL.revokeObjectURL(url),5000);
}
function modal(title,html,options={}){
 const dialog=$('dialog');
 if(!dialog.open)dialogOrigin=document.activeElement;
 dialog.className=options.drawer?'drawer':'';
 dialog.innerHTML='<div class="panelhead"><h2 id="dialog-title">'+esc(title)+'</h2><button type="button" class="quiet" data-action="close" aria-label="Закрыть">'+ico('close')+'</button></div>'+html;
 dialogAction=options.submit;
 if(!dialog.open)dialog.showModal();
}
const close=()=>$('dialog').close();
$('dialog').addEventListener('close',()=>{if(dialogOrigin?.isConnected)dialogOrigin.focus();dialogAction=null;});
function confirmAction(title,detail,label,fn){
 modal(title,'<form><p>'+esc(detail)+'</p><div class="actions">'+button('Отмена','close')+'<button type="submit" class="danger">'+esc(label)+'</button></div></form>',{submit:fn});
}
function detail(report){
 if(!report)return;
 const s=summary(report.rows), rs=rstatus(report);
 const d=[['Автор',report.by],['Загружен',stamp(report.uploaded)],['Период',period(report.rows)],['Согласование',report.approved?'Утверждён HR':'Черновик'],['Сотрудников',s.people],['Ресторанов',s.restaurants]];
 const deletion=report.approved?'<p class="notice">'+ico('shield')+'Удаление утверждённого отчёта заблокировано.</p>':button('Удалить отчёт','delete',report.id,'danger');
 modal(report.file.name,badge(rs,reportStatus[rs])+'<dl class="details">'+d.map(([a,b])=>'<div><dt>'+esc(a)+'</dt><dd>'+esc(b)+'</dd></div>').join('')+'</dl>'+metrics([['Загружено',hours(s.minutes)],['Не обработано',hours(s.missing)],['Ошибок осталось',s.pending]])+'<div class="actions">'+button('Скачать исходный Excel','download',report.id,'primary','download')+(report.rows.some(r=>r.issue)?button('Открыть ошибки отчёта','report-errors',report.id):'')+deletion+'</div>',{drawer:true});
}
function processRows(list,process){
 let result;
 if(!list.some(x=>!x.row.processed)){toast('Нет необработанных строк для этой операции.','info');return;}
 if(mutate(()=>{result=recheck(list,process);audit(process?'Восстановление часов':'Повторная проверка',process?result.count+' строк · '+hours(result.minutes):result.ready+' строк готовы к обработке');})){
  selected.clear();render();toast(process?'Восстановлено '+hours(result.minutes)+' · строк: '+result.count+'.':'Готовы к обработке: '+result.ready+'.');
 }
}
function issueEdit(ids){
 const list=issues().filter(x=>ids.includes(x.row.id)&&!x.row.processed);
 if(!list.length)return;
 const row=list[0].row;
 const many=list.length>1;
 const common=field('Начало смены','<input type="time" name="start" required value="'+(many?'':esc(row.start))+'">')+field('Окончание смены','<input type="time" name="end" required value="'+(many?'':esc(row.end))+'">');
 modal(many?'Исправить выбранные смены':'Исправить смену', '<form><p class="muted">'+(many?'Один интервал будет применён к '+list.length+' выбранным строкам. Каждая строка пройдёт отдельную проверку.':esc(row.no+' · '+row.name+' · '+date(row.day)))+'</p>'+common+'<div class="actions"><button type="submit" class="primary">Сохранить исправление</button>'+button('Отмена','close')+'</div></form>',{submit:data=>{
  const start=data.get('start'),end=data.get('end');
  if(minute(end)<=minute(start)){showFormError('Окончание смены должно быть позже начала.');return;}
  if(mutate(()=>{list.forEach(({row:r})=>{r.start=start;r.end=end;r.edited=true;});recheck(list);audit('Исправлены интервалы',list.length+' строк · '+start+'–'+end);})){close();render();toast('Исправления сохранены. Готовые строки можно обработать.');}
 }});
}
function showFormError(text){
 const dialog=$('dialog');
 let line=dialog.querySelector('[role=alert]');
 if(!line){line=document.createElement('p');line.setAttribute('role','alert');line.className='notice danger';dialog.querySelector('form').prepend(line);}
 line.textContent=text;
}
const directory = kind => kind==='employees'?people:rests;
const directoryLabel = (kind,x) => x.name+(kind==='employees'?' · '+x.no+' · '+byId('restaurants',x.rest).name:'');
const directoryOptions = (kind,target='',query='') => options(directory(kind).filter(x=>x.id===target||norm(directoryLabel(kind,x)).includes(norm(query))).map(x=>[x.id,directoryLabel(kind,x)]),target,'Выберите из справочника');
function saveMaps(kind,records){
 return mutate(()=>{
  for(const {source,name,target} of records){
   const k=norm(source), prev=state.maps[kind][k];
   state.maps[kind]={...state.maps[kind],[k]:{source,name,target,updated:now()}};
   audit('Сохранено соответствие',source+' → '+byId(kind,target).name+(prev?' (обновлено)':''));
  }
  recheck(issues().filter(x=>records.some(r=>norm(r.source)===norm(identifier(kind,x.row)))));
 });
}
function mapDialog(kind,record){
 const isPeople=kind==='employees', locked=!!record;
 const suggestions=record?candidates(kind,record.source,record.name):[];
 modal(isPeople?'Сопоставить сотрудника':'Сопоставить ресторан','<form>'+
  field(isPeople?'Табельный номер из Excel':'Название из Excel','<input name="source" maxlength="100" required value="'+esc(record?.source)+'" '+(locked?'readonly':'')+'>')+
  (isPeople?field('Имя из Excel','<input name="name" maxlength="100" value="'+esc(record?.name)+'">'):'')+
  (suggestions.length?'<p class="notice">'+ico('info')+'<span>'+ (suggestions.length>1?'Несколько кандидатов. Проверьте и выберите соответствие.':'Предложение: '+esc(directoryLabel(kind,suggestions[0])))+'</span></p>':'')+
  field(isPeople?'Поиск по ФИО или табельному номеру':'Поиск по ресторану','<input type="search" data-directory="'+kind+'">')+
  field('Запись в системе','<select name="target" required>'+directoryOptions(kind,record?.target||'')+'</select>')+
  '<div class="actions"><button type="submit" class="primary">Сохранить соответствие</button>'+button('Отмена','close')+'</div></form>',{submit:data=>{
   const source=data.get('source').trim(),name=(data.get('name')||'').trim(),target=data.get('target');
   if(!source||!byId(kind,target)){showFormError('Укажите исходное значение и запись из справочника.');return;}
   if(!record&&Object.hasOwn(state.maps[kind],norm(source))){showFormError('Соответствие уже существует. Откройте его для редактирования.');return;}
   if(saveMaps(kind,[{source,name,target}])){close();render();toast('Соответствие сохранено. Связанные строки проверены.');}
  }});
}
function batchMap(kind){
 const pending=matchingEntries(kind).filter(m=>!byId(kind,m.target));
 if(!pending.length){toast('Нет соответствий, ожидающих подтверждения.','info');return;}
 modal('Массовое сопоставление','<form><p class="muted">Выберите записи, которые хотите подтвердить. Пустые поля будут пропущены.</p>'+pending.map((m,i)=>{
  const suggested=candidates(kind,m.source,m.name);
  return field(m.source+(m.name?' · '+m.name:'')+(suggested.length>1?' · несколько кандидатов':''),'<select name="m'+i+'">'+directoryOptions(kind)+'</select>');
 }).join('')+'<div class="actions"><button type="submit" class="primary">Подтвердить выбранные</button>'+button('Отмена','close')+'</div></form>',{submit:data=>{
  const records=pending.map((m,i)=>({...m,target:data.get('m'+i)})).filter(m=>byId(kind,m.target));
  if(!records.length){showFormError('Выберите хотя бы одно соответствие.');return;}
  if(saveMaps(kind,records)){close();render();toast('Подтверждено соответствий: '+records.length+'.');}
 }});
}
function go(next,section='errors',presets={}){
 page=next;tab=section;filters=presets;selected.clear();render();$('main').focus();window.scrollTo(0,0);
}
function newUpload(){run++;stage=0;draft=null;result=null;go('upload');}
function pickedReport(id){return state.reports.find(r=>r.id===id);}
const actions={
 page:value=>go(value),tab:value=>go('settings',value),new:newUpload,
 pick:()=>$('file').click(),replace:()=>$('file').click(),demo:()=>choose(null,true),save,close,
 detail:value=>detail(pickedReport(value)),download:value=>download(pickedReport(value)),
 'report-errors':value=>{if($('dialog').open)close();go('settings','errors',{report:value});},
 preview:()=>{
  if(!draft)return;
  const rows=plan(draft.rows).map(r=>[String(r.i),esc(r.no)+'<small>'+esc(r.name)+'</small>',esc(r.restaurant),date(r.day),esc(r.start+'–'+r.end),r.type?badge(r.status,types[r.type]):badge('done',hours(r.minutes))]);
  modal('Строки Excel',table(['Строка','Сотрудник','Ресторан','Дата','Интервал','Проверка'],rows),{drawer:true});
 },
 delete:value=>{
  const report=pickedReport(value);if(!report||report.approved)return;
  confirmAction('Удалить отчёт?','Будут удалены исходный файл, ошибки и только часы этого учебного отчёта. Запись об удалении останется в истории.','Удалить отчёт',()=>{
   const current=pickedReport(value);if(!current||current.approved)return;
   if(mutate(()=>{state.reports=state.reports.filter(r=>r.id!==value);audit('Удалён отчёт',current.file.name);})){close();if(result===value){newUpload();go('history');}else render();toast('Отчёт удалён.');}
  });
 },
 edit:value=>issueEdit([value]),batch:()=>issueEdit([...selected]),
 'issue-map':value=>{
  const item=issues().find(x=>x.row.id===value);if(!item)return;
  const kind=item.row.type==='employee'?'employees':'restaurants',source=identifier(kind,item.row);
  mapDialog(kind,{source,name:kind==='employees'?item.row.name:'',...state.maps[kind][norm(source)]});
 },
 map:value=>mapDialog(tab,value?matchingEntries(tab).find(r=>r.key===value):undefined),
 'map-batch':()=>batchMap(tab),
 'map-delete':value=>{
  const kind=tab,record=state.maps[kind][value];if(!record)return;
  confirmAction('Удалить соответствие?',record.source+' снова будет проверяться по справочнику при импорте и восстановлении.','Удалить соответствие',()=>{
   if(mutate(()=>{delete state.maps[kind][value];recheck(issues().filter(x=>norm(identifier(kind,x.row))===value));audit('Удалено соответствие',record.source);})){close();render();toast('Соответствие удалено.');}
  });
 },
 stale:()=>{const count=Object.values(state.maps[tab]).filter(m=>!byId(tab,m.target)).length;toast(count?'Устаревших соответствий: '+count+'. Они отмечены в таблице.':'Все подтверждённые записи есть в справочнике.',count?'info':'check');},
 related:()=>processRows(issues().filter(x=>state.maps[tab][norm(identifier(tab,x.row))]&&byId(tab,state.maps[tab][norm(identifier(tab,x.row))].target)),true),
 clear:()=>{filters={};selected.clear();render();},
 recheck:()=>processRows(selected.size?visibleIssues().filter(x=>selected.has(x.row.id)):visibleIssues(),false),
 'process-selected':()=>processRows(visibleIssues().filter(x=>selected.has(x.row.id)),true),
 'process-all':()=>processRows(issues().filter(x=>['ready','fixed'].includes(x.row.status)),true),
 'export-errors':exportErrors,
 reset:()=>confirmAction('Сбросить демонстрационные данные?','Созданные в этом браузере отчёты, сопоставления и журнал будут удалены.','Сбросить данные',()=>{
  const next=initial();
  if(commit(next)){close();newUpload();toast('Демонстрационные данные сброшены.');}
 })
};
function updateSelection(){
 const visible=visibleIssues().filter(x=>!x.row.processed);
 const all=document.querySelector('[data-all]');
 if(all){all.checked=visible.length>0&&visible.every(x=>selected.has(x.row.id));all.indeterminate=!all.checked&&visible.some(x=>selected.has(x.row.id));}
 document.querySelectorAll('[data-action=batch],[data-action=process-selected]').forEach(btn=>{btn.disabled=!selected.size;});
}
document.addEventListener('click',event=>{
 const target=event.target.closest('button[data-action]');
 if(target&&!target.disabled)actions[target.dataset.action]?.(target.dataset.value);
});
document.addEventListener('input',event=>{
 const control=event.target;
 if(control.dataset.filter==='q'){filters.q=control.value;selected.clear();refreshRecords();updateSelection();}
 if(control.dataset.directory){
  const select=$('dialog').querySelector('[name=target]');
  select.innerHTML=directoryOptions(control.dataset.directory,select.value,control.value);
 }
});
document.addEventListener('change',event=>{
 const v=event.target;
 if(v.id==='theme'){if(!mutate(()=>{state.theme=v.value;}))v.value=state.theme;document.documentElement.dataset.theme=state.theme;return;}
 if(v.id==='file'){if(v.files.length)choose(v.files[0]);v.value='';return;}
 if(v.dataset.filter&&v.dataset.filter!=='q'){filters[v.dataset.filter]=v.value;selected.clear();refreshRecords();updateSelection();return;}
 if(v.dataset.row){if(v.checked)selected.add(v.dataset.row);else selected.delete(v.dataset.row);updateSelection();return;}
 if(v.hasAttribute('data-all')){
  visibleIssues().filter(x=>!x.row.processed).forEach(x=>{if(v.checked)selected.add(x.row.id);else selected.delete(x.row.id);});
  document.querySelectorAll('[data-row]:not(:disabled)').forEach(b=>{b.checked=selected.has(b.dataset.row);});updateSelection();
 }
});
document.addEventListener('submit',event=>{
 event.preventDefault();
 const fields=new FormData(event.target);
 if(event.target.closest('dialog')){dialogAction?.(fields);return;}
 if(event.target.id==='prefs'&&mutate(()=>{state.options={round:Number(fields.get('round')),suggestions:fields.has('suggestions')};recheck(issues());audit('Изменены параметры импорта','Шаг округления: '+state.options.round+' мин.');})){render();toast('Параметры сохранены.');}
});
for(const type of ['dragenter','dragover','dragleave','drop'])document.addEventListener(type,event=>{
 const zone=event.target.closest('#drop');
 if(type==='dragover'||type==='drop')event.preventDefault();
 if(!zone)return;
 if(type==='dragenter'||type==='dragover'){zone.classList.add('over');return;}
 if(type==='dragleave'&&zone.contains(event.relatedTarget))return;
 zone.classList.remove('over');
 if(type==='drop'&&event.dataTransfer.files.length)choose(event.dataTransfer.files[0]);
});
$('brandIcon').innerHTML=ico('brand');
render();
</script>
</body>
</html>
