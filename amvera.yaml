meta:
  environment: python
  toolchain:
    name: pip
    version: '3.11'

build:
  requirements: requirements.txt

run:
  # Подключаем постоянное хранилище (диск)
  persistenceMount: /data
  
  # Порт, на котором работает aiohttp
  containerPort: 8080
  
  # Команда запуска
  command: python app.py
