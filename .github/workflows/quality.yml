name: Quality and security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.11 tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci_not_connected
      ADMIN_PASSWORD: ci-only-placeholder-not-used-for-login
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q app.py config.py db.py routes utils middleware tests
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Check shell script syntax
        run: bash -n scripts/backup_postgres.sh scripts/verify_restore_postgres.sh

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Audit installed dependencies
        run: |
          python -m pip install --upgrade 'setuptools>=84.1.0' pip-audit
          python -m pip_audit

  control-postgres:
    name: CONTROL PostgreSQL migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: control_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d control_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - name: Apply SQL migrations twice
        run: |
          for pass in 1 2; do
            for migration in database/*.sql; do
              psql -h localhost -U ci -d control_ci -v ON_ERROR_STOP=1 -f "$migration"
            done
          done
      - name: Verify notification schema
        run: |
          psql -h localhost -U ci -d control_ci -v ON_ERROR_STOP=1 -c "SELECT recipient_id, restaurant_key, event_kind, source_id, created_at, read_at FROM control_notifications LIMIT 0"
      - name: Verify notification constraints and persistence
        run: |
          psql -h localhost -U ci -d control_ci -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          INSERT INTO restaurants(key,name) VALUES ('ci-notification','CI');
          INSERT INTO users(user_id,full_name) VALUES (900001,'CI recipient'),(900002,'CI other');
          INSERT INTO control_notifications(recipient_id,restaurant_key,event_kind,source_id)
          VALUES (900001,'ci-notification','task_critical',1),(900002,'ci-notification','task_critical',1);
          INSERT INTO control_notifications(recipient_id,restaurant_key,event_kind,source_id)
          VALUES (900001,'ci-notification','task_critical',1) ON CONFLICT (recipient_id,event_kind,source_id) DO NOTHING;
          UPDATE control_notifications SET read_at=NOW() WHERE recipient_id=900001 AND read_at IS NULL;
          DO $$
          BEGIN
            IF (SELECT count(*) FROM control_notifications WHERE restaurant_key='ci-notification') <> 2
              OR (SELECT count(*) FROM control_notifications WHERE recipient_id=900001 AND read_at IS NOT NULL) <> 1
              OR (SELECT count(*) FROM control_notifications WHERE recipient_id=900002 AND read_at IS NULL) <> 1 THEN
              RAISE EXCEPTION 'Notification persistence or recipient isolation failed';
            END IF;
          END $$;
          ROLLBACK;
          SQL
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate actual notification generation SQL
        run: |
          python - <<'PY'
          import ast
          import subprocess
          from pathlib import Path
          tree = ast.parse(Path('routes/control.py').read_text())
          fn = next(n for n in tree.body if isinstance(n, ast.AsyncFunctionDef) and n.name == 'refresh_control_notifications')
          sql = next(n.value for n in ast.walk(fn) if isinstance(n, ast.Constant) and isinstance(n.value, str) and 'INSERT INTO control_notifications' in n.value)
          subprocess.run(['psql','-h','localhost','-U','ci','-d','control_ci','-v','ON_ERROR_STOP=1'], input='PREPARE notification_refresh(bigint,text[],boolean) AS '+sql+'; EXECUTE notification_refresh(900001,ARRAY[]::text[],FALSE); DEALLOCATE notification_refresh;', text=True, check=True)
          PY
      - name: Verify all six notification events on populated database
        run: |
          python - <<'PY'
          import ast
          import subprocess
          from pathlib import Path
          tree = ast.parse(Path('routes/control.py').read_text())
          fn = next(n for n in tree.body if isinstance(n, ast.AsyncFunctionDef) and n.name == 'refresh_control_notifications')
          sql = next(n.value for n in ast.walk(fn) if isinstance(n, ast.Constant) and isinstance(n.value, str) and 'INSERT INTO control_notifications' in n.value)
          fixture = """
          BEGIN;
          INSERT INTO restaurants(key,name) VALUES ('ci-a','A'),('ci-b','B');
          INSERT INTO users(user_id,full_name) VALUES (900001,'Recipient'),(900002,'Other');
          INSERT INTO control_templates(id,title,created_by) VALUES (900001,'Test',900001);
          INSERT INTO control_template_versions(id,template_id,version,definition) VALUES (900001,900001,1,'{}');
          INSERT INTO control_checks(id,restaurant_key,version_id,assigned_by,due_at) VALUES
          (900001,'ci-a',900001,900001,NOW()-INTERVAL '1 day'),(900002,'ci-b',900001,900002,NOW()-INTERVAL '1 day');
          INSERT INTO control_tasks(id,check_id,question_key,description,critical,assignee_id,due_at) VALUES
          (900001,900001,'q','Test',TRUE,900001,NOW()-INTERVAL '1 day');
          INSERT INTO control_equipment(id,restaurant_key,name,kind,unit,lower_limit,upper_limit,created_by)
          VALUES (900001,'ci-a','Test','temperature','C',2,6,900001);
          INSERT INTO control_readings(equipment_id,value,lower_limit,upper_limit,deviation,recorded_by)
          VALUES (900001,9,2,6,TRUE,900001);
          """
          assertions = """
          DO $verify$
          BEGIN
            IF (SELECT count(*) FROM control_notifications WHERE recipient_id=900001) <> 6
            OR (SELECT count(DISTINCT event_kind) FROM control_notifications WHERE recipient_id=900001) <> 6
            OR EXISTS (SELECT 1 FROM control_notifications WHERE restaurant_key='ci-b' OR recipient_id<>900001)
            THEN RAISE EXCEPTION 'Notification generation or scope failed'; END IF;
          END $verify$;
          ROLLBACK;
          """
          subprocess.run(['psql','-h','localhost','-U','ci','-d','control_ci','-v','ON_ERROR_STOP=1'],input=fixture+'PREPARE refresh_events(bigint,text[],boolean) AS '+sql+"; EXECUTE refresh_events(900001,ARRAY['ci-a'],FALSE); EXECUTE refresh_events(900001,ARRAY['ci-a'],FALSE); "+assertions,text=True,check=True)
          PY
