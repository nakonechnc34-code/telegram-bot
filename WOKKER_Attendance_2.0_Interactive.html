  (!filters.company||a.companies.has(filters.company))&&(!filters.debt||filters.debt==='open'&&a.due>0||filters.debt==='reserved'&&a.reserved>0||filters.debt==='closed'&&a.balance===0));
 const compare={due:(a,b)=>b.due-a.due,accrued:(a,b)=>b.accrued-a.accrued,name:(a,b)=>employeeLabel(a.employee).localeCompare(employeeLabel(b.employee),'ru')};
 return list.sort(compare[filters.sort]||compare.name);
}

const companyChoices=()=>W().companies.map(c=>[c.id,c.name]);
const extraName=e=>e.kindLabel;
const extraViewStatus=e=>{
 if(e.status!=='approved')return e.status;
 const a=accounts().find(x=>x.key===accountKey(e.employee,e.rest,e.month));
 if(!a)return 'approved';
 const earlier=ownedExtras().filter(x=>x.status==='approved'&&x.employee===e.employee&&x.rest===e.rest&&x.month===e.month&&
   (x.approvalAt<e.approvalAt||x.approvalAt===e.approvalAt&&x.id<e.id));
 const threshold=a.earned+sum(earlier,x=>x.cents)+e.cents;
 return a.paid>=threshold?'paid':a.paid+a.reserved>=threshold?'planned':'approved';
};

function buildRegistryPreview(data,keys){
 const c=W().companies.find(x=>x.id===data.get('company')&&x.active);
 const version=activeVersion(c,today()), day=data.get('date'),mode=data.get('formula');
 if(!c||!version||!day||!Object.hasOwn(formulaLabels,mode))return null;
 const list=accounts();
 const rows=keys.map((key,i)=>{
  const a=list.find(x=>x.key===key),cents=intMoney(data.get('p'+i));
  return a&&cents!==null&&cents<=a.due?{key,employee:a.employee,rest:a.rest,month:a.month,cents,hourlyRate:W().rates[a.employee]??null,due:a.due,balance:a.balance,accrued:a.accrued,calculated:calcRatio(cents,version.value,mode)}:null;
 });
 if(rows.some(x=>!x)||!rows.some(x=>x.cents))return null;
 return {company:{id:c.id,name:c.name,coefficient:version.value,effective:version.from},date:day,mode,lines:rows.filter(x=>x.cents>0),comment:data.get('comment').trim()};
}

const missingHourlyRate='Не указана почасовая ставка';
const paymentHourFormat=new Intl.NumberFormat('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});
function paymentHourRows(lines){
 return lines.map(line=>{
  const rate=line.hourlyRate;
  return {...line,hourEquivalent:Number.isSafeInteger(rate)&&rate>0?line.cents/rate:null};
 });
}
function paymentHourTotals(rows){
 const valid=rows.filter(r=>r.hourEquivalent!==null);
 return {hours:valid.length?sum(valid,r=>r.hourEquivalent):null,missing:rows.length-valid.length};
}
function paymentHourSummary({hours,missing}){
 return (hours===null?'—':paymentHourFormat.format(hours)+' ч')+
  (missing?' · без расчёта строк: '+missing:'');
}

function registryTransition(value){
 const [id,target]=value.split('|');
 const r=W().registers.find(x=>x.id===id);
 const allowed=()=>admin()&&r&&(['paid','cancelled'].includes(target)?r.status==='planned':target==='reversed'&&r.status==='paid');
 if(!allowed())return;
 const title={paid:'Подтвердить фактическую выплату',cancelled:'Отменить резервирование',reversed:'Сторнировать выплату'}[target];
 const reason=target!=='paid';
 modal(title,'<form><p>'+esc(r.number+' · '+money(sum(r.lines,l=>l.cents)))+'</p>'+
  (target==='paid'?field('Фактическая дата выплаты','<input name="actual" type="date" required value="'+esc(r.date)+'">')+'<p class="dashboardnote">Укажите дату уже состоявшейся выплаты. Эта операция фиксирует факт в учебной истории.</p>':
  '<p class="dashboardnote">'+(target==='cancelled'?'Зарезервированные суммы снова станут доступны.':'Будет сохранена запись сторно с основанием. Сумма вернётся в доступный остаток, прежняя операция останется в истории.')+'</p>')+
  field(reason?'Причина (обязательно)':'Комментарий','<textarea name="comment" maxlength="400" '+(reason?'required':'')+'></textarea>')+
  '<div class="actions"><button type="submit" class="primary">Подтвердить</button>'+button('Отмена','close')+'</div></form>',{submit:d=>{
   if(!allowed())return;
   const comment=d.get('comment').trim(),actual=d.get('actual');
   if(reason&&!comment||target==='paid'&&(!actual||actual>today())){showFormError(reason?'Укажите основание.':'Фактическая дата должна быть сегодня или раньше.');return;}
   if(mutate(()=>{
    const at=now();r.status=target;
    if(target==='paid'){r.actual=actual;r.confirmedBy=actor();r.confirmedAt=at;}
    if(target==='reversed')W().adjustments.unshift({id:uid(),register:id,cents:-sum(r.lines,l=>l.cents),at,by:actor(),reason:comment});
    r.events.push({at,by:actor(),label:regLabels[target],comment});
    audit(regLabels[target]+' реестр',r.number+' · '+money(sum(r.lines,l=>l.cents))+(comment?' · '+comment:''));
   })){close();render();toast('Статус реестра обновлён.');}
 }});
}

 const from=filters.from,to=filters.to;
 if(from&&to&&from>to){toast('Дата начала должна предшествовать дате окончания.','alert');return;}
 const balances=filters.report==='balances'&&admin();
 let title='Отработанное время',headers=['Сотрудник','Ресторан','Часы'],rows=[];
 if(balances){
  title='Остатки и выплаты';headers=['Сотрудник','Ресторан','Начислено','Выплачено','Резерв','Доступно'];
  rows=filteredAccounts().filter(a=>(!from||a.month>=from.slice(0,7))&&(!to||a.month<=to.slice(0,7))).map(a=>[employeeLabel(a.employee),restaurantName(a.rest),money(a.accrued),money(a.paid),money(a.reserved),money(a.due)]);
 }else{
  const grouped=new Map();
  const companyAccounts=filters.company?accounts().filter(a=>a.companies.has(filters.company)):[];
  for(const x of actualShifts().filter(x=>(from||to?(!from||x.day>=from)&&(!to||x.day<=to):x.day.startsWith(month))&&
   (!filters.company||companyAccounts.some(a=>a.employee===x.employee&&a.rest===x.rest&&x.day.startsWith(a.month)))&&locationMatch(x.rest)&&(!filters.find||norm(title).includes(norm(filters.find))||matchesPerson(x.employee,filters.find)))){
   const k=x.employee+'|'+x.rest;grouped.set(k,(grouped.get(k)||0)+x.minutes);
  }
  rows=[...grouped].map(([k,n])=>{const [id,r]=k.split('|');return [employeeLabel(id),restaurantName(r),hours(n)];});
 }
 generatedReport={title,month,period:from||to?[from?date(from):'…',to?date(to):'…'].join(' — '):monthLabel(month),headers,rows};render();
}
// OOXML with stored ZIP entries. String cells remain literal text in Excel.
const xml=value=>esc(String(value).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,''));
const utf=new TextEncoder();
function crc32(bytes){
 let crc=-1;
 for(const b of bytes){crc^=b;for(let i=0;i<8;i++)crc=(crc>>>1)^(crc&1?0xedb88320:0);}
 return (crc^-1)>>>0;
}
function zip(parts){
 const files=[],catalog=[];let offset=0,central=0;
 for(const [path,body] of parts){
  const n=utf.encode(path),b=utf.encode(body),crc=crc32(b);
  const local=new Uint8Array(30),ld=new DataView(local.buffer);
  ld.setUint32(0,0x04034b50,true);ld.setUint16(4,20,true);ld.setUint32(14,crc,true);ld.setUint32(18,b.length,true);ld.setUint32(22,b.length,true);ld.setUint16(26,n.length,true);
  const record=new Uint8Array(46),rd=new DataView(record.buffer);
  rd.setUint32(0,0x02014b50,true);rd.setUint16(4,20,true);rd.setUint16(6,20,true);rd.setUint32(16,crc,true);rd.setUint32(20,b.length,true);rd.setUint32(24,b.length,true);rd.setUint16(28,n.length,true);rd.setUint32(42,offset,true);
  files.push(local,n,b);catalog.push(record,n);offset+=local.length+n.length+b.length;central+=record.length+n.length;
 }
 const end=new Uint8Array(22),ed=new DataView(end.buffer);
 ed.setUint32(0,0x06054b50,true);ed.setUint16(8,parts.length,true);ed.setUint16(10,parts.length,true);ed.setUint32(12,central,true);ed.setUint32(16,offset,true);
 return new Blob([...files,...catalog,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function sheetRows(rows,styleFor=()=>0,heights={}){
 return rows.map((row,r)=>'<row r="'+(r+1)+'"'+(heights[r]?' ht="'+heights[r]+'" customHeight="1"':'')+'>'+row.map((value,c)=>{
  const style=styleFor(r,c);
  const ref=String.fromCharCode(65+c)+(r+1);
  const attrs=' r="'+ref+'"'+(style?' s="'+style+'"':'');
  if(value===null)return '<c'+attrs+'/>';
  if(typeof value==='number')return '<c'+attrs+'><v>'+value+'</v></c>';
  return '<c'+attrs+' t="inlineStr"><is><t xml:space="preserve">'+xml(value)+'</t></is></c>';
 }).join('')+'</row>').join('');
}
const spreadsheetNs='http://schemas.openxmlformats.org';
function xlsx(label,headers,rows,extraSheet){
 const ns=spreadsheetNs;
 const sheets=[{name:'Отчёт',xml:'<worksheet xmlns="'+ns+'/spreadsheetml/2006/main"><sheetData>'+sheetRows([headers,...rows])+'</sheetData></worksheet>'}];
 if(extraSheet)sheets.push(extraSheet);
 const overrides=sheets.map((_,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('');
 const definitions=sheets.map((s,i)=>'<sheet name="'+xml(s.name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('');
 const links=sheets.map((_,i)=>'<Relationship Id="rId'+(i+1)+'" Type="'+ns+'/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('');
 const styleOverride=extraSheet?'<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>':'';
 const styleLink=extraSheet?'<Relationship Id="rIdStyles" Type="'+ns+'/officeDocument/2006/relationships/styles" Target="styles.xml"/>':'';
 const parts=[
  ['[Content_Types].xml','<Types xmlns="'+ns+'/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+overrides+styleOverride+'</Types>'],
  ['_rels/.rels','<Relationships xmlns="'+ns+'/package/2006/relationships"><Relationship Id="rId1" Type="'+ns+'/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
  ['xl/workbook.xml','<workbook xmlns="'+ns+'/spreadsheetml/2006/main" xmlns:r="'+ns+'/officeDocument/2006/relationships"><sheets>'+definitions+'</sheets></workbook>'],
  ['xl/_rels/workbook.xml.rels','<Relationships xmlns="'+ns+'/package/2006/relationships">'+links+styleLink+'</Relationships>'],
  ...sheets.map((s,i)=>['xl/worksheets/sheet'+(i+1)+'.xml',s.xml])
 ];
 if(extraSheet)parts.push(['xl/styles.xml',extraSheet.styles]);
 const url=URL.createObjectURL(zip(parts));hrefDownload(label+'.xlsx',url);setTimeout(()=>URL.revokeObjectURL(url),4000);
}
const payoutHoursStyles='<styleSheet xmlns="'+spreadsheetNs+'/spreadsheetml/2006/main">'+
 '<numFmts count="4"><numFmt numFmtId="164" formatCode="#,##0.00"/><numFmt numFmtId="165" formatCode="dd.mm.yyyy"/><numFmt numFmtId="166" formatCode="mm.yyyy"/><numFmt numFmtId="167" formatCode="0.00"/></numFmts>'+

 '<fills count="6"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>'+
 [['172A24'],['12664E'],['EAF4ED'],['FFF0D6']].map(([rgb])=>'<fill><patternFill patternType="solid"><fgColor rgb="FF'+rgb+'"/><bgColor indexed="64"/></patternFill></fill>').join('')+'</fills>'+
 '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'+
 '<cellXfs count="11">'+[[0,0,0],[1,2,0],[2,3,0],[0,0,164],[0,0,167],[3,4,0],[3,4,164],[3,4,167],[0,0,165],[0,0,166],[4,5,0]].map(([font,fill,num])=>'<xf numFmtId="'+num+'" fontId="'+font+'" fillId="'+fill+'" borderId="0" xfId="0" applyFont="1" applyFill="1" applyNumberFormat="1"/>').join('')+'</cellXfs>'+
 '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
const excelDay=iso=>iso?Date.parse(iso+'T00:00:00Z')/86400000+25569:null;
function payoutHoursSheet(registry){
 const rows=paymentHourRows(registry.lines), totals=paymentHourTotals(rows);
 const day=excelDay(registry.actual||registry.date);
 const head=['№','Табельный номер','ФИО сотрудника','Территория','Ресторан','Должность','Расчётный период','Дата выплаты','Компания выплаты','Почасовая ставка, ₽','Общая сумма выплаты, ₽','Выплата часами'];
 const data=[
  ['WOKKER · Выплаты часами'],
  ['Реестр',registry.number,'Компания',registry.company.name],
  [registry.actual?'Дата выплаты':'Плановая дата',day],
  head,
  ...rows.map((l,i)=>{
   const employee=byId('employees',l.employee);
   return [i+1,employee?.no||'—',employeeLabel(l.employee),territoryOf(l.rest),restaurantName(l.rest),employee?.position||'—',excelDay(l.month+'-01'),day,registry.company.name,
    Number.isSafeInteger(l.hourlyRate)?l.hourlyRate/100:null,l.cents/100,l.hourEquivalent??missingHourlyRate];
  }),
  ['Итого',new Set(rows.map(l=>l.employee)).size,'Количество сотрудников','','','','','','','',sum(rows,l=>l.cents)/100,totals.hours]
 ];
 if(totals.missing)data.push(['Часы подсчитаны по строкам с действительной ставкой. Строк без расчёта: '+totals.missing]);
 const totalRow=4+rows.length;
 const styles=(r,c)=>{
  if(r===0)return 1;
  if(r===2&&c===1)return 8;
  if(r===3)return 2;
  if(r===totalRow)return c===10?6:c===11?7:5;
  if(r>totalRow)return 10;
  if(r<4)return 0;
  if(c===6)return 9;
  if(c===7)return 8;
  if(c===9||c===10)return 3;
  if(c===11)return rows[r-4].hourEquivalent===null?10:4;
  return 0;
 };
 const cols=[8,21,28,17,23,23,22,19,30,25,28,37].map((w,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>').join('');
 const merges=['A1:L1','D2:L2'];
 if(totals.missing)merges.push('A'+data.length+':L'+data.length);
 const merge='<mergeCells count="'+merges.length+'">'+merges.map(ref=>'<mergeCell ref="'+ref+'"/>').join('')+'</mergeCells>';
 return {name:'Выплаты часами',styles:payoutHoursStyles,xml:'<worksheet xmlns="'+spreadsheetNs+'/spreadsheetml/2006/main">'+
  '<sheetViews><sheetView workbookViewId="0"><pane ySplit="4" topLeftCell="A5" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>'+
  '<cols>'+cols+'</cols><sheetData>'+sheetRows(data,styles,{0:28,3:23,[totalRow]:21})+'</sheetData><autoFilter ref="A4:L'+(4+rows.length)+'"/>'+merge+'</worksheet>'};
}

function updateViewFilter(input){
 filters[input.dataset.view]=input.value;
 if(input.dataset.view==='month')filters.anchor='1';
 generatedReport=null;chosenPay.clear();
 const cursor=input.type==='search'?input.selectionStart:null;
 render();
 const next=document.querySelector('[data-view="'+input.dataset.view+'"]');
 if(next){next.focus({preventScroll:true});if(cursor!==null)next.setSelectionRange(cursor,cursor);}
}
document.addEventListener('input',e=>{
 if(e.target.matches('input[type=search][data-view]'))updateViewFilter(e.target);
});
document.addEventListener('change',e=>{
 const v=e.target;
 if(v.dataset.view&&v.type!=='search')updateViewFilter(v);
 if(v.id==='registryUnit'){
