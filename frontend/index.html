<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wokker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --blue: #ff2d55; --bg: #f2f2f7; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, sans-serif; background: var(--bg); padding-bottom: 70px; }
  h1 { font-size: 22px; padding: 16px; }
  .card { background: #fff; border-radius: 14px; margin: 0 12px 12px; padding: 14px; }
  .card b { display: block; margin-bottom: 6px; }
  .muted { color: #8e8e93; font-size: 14px; }
  .btn { display: inline-block; background: var(--blue); color: #fff; border: 0;
         border-radius: 10px; padding: 10px 16px; font-size: 15px; margin-top: 8px; }
  .tabs { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: #fff;
          border-top: 1px solid #e5e5ea; }
  .tabs button { flex: 1; border: 0; background: none; padding: 12px 2px; font-size: 11px; color: #8e8e93; }
  .tabs button.active { color: var(--blue); font-weight: 600; }
  .tabs span { display: block; font-size: 20px; }
  .section { display: none; }
  .section.active { display: block; }
  .q { width: 100%; border: 1px solid #e5e5ea; border-radius: 10px; padding: 10px; font-size: 15px; }
  details { background: #fff; border-radius: 14px; margin: 0 12px 10px; padding: 14px; }
  summary { font-weight: 600; cursor: pointer; }
  details p { margin-top: 8px; color: #3a3a3c; }

  /* ===== Профиль ===== */
  .profile-card {
    background: #fff; border-radius: 18px; margin: 0 12px 12px;
    overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,.07);
  }
  .profile-header {
    background: linear-gradient(135deg, #ff2d55, #ff6a3d);
    color: #fff; padding: 24px 16px 18px; text-align: center;
  }
  .avatar {
    width: 74px; height: 74px; border-radius: 50%; margin: 0 auto 10px;
    background: rgba(255,255,255,.25); background-size: cover; background-position: center;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 700; color: #fff;
  }
  .p-name { font-size: 19px; font-weight: 700; line-height: 1.25; }
  .p-pos { font-size: 13px; opacity: .92; margin-top: 3px; }
  .badge {
    display: inline-block; margin-top: 10px; padding: 4px 14px;
    background: rgba(255,255,255,.28); border-radius: 20px; font-size: 12px; font-weight: 600;
  }
  .badge.blocked { background: #ff3b30; }
  .info-list { padding: 4px 14px 10px; }
  .info-row {
    display: flex; align-items: center; padding: 11px 2px;
    border-bottom: 1px solid #f0f0f4; font-size: 15px;
  }
  .info-row:last-child { border-bottom: 0; }
  .info-row .ico { width: 28px; font-size: 16px; }
  .info-row .lbl { color: #8e8e93; flex: 1; }
  .info-row .val { font-weight: 600; text-align: right; max-width: 62%; overflow-wrap: break-word; }
  .profile-footer { background: #f8f8fb; padding: 10px 14px; font-size: 12px; color: #8e8e93; }

  /* ===== Уровни новостей ===== */
  .news-date { color: #8e8e93; font-size: 12px; margin-top: 4px; }
  .level-urgent { border-left: 3px solid #ff3b30; padding-left: 8px; }
  .level-urgent b::before { content: "🔴 "; }
  .level-important { border-left: 3px solid #ff9500; padding-left: 8px; }
  .level-important b::before { content: "🟡 "; }
  .level-normal b::before { content: "🔵 "; }
</style>
</head>
<body>
<h1>📱 Wokker</h1>

<div class="section" id="sec-profile">
  <div id="profile-box">Загрузка профиля…</div>
</div>

<div class="section" id="sec-restaurants">
  <div id="restaurants-list"></div>
</div>

<div class="section" id="sec-news">
  <div id="news-list"></div>
</div>

<div class="section" id="sec-standards">
  <div id="standards-list"></div>
</div>

<div class="section" id="sec-faq">
  <div id="faq-list"></div>
  <div class="card">
    <b>Задать свой вопрос</b>
    <input class="q" id="question-input" placeholder="Опиши вопрос — ответ придёт в бот">
    <button class="btn" id="send-question">Отправить</button>
  </div>
</div>

<nav class="tabs">
  <button data-sec="sec-profile" class="active"><span>👤</span>Профиль</button>
  <button data-sec="sec-restaurants"><span>🏙️</span>Рестораны</button>
  <button data-sec="sec-news"><span>📰</span>Новости</button>
  <button data-sec="sec-standards"><span>📚</span>Стандарты</button>
  <button data-sec="sec-faq"><span>❓</span>Вопрос/ответ</button>
</nav>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

// Переключение вкладок
document.querySelectorAll('.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.sec).classList.add('active');
    window.scrollTo(0, 0);
  });
});

const esc = s => (s || '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Аватар из Telegram: фото, если есть, иначе первая буква имени
function tgUserInfo() {
  try {
    const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
    return u || null;
  } catch (e) { return null; }
}

function avatarHtml() {
  // Сразу показываем букву-плейсхолдер, фото подтянется чуть позже
  const u = tgUserInfo();
  const initial = (u && u.first_name) ? u.first_name.trim().charAt(0).toUpperCase() : '👤';
  return `<div class="avatar">${esc(initial)}</div>`;
}

async function fillAvatar() {
  const el = document.querySelector('#profile-box .avatar');
  if (!el) return;
  const u = tgUserInfo();
  // Приоритет 1: photo_url из initData (если Telegram его передал)
  if (u && u.photo_url) {
    el.style.backgroundImage = `url('${esc(u.photo_url)}')`;
    el.textContent = '';
    return;
  }
  // Приоритет 2: тянем публичное фото профиля через наш API
  try {
    const resp = await fetch('/api/avatar', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ initData: tg.initData })
    });
    if (resp.ok) {
      const blob = await resp.blob();
      if (blob.size > 0) {
        el.style.backgroundImage = `url('${URL.createObjectURL(blob)}')`;
        el.textContent = '';
      }
    }
    // 204 или ошибка — остаётся буква, это нормальное поведение
  } catch (e) { /* остаётся буква */ }
}

async function loadProfile() {
  const box = document.getElementById('profile-box');
  try {
    const resp = await fetch('/api/profile', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ initData: tg.initData })
    });
    const data = await resp.json();
    if (resp.ok && data.registered) {
      const p = data.profile;
      box.innerHTML = `
      <div class="profile-card">
        <div class="profile-header">
          ${avatarHtml()}
          <div class="p-name">${esc(p.full_name)}</div>
          <div class="p-pos">${esc(p.position)}</div>
          <span class="badge">✅ Активен</span>
        </div>
        <div class="info-list">
          <div class="info-row"><span class="ico">💼</span><span class="lbl">Должность</span><span class="val">${esc(p.position)}</span></div>
          <div class="info-row"><span class="ico">📍</span><span class="lbl">Ресторан</span><span class="val">${esc(p.restaurant)}</span></div>
          <div class="info-row"><span class="ico">📞</span><span class="lbl">Телефон</span><span class="val"><a href="tel:${esc(p.phone)}">${esc(p.phone)}</a></span></div>
          <div class="info-row"><span class="ico">🎂</span><span class="lbl">Дата рождения</span><span class="val">${esc(p.birth_date)}</span></div>
        </div>
        <div class="profile-footer">💡 Изменить данные можно только через администратора</div>
      </div>`;
      fillAvatar();
    } else if (resp.status === 401) {
      box.innerHTML = '<div class="card">⚠️ Ошибка авторизации Telegram. Закрой приложение и открой заново из бота.</div>';
    } else if (resp.status === 403) {
      box.innerHTML = `
      <div class="profile-card">
        <div class="profile-header">
          ${avatarHtml()}
          <div class="p-name">Доступ ограничен</div>
          <span class="badge blocked">🚫 Заблокирован</span>
        </div>
        <div class="profile-footer">Обратись к администратору.</div>
      </div>`;
      fillAvatar();
    } else {
      box.innerHTML = '<div class="card">Ты ещё не зарегистрирован.<br>Напиши /start в боте и пройди регистрацию.</div>';
    }
  } catch (e) {
    box.innerHTML = '<div class="card">Ошибка загрузки профиля: ' + esc(String(e)) + '</div>';
  }
}

async function loadRestaurants() {
  const box = document.getElementById('restaurants-list');
  try {
    const resp = await fetch('/api/restaurants');
    const list = await resp.json();
    box.innerHTML = list.map(r => {
      const mapUrl = r.org
        ? `https://yandex.ru/maps/org/${r.org}`
        : `https://yandex.ru/maps/?text=${encodeURIComponent('Воккер ' + r.address)}`;
      return `
      <div class="card">
        <b>${esc(r.name)}</b>
        <div class="muted">📍 ${esc(r.address)}</div>
        <div class="muted">🕒 ${esc(r.hours).replaceAll('\n', '<br>')}</div>
        <div class="muted">📞 <a href="tel:${esc(r.phone)}">${esc(r.phone)}</a></div>
        <a href="${mapUrl}" target="_blank"><button class="btn">Открыть на Яндекс Картах</button></a>
      </div>`;
    }).join('');
  } catch (e) {
    box.innerHTML = '<div class="card">Ошибка загрузки списка ресторанов</div>';
  }
}

async function loadNews() {
  const box = document.getElementById('news-list');
  try {
    const resp = await fetch('/api/news');
    const list = await resp.json();
    if (!list.length) {
      box.innerHTML = '<div class="card">Пока новостей нет 📰</div>';
      return;
    }
    box.innerHTML = list.map(n => {
      const lvl = ['urgent', 'important'].includes(n.level) ? n.level : 'normal';
      return `
      <div class="card level-${lvl}">
        <b>${esc(n.title)}</b>
        <div>${esc(n.text)}</div>
        <div class="news-date">${esc(n.date)}</div>
      </div>`;
    }).join('');
  } catch (e) {
    box.innerHTML = '<div class="card">Ошибка загрузки новостей</div>';
  }
}

async function loadStandards() {
  const box = document.getElementById('standards-list');
  try {
    const resp = await fetch('/api/standards');
    const list = await resp.json();
    box.innerHTML = list.map(s => `
      <div class="card">
        <b>${esc(s.title)}</b>
        <div class="muted">${esc(s.category)}</div>
        <div style="margin-top:6px">${esc(s.description)}</div>
        ${s.url ? `<a href="${esc(s.url)}" target="_blank"><button class="btn">Открыть</button></a>` : ''}
      </div>`).join('');
  } catch (e) {
    box.innerHTML = '<div class="card">Ошибка загрузки стандартов</div>';
  }
}

async function loadFaq() {
  const box = document.getElementById('faq-list');
  try {
    const resp = await fetch('/api/faq');
    const list = await resp.json();
    box.innerHTML = list.map(f => `
      <details>
        <summary>${esc(f.question)}</summary>
        <p>${esc(f.answer)}</p>
      </details>`).join('');
  } catch (e) {
    box.innerHTML = '<div class="card">Ошибка загрузки вопросов</div>';
  }
}

document.getElementById('send-question').addEventListener('click', async () => {
  const input = document.getElementById('question-input');
  const text = input.value.trim();
  if (!text) return;
  try {
    const resp = await fetch('/api/questions', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ initData: tg.initData, question: text })
    });
    if (resp.ok) {
      input.value = '';
      alert('Вопрос отправлен! Ответ увидишь в боте.');
    } else if (resp.status === 401) {
      alert('Ошибка авторизации. Закрой приложение и открой заново из бота.');
    } else {
      alert('Не удалось отправить вопрос. Попробуй позже.');
    }
  } catch (e) {
    alert('Ошибка сети');
  }
});

loadProfile();
loadRestaurants();
loadNews();
loadStandards();
loadFaq();
</script>
</body>
</html>
